name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.go'
      - 'update.go'
      - 'accel.go'
      - 'firefox.go'
      - 'procomp.go'
      - 'proc_windows.go'
      - 'proc_other.go'
      - 'index.html'
      - 'go.mod'
      - 'go.sum'
      - 'ssh.go'
      - 'servermon.go'
      - 'servermon_agent.go'
      - 'winmgr.go'
      - 'winmgr_windows.go'
      - 'winmgr_other.go'
      - 'diag.go'
      - 'settings.go'
      - 'nodes.go'
      - 'notify.go'
      - 'vault.go'
      - 'vaultspace_windows.go'
      - 'vaultspace_other.go'
      - 'storage.go'
      - 'files.go'
      - 'owncheck.go'
      - 'winset.go'
      - 'wingeom.go'
      - 'thumb.go'
      - 'thumb_windows.go'
      - 'icons.go'
      - 'icons_data.go'
      - 'shellview.go'
      - 'tray_windows.go'
      - 'tray_other.go'
      - 'hotkey.go'
      - 'hotkey_windows.go'
      - 'hotkey_other.go'
      - 'viewcmd.go'
      - 'bosskey.go'
      - 'remote.go'
      - 'remote_tsnet.go'
      - 'remote_stub.go'
      - 'apps.go'
      - 'apps.json'
      - 'openclaw.go'
      - 'openclaw_plus.go'
      - 'openclaw_windows.go'
      - 'openclaw_other.go'
      - 'sandbox.go'
      - 'sandbox_windows.go'
      - 'sandbox_other.go'
      - 'immerse.go'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Fetch sing-box core (official v1.14.4, legacy Windows 7 build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64-legacy-windows-7.zip" -OutFile "singbox.zip"
          $len = (Get-Item "singbox.zip").Length
          Write-Host "singbox.zip bytes: $len"
          if ($len -ne 27010034) { throw "sing-box zip size mismatch: $len" }

      - name: Download Go modules (incl. tailscale/tsnet)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download

      # The Sandboxie installer is embedded into the EXE (v0.39) but
      # never committed to git: fetch the pinned official package,
      # verify size + SHA-256, and stage it at the go:embed path.
      - name: Fetch Sandboxie component (official v1.18.8, pinned, embedded)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sandboxie-plus/Sandboxie/releases/download/v1.18.8/Sandboxie-Plus-x64-v1.18.8.exe" -OutFile "assets/sandboxie-plus-x64-v1.18.8.exe"
          $len = (Get-Item "assets/sandboxie-plus-x64-v1.18.8.exe").Length
          Write-Host "sandboxie installer bytes: $len"
          if ($len -ne 24930680) { throw "Sandboxie installer size mismatch: $len" }
          $hash = (Get-FileHash "assets/sandboxie-plus-x64-v1.18.8.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "sandboxie installer sha256: $hash"
          if ($hash -ne "f27078ff74a07906fd51476079e1a7a8f5e20c8bb75a9d2ae86169d47179ae76") { throw "Sandboxie installer sha256 mismatch: $hash" }

      - name: Build single-file EXE (windows/amd64)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-H windowsgui -s -w" -o MJ-System.exe .
          (Get-Item "MJ-System.exe").Length

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "MJ-System.exe" -DestinationPath "MJ-System-64bit.zip" -Force
          (Get-Item "MJ-System-64bit.zip").Length
          $hash = (Get-FileHash "MJ-System-64bit.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "MJ-System-64bit.zip").Length
          $manifest = [ordered]@{ version = "0.56"; file = "MJ-System-64bit.zip"; size = $size; sha256 = $hash }
          $json = $manifest | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "update.json"), $json, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "update.json"


      - name: Package Firefox component (ESR 153.5.1 zh-CN, portable)
        shell: pwsh
        run: |
          $ffver = "153.5.1esr"
          $url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/$ffver/win64/zh-CN/Firefox%20Setup%20$ffver.exe"
          Invoke-WebRequest -Uri $url -OutFile "ffsetup.exe"
          $ilen = (Get-Item "ffsetup.exe").Length
          Write-Host "ffsetup.exe bytes: $ilen"
          if ($ilen -lt 50000000) { throw "Firefox installer too small: $ilen" }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip x "ffsetup.exe" "-offx" -y | Out-Null
          if (!(Test-Path "ffx\core\firefox.exe")) { throw "firefox.exe not found after extract" }
          New-Item -ItemType Directory -Force -Path "ffx\core\distribution" | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD "ffx\core\distribution\policies.json"), '{ "policies": { "DisableAppUpdate": true } }', (New-Object System.Text.UTF8Encoding $false))
          Compress-Archive -Path "ffx\core\*" -DestinationPath "MJ-Firefox.zip" -Force
          $fhash = (Get-FileHash "MJ-Firefox.zip" -Algorithm SHA256).Hash.ToLower()
          $fsize = (Get-Item "MJ-Firefox.zip").Length
          $fman = [ordered]@{ version = $ffver; file = "MJ-Firefox.zip"; size = $fsize; sha256 = $fhash }
          $fjson = $fman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "firefox.json"), $fjson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "firefox.json"

      - name: Assemble OpenClaw component (portable Node v24.22.1 + OpenClaw 2026.10.8)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ocVer = "2026.10.8"
          $nodeVer = "24.22.1"
          $stage = Join-Path $PWD "oc-stage"
          $comp = Join-Path $stage "component"
          $runtimeDir = Join-Path $comp "runtime"
          $appDir = Join-Path $comp "app"
          New-Item -ItemType Directory -Force -Path $runtimeDir, $appDir | Out-Null
          # Portable Node: official win-x64 zip from nodejs.org, its
          # contents land directly in component\runtime (node.exe at
          # the runtime root), same layout as the validation runs.
          $nodeZip = Join-Path $stage "node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVer/node-v$nodeVer-win-x64.zip" -OutFile $nodeZip
          Write-Host "node zip bytes: $((Get-Item $nodeZip).Length)"
          Expand-Archive -Path $nodeZip -DestinationPath (Join-Path $stage "node-x") -Force
          Copy-Item -Path (Join-Path $stage "node-x\node-v$nodeVer-win-x64\*") -Destination $runtimeDir -Recurse -Force
          $nodeExe = Join-Path $runtimeDir "node.exe"
          if (!(Test-Path $nodeExe)) { throw "node.exe missing after extract" }
          # Runtime pinning (validation run #1 died right here: install
          # scripts resolved bare `node` to the runner's preinstalled
          # Node 22 and OpenClaw's version check aborted the install).
          # Same triple pinning as openclaw-validate.yml: PATH first,
          # --scripts-prepend-node-path=true, absolute-path calls, and
          # a fail-fast guard before installing anything.
          $env:PATH = "$runtimeDir;$env:PATH"
          $nodeV = (& $nodeExe -v).Trim()
          Write-Host "node -v = $nodeV"
          if ($nodeV -ne "v$nodeVer") { throw "node version mismatch: $nodeV" }
          $resolvedNode = (Get-Command node -ErrorAction Stop).Source
          if (-not ($resolvedNode -like "$runtimeDir*")) { throw "node resolves outside component runtime: $resolvedNode" }
          $npm = Join-Path $runtimeDir "npm.cmd"
          # npm local-prefix install of the pinned OpenClaw into
          # component\app. The npm cache stays in the staging area,
          # never inside the component; the zip ships runtime + app
          # only (state is provisioned by the daemon at first start).
          $env:npm_config_cache = Join-Path $stage "npm-cache"
          $pkg = [ordered]@{ dependencies = [ordered]@{ openclaw = $ocVer } }
          ($pkg | ConvertTo-Json) | Set-Content (Join-Path $appDir "package.json") -Encoding utf8
          Push-Location $appDir
          & $npm install --no-audit --no-fund --loglevel=warn --scripts-prepend-node-path=true --registry "https://registry.npmjs.org/"
          $npmCode = $LASTEXITCODE
          Pop-Location
          if ($npmCode -ne 0) { throw "npm install failed: exit $npmCode" }
          $ocBin = Join-Path $appDir "node_modules\.bin\openclaw.cmd"
          if (!(Test-Path $ocBin)) { throw "openclaw entry shim missing after install: $ocBin" }
          $ocEntry = Join-Path $appDir "node_modules\openclaw\openclaw.mjs"
          if (!(Test-Path $ocEntry)) { throw "openclaw.mjs missing after install: $ocEntry" }
          $ocV = (& $ocBin --version 2>&1 | Out-String).Trim()
          Write-Host "openclaw --version = $ocV"
          if ($ocV -notlike "*$ocVer*") { throw "openclaw version mismatch: $ocV" }
          Compress-Archive -Path (Join-Path $comp "runtime"), (Join-Path $comp "app") -DestinationPath "MJ-OpenClaw.zip" -Force
          $osize = (Get-Item "MJ-OpenClaw.zip").Length
          Write-Host "MJ-OpenClaw.zip bytes: $osize"
          if ($osize -lt 100000000) { throw "OpenClaw component zip implausibly small: $osize" }
          $ohash = (Get-FileHash "MJ-OpenClaw.zip" -Algorithm SHA256).Hash.ToLower()
          $oman = [ordered]@{ version = $ocVer; file = "MJ-OpenClaw.zip"; size = $osize; sha256 = $ohash }
          $ojson = $oman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "openclaw.json"), $ojson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "openclaw.json"

      - name: Package ONLYOFFICE component (Desktop Editors 10.0.0, official portable zip)
        shell: pwsh
        run: |
          $ooVer = "10.0.0"
          $ooUrl = "https://github.com/ONLYOFFICE/DesktopEditors/releases/download/v$ooVer/DesktopEditors_x64.zip"
          Invoke-WebRequest -Uri $ooUrl -OutFile "oo.zip"
          $ooSize = (Get-Item "oo.zip").Length
          Write-Host "onlyoffice zip bytes: $ooSize"
          if ($ooSize -ne 397286158) { throw "onlyoffice zip size mismatch: $ooSize" }
          tar.exe -tf "oo.zip" | Out-File -Encoding utf8 "oo-list.txt"
          if (!(Select-String -Path "oo-list.txt" -SimpleMatch "DesktopEditors.exe" -Quiet)) { throw "DesktopEditors.exe not found in onlyoffice zip" }
          Copy-Item "oo.zip" "MJ-OnlyOffice.zip"
          $ooHash = (Get-FileHash "MJ-OnlyOffice.zip" -Algorithm SHA256).Hash.ToLower()
          $ooMan = [ordered]@{ version = $ooVer; file = "MJ-OnlyOffice.zip"; size = $ooSize; sha256 = $ooHash }
          $ooJson = $ooMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "onlyoffice.json"), $ooJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "onlyoffice.json"

      - name: Package LibreOffice component (26.8.2, official MSI admin-extract)
        shell: pwsh
        run: |
          $loVer = "26.8.2"
          $loUrl = "https://download.documentfoundation.org/libreoffice/stable/$loVer/win/x86_64/LibreOffice_${loVer}_Win_x86-64.msi"
          Invoke-WebRequest -Uri $loUrl -OutFile "lo.msi"
          $msiSize = (Get-Item "lo.msi").Length
          Write-Host "libreoffice msi bytes: $msiSize"
          if ($msiSize -ne 375934976) { throw "libreoffice msi size mismatch: $msiSize" }
          $loDir = Join-Path $PWD "lo-admin"
          $loProc = Start-Process msiexec.exe -ArgumentList "/a `"$PWD\lo.msi`" /qn TARGETDIR=`"$loDir`"" -Wait -PassThru
          if ($loProc.ExitCode -ne 0) { throw "msiexec /a failed: exit $($loProc.ExitCode)" }
          $sofficeItem = Get-ChildItem $loDir -Recurse -Filter "soffice.exe" | Select-Object -First 1
          if (!$sofficeItem) { throw "soffice.exe missing after admin extract" }
          $loRoot = $sofficeItem.Directory.Parent.FullName
          Write-Host "libreoffice root: $loRoot"
          Compress-Archive -Path (Join-Path $loRoot "*") -DestinationPath "MJ-LibreOffice.zip" -Force
          tar.exe -tf "MJ-LibreOffice.zip" | Out-File -Encoding utf8 "lo-list.txt"
          if (!(Select-String -Path "lo-list.txt" -SimpleMatch "soffice.exe" -Quiet)) { throw "soffice.exe not in MJ-LibreOffice.zip" }
          $loSize = (Get-Item "MJ-LibreOffice.zip").Length
          Write-Host "MJ-LibreOffice.zip bytes: $loSize"
          if ($loSize -lt 100000000) { throw "libreoffice component zip implausibly small: $loSize" }
          $loHash = (Get-FileHash "MJ-LibreOffice.zip" -Algorithm SHA256).Hash.ToLower()
          $loMan = [ordered]@{ version = $loVer; file = "MJ-LibreOffice.zip"; size = $loSize; sha256 = $loHash }
          $loJson = $loMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "libreoffice.json"), $loJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "libreoffice.json"

      - name: Package ImageGlass component (10.0.6.906, official portable zip)
        shell: pwsh
        run: |
          $igVer = "10.0.6.906"
          $igUrl = "https://github.com/d2phap/ImageGlass/releases/download/$igVer/ImageGlass_${igVer}_win-x64.zip"
          Invoke-WebRequest -Uri $igUrl -OutFile "ig.zip"
          $igSize = (Get-Item "ig.zip").Length
          Write-Host "imageglass zip bytes: $igSize"
          if ($igSize -ne 43934433) { throw "imageglass zip size mismatch: $igSize" }
          tar.exe -tf "ig.zip" | Out-File -Encoding utf8 "ig-list.txt"
          if (!(Select-String -Path "ig-list.txt" -SimpleMatch "ImageGlass.exe" -Quiet)) { throw "ImageGlass.exe not found in imageglass zip" }
          Copy-Item "ig.zip" "MJ-ImageGlass.zip"
          $igHash = (Get-FileHash "MJ-ImageGlass.zip" -Algorithm SHA256).Hash.ToLower()
          $igMan = [ordered]@{ version = $igVer; file = "MJ-ImageGlass.zip"; size = $igSize; sha256 = $igHash }
          $igJson = $igMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "imageglass.json"), $igJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "imageglass.json"

      - name: Package Krita component (6.0.4.1, official portable zip)
        shell: pwsh
        run: |
          $krVer = "6.0.4.1"
          $krUrl = "https://download.kde.org/stable/krita/$krVer/krita-x64-$krVer.zip"
          Invoke-WebRequest -Uri $krUrl -OutFile "kr.zip"
          $krSize = (Get-Item "kr.zip").Length
          Write-Host "krita zip bytes: $krSize"
          if ($krSize -ne 245761499) { throw "krita zip size mismatch: $krSize" }
          tar.exe -tf "kr.zip" | Out-File -Encoding utf8 "kr-list.txt"
          if (!(Select-String -Path "kr-list.txt" -SimpleMatch "krita.exe" -Quiet)) { throw "krita.exe not found in krita zip" }
          Copy-Item "kr.zip" "MJ-Krita.zip"
          $krHash = (Get-FileHash "MJ-Krita.zip" -Algorithm SHA256).Hash.ToLower()
          $krMan = [ordered]@{ version = $krVer; file = "MJ-Krita.zip"; size = $krSize; sha256 = $krHash }
          $krJson = $krMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "krita.json"), $krJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "krita.json"

      - name: Package VSCodium component (1.143.17232, official portable zip)
        shell: pwsh
        run: |
          $vsVer = "1.143.17232"
          $vsUrl = "https://github.com/VSCodium/vscodium/releases/download/$vsVer/VSCodium-win32-x64-$vsVer.zip"
          Invoke-WebRequest -Uri $vsUrl -OutFile "vs.zip"
          $vsSize = (Get-Item "vs.zip").Length
          Write-Host "vscodium zip bytes: $vsSize"
          if ($vsSize -ne 231406156) { throw "vscodium zip size mismatch: $vsSize" }
          tar.exe -tf "vs.zip" | Out-File -Encoding utf8 "vs-list.txt"
          if (!(Select-String -Path "vs-list.txt" -SimpleMatch "VSCodium.exe" -Quiet)) { throw "VSCodium.exe not found in vscodium zip" }
          Copy-Item "vs.zip" "MJ-VSCodium.zip"
          $vsHash = (Get-FileHash "MJ-VSCodium.zip" -Algorithm SHA256).Hash.ToLower()
          $vsMan = [ordered]@{ version = $vsVer; file = "MJ-VSCodium.zip"; size = $vsSize; sha256 = $vsHash }
          $vsJson = $vsMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "vscodium.json"), $vsJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "vscodium.json"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.56-test1
          prerelease: true
          name: 铭杰终端机 v0.56-test1【测试版】（64 位单文件版 · 七件套：台前调度真容 / Firefox 模式冲突 / 窗口记忆 / 文件夹全装 / 图标右键菜单 / 新图标 / 图标大小与排序）
          body: |
            64 位单文件版：解压后运行 MJ-System.exe（需 64 位 Windows）。
            第一次运行会自动释放内置 sing-box 核心，数据保存在 EXE 旁的 Data/ 文件夹（节点、网站应用、桌面布局都在里面，跟着文件夹走）。
            应用内更新：v0.6 起在「设置 → 软件更新」里完成，仓库公开、免令牌。
            近版功能：网站应用化（真实图标、双击打开、文件夹分组）、软件内全局加速、台前调度（左侧实时缩略图）、窗口统一（外部应用统一调度与开窗落位）、SSH 远程终端、内置调试控制台（状态与日志集中查看、一键导出诊断包）、小窗手机宽（终端未最大化或较窄时网站应用以手机宽打开）、应用商店（官方便携应用直下进 Data/apps，校验钉死）、小龙虾组件、服务器监控面板。
            本版 v0.56：铭杰终端机 v0.56 七件套（2026-10-30 晚真机反馈逐项讨论定的形状，一版全做）：① 台前调度换真容——外部窗口卡片默认显示窗口的真实画面缩略图（守护进程在宿主机上抓窗口快照，只在本机界面里供，远程协助通道不带这个口），抓不到（最小化、个别 GPU 程序）时自动退回「应用标识」卡片：清理过的页面标题（去掉「— Mozilla Firefox」「- Google Chrome」尾巴）+ 应用真实图标，设置 → 桌面与 Dock 可切换「窗口预览 / 应用标识」。此前两个 Firefox 窗口在台前调度里长得一模一样（同字母块、标题被截断）的问题就此解决。② Firefox 模式冲突根治——真机实锤的根因：Firefox 是单进程浏览器，普通/应用化在进程启动那一刻由档案里的 userChrome.css 定死，之后再点另一种打开只会加入现有进程、继承它的模式（双向都中招），而守护进程每次打开还重写档案样式，盘上样式和活进程的外观就此分家。本版起守护进程记录进程的出生模式（Data/ffstate.json），同模式打开照旧、不同模式（或出生模式未知）绝不静默打开：Firefox 页明确提示「正以 XX 模式运行」并给一键「重启并切换」（优雅关窗、等档案锁释放、最长约 15 秒、超时如实报错不强杀）；冲突时不再重写盘上样式；进程出生/退出与每次样式播种都进控制台（此前这是控制台的盲区）；应用化样式顺带补上菜单栏隐藏（此前会漏出来）。③ 窗口大小记忆——每个应用关窗时的尺寸与位置按身份记住（桌面应用按应用、商店/组件按其 id、网站应用窗口按站点、普通浏览器窗口按应用），下次打开优先按记忆落位并自动收回当前桌面范围内；记忆存 Data/wingeom.json 跟着文件夹走，设置 → 桌面与 Dock 可一键清除，卸载商店应用/组件时其记忆一并清掉。④ 文件夹什么都能装——成员从「只有网站应用」放宽到全部桌面条目（系统应用、网站应用、商店应用、隔离应用、组件、Firefox、导入文件），三种进法：拖到文件夹图标上、把文件夹打开后拖进面板、文件夹里「添加」选择器（外加文件夹内「导入文件」直接落位）；一个条目只有一个家（移入即从顶层消失），成员可拖回桌面，空文件夹保留；启动台与聚焦搜索的口径与桌面一致。老布局（文件夹里是网站地址）载入时自动迁移，排列与成员不变。⑤ 图标右键菜单——右击图标出它自己的菜单（此前一律是桌面空白菜单）：网站应用 打开/调整窗口▸/卸载（调整窗口是四档单选：记忆/手机/桌面/全屏，存在条目上、下次打开生效、不强改已开窗口；按你的决定没有「编辑」）；商店应用 打开/卸载（沿用商店卸载的数据警告）；组件与 Firefox 打开/卸载组件（Firefox 卸载保留档案并在确认框里写明）；系统应用只有打开；导入文件 打开/在「文件」中显示/从桌面移除（只删图标、文件还在）/删除文件（真删、确认、连带清出文件夹）；文件夹 打开/重命名/解散（成员回桌面）。⑥ 图标换新（方案 A）——内置应用换成 macosicons.com 的 macOS 风格图标（工作站 = iMac Monterey、终端 = Terminal、文件 = Finder、浏览器 = Chrome、SSH = .ssh、服务器 = 活动监视器、控制台 = Console、应用商店 = App Store、小龙虾 = OpenClaw 吉祥物、节点 = VPN 锁、设置 = 系统偏好设置齿轮），均为 1024 原图压到 256 内嵌；每个图标的出处（站内名、上传者、链接）记在仓库 icon-provenance.md，将来回头换自制时有账可查；图标加载失败会自动退回原来的绘制图标。联系表（icon-contact-sheet.png）在仓库根目录可先过目。⑦ 桌面图标大小与排序——一个设置键三处可调：设置 → 外观滑杆、控制中心滑杆、桌面空白右键菜单「图标大小」子菜单（小/标准/大/特大），网格间距随大小实时缩放（Dock 不受影响）；排序方式五档单选（手动/名称/最常用/种类/添加日期）同样在设置与右键菜单里切换，最常用按打开次数（计数存在布局里跟着走），活动排序下手动拖任何图标即切回手动；排序只作用于顶层，文件夹内顺序不动。
            本版真机待验：台前调度预览图的清晰度与刷新手感、最小化窗口保住最后一帧、抓不到画面的程序退回标识卡；Firefox 双向冲突各触发一次并用「重启并切换」走通（含标签页会话恢复的实际情况）、应用化下菜单栏不再漏出；几个应用改大小关掉重开是否回到原大小原位置、换一台小屏电脑后记忆窗口不飞出屏幕；把商店应用/文件拖进文件夹、从打开的文件夹里拖出来、添加选择器与文件夹内导入各走一遍；网站应用四档窗口模式各设一次并重开验证；新图标在桌面/Dock/启动台三处的观感（联系表先审）；图标大小三档切换与五种排序的实际效果。
            上一版 v0.55：紧急修复 v0.54 的桌面图标全灭（前端脚本初始化顺序的 TDZ 故障：FFSTATE 声明晚于 Dock 构建循环数百行），声明提前 + 名单链逐项降级纪律 + 桌面启动回归测试（deskboot_test.js，真机已验：升级后图标全数回来、顺序与 v0.53 时一致）。v0.54 的六项修复（开窗呈现方向、Firefox 标题栏按钮、Chrome 深色框、文件音乐/视频分类、数据回退响亮化、通知分类）内容不变。
            MJ-Firefox.zip / firefox.json 是 Firefox 组件的安装包与校验清单，MJ-OpenClaw.zip / openclaw.json 是小龙虾组件的安装包与校验清单，MJ-OnlyOffice.zip / onlyoffice.json、MJ-LibreOffice.zip / libreoffice.json、MJ-ImageGlass.zip / imageglass.json、MJ-Krita.zip / krita.json、MJ-VSCodium.zip / vscodium.json 是 v0.51 五个生产力组件的安装包与校验清单，都由程序按需下载，手动使用主程序时不用管。
            update.json 是给程序自动更新用的校验清单（版本/大小/SHA-256），手动下载时不用管它。
