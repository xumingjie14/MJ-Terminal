<!--
  MJ Terminal desktop page -- SHELL TEMPLATE (v0.58).

  This file is the source of the page's markup and CSS. The three
  script blocks are filled by web/build.mjs from the TypeScript
  modules under web/src (three esbuild bundles + the five
  node-testable pure-function segments, inlined between their
  marker comments). The build writes the finished page to
  ../index.html -- the file the daemon embeds. NEVER edit
  ../index.html by hand: edit the modules (or this shell) and run
  `npm run build` (see web/README.md).
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>铭杰工作站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --glass:rgba(30,30,36,.58);
  --glass-brd:rgba(255,255,255,.22);
  --field:rgba(255,255,255,.09);
  --field-brd:rgba(255,255,255,.16);
  --txt:#f5f5f7;
  --accent:#0a84ff;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:background .5s ease}
/* ---------- menu bar ---------- */
#menubar{position:fixed;top:0;left:0;right:0;height:38px;z-index:1000;display:flex;align-items:center;gap:18px;padding:0 16px;background:rgba(22,22,28,.34);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.14);font-size:13.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#menubar .logo{font-weight:700;font-size:15px;cursor:pointer}
#menubar .mi{opacity:.92;cursor:default}
#menubar .mi b{font-weight:600}
#menubar .sp{flex:1}
#menubar .right{display:flex;align-items:center;gap:16px}
#mb-node{cursor:pointer;display:flex;align-items:center;gap:6px}
#mb-remote{cursor:pointer;display:none;align-items:center;gap:6px;padding:2px 9px;border-radius:9px;background:rgba(255,214,10,.16);border:1px solid rgba(255,214,10,.35)}
#mb-remote #mb-rdot{width:9px;height:9px;border-radius:50%;background:#ffd60a;box-shadow:0 0 8px #ffd60a}
#mb-remote.active{background:rgba(48,209,88,.22);border-color:rgba(48,209,88,.5)}
#mb-remote.active #mb-rdot{background:#30d158;box-shadow:0 0 8px #30d158}
#mb-dot{width:9px;height:9px;border-radius:50%;background:#8e8e93;box-shadow:0 0 6px rgba(0,0,0,.3)}
#mb-dot.on{background:#30d158;box-shadow:0 0 8px #30d158}
#mb-clock{font-variant-numeric:tabular-nums;cursor:pointer}
/* ---------- control center / notification center / banners (v0.47) ----------
   Durations match the named JS constants in the v0.47 block
   (ANIM_PANEL_MS .28s dropdown, ANIM_NC_MS .3s column slide,
   ANIM_BANNER_MS .32s banner) -- macOS-scale, per the manual. */
#mb-cc{cursor:pointer;display:flex;align-items:center;padding:3px 5px;border-radius:8px}
#mb-cc:hover,#mb-cc.on{background:rgba(255,255,255,.16)}
#mb-priv{width:9px;height:9px;border-radius:50%;background:#ff9f0a;box-shadow:0 0 7px rgba(255,159,10,.9);display:none;margin-left:-9px}
.glasspanel{background:rgba(28,28,36,.55);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 50px rgba(0,0,0,.45);color:#fff}
#ccpanel{position:fixed;top:46px;right:10px;width:356px;border-radius:20px;padding:14px;z-index:1500;transition:opacity .28s ease,transform .28s ease}
/* v0.48: the 铭杰 (Apple-position) menu + the vault lock screen */
#mbmenu{position:fixed;top:46px;left:10px;width:264px;border-radius:14px;padding:6px;z-index:1600}
#mbmenu.hidden{display:none}
#mbmenu .mbm-it,#mbdrop .mbm-it{padding:6px 12px;border-radius:8px;font-size:13.5px;cursor:pointer;color:#fff;white-space:nowrap}
#mbmenu .mbm-it:hover,#mbdrop .mbm-it:hover{background:rgba(10,132,255,.85)}
#mbmenu .mbm-sep,#mbdrop .mbm-sep{height:1px;background:rgba(255,255,255,.18);margin:5px 10px}
/* v0.50: the full menu bar （文件/编辑/显示/窗口/帮助 + front-app menu)
   drops from #mbdrop; items carry macOS state grammar -- a check
   column for toggles, a right-aligned shortcut, greyed when the
   context does not apply (never a dead item). */
#mbdrop{position:fixed;top:46px;min-width:252px;border-radius:14px;padding:6px;z-index:1600}
#mbdrop.hidden{display:none}
#mbdrop .mbm-it.dis{opacity:.38;pointer-events:none}
#mbdrop .mbm-it .mbm-ck{display:inline-block;width:17px;margin-left:-5px}
#mbdrop .mbm-it .mbm-key{float:right;opacity:.6;margin-left:30px;font-size:12.5px}
#mbdrop .mbm-it .mbm-sub{opacity:.6;font-size:12px}
#menubar .mi.on{background:rgba(255,255,255,.18);border-radius:6px}
#menubar .mi{padding:2px 7px;margin:0 -7px}
#mb-spot{cursor:pointer;display:inline-flex;align-items:center;padding:3px 4px;border-radius:6px}
#mb-spot:hover,#mb-spot.on{background:rgba(255,255,255,.16)}
/* v0.50 Launchpad: full-screen paged grid over the blurred
   wallpaper; one layout source with the desktop (DESKORDER). */
#launchpad{position:fixed;inset:0;z-index:2400;display:flex;flex-direction:column;align-items:center;padding:8vh 3vw 4vh;background:rgba(16,16,24,.34);backdrop-filter:blur(36px) saturate(160%);-webkit-backdrop-filter:blur(36px) saturate(160%);color:#fff}
#launchpad.hidden{display:none}
#launchpad.open{animation:lpIn .24s ease}
@keyframes lpIn{from{opacity:0;transform:scale(1.045)}to{opacity:1;transform:scale(1)}}
#lp-q{width:min(330px,72vw);padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);color:#fff;font-size:15px;outline:none;text-align:left}
#lp-q::placeholder{color:rgba(255,255,255,.55)}
#lp-pages{flex:1;width:100%;position:relative;overflow:hidden;margin-top:3.2vh}
.lp-page{position:absolute;inset:0;display:grid;justify-content:center;align-content:start}
.lp-item{width:108px;background:none;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 2px;border-radius:14px;font:inherit;touch-action:none;user-select:none;-webkit-user-select:none}
.lp-item:hover{background:rgba(255,255,255,.08)}
.lp-item .appico{width:62px;height:62px;border-radius:15px;font-size:30px;pointer-events:none}
.lp-item .lpn{font-size:12.5px;text-shadow:0 1px 5px rgba(0,0,0,.6);line-height:1.3;text-align:center;max-width:102px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
.lp-item.dragsrc{opacity:.3}
.lp-ghost{position:fixed;z-index:2450;pointer-events:none;transform:scale(1.06);filter:drop-shadow(0 14px 24px rgba(0,0,0,.5))}
#lp-dots{display:flex;gap:8px;padding-top:12px;min-height:8px}
#lp-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
#lp-dots i.on{background:#fff}
.lp-empty{opacity:.65;font-size:15px;margin-top:8vh}
/* v0.50 Spotlight: floating card, grouped results, full keyboard. */
#spotlight{position:fixed;inset:0;z-index:2700;display:flex;justify-content:center;padding-top:15vh}
#spotlight.hidden{display:none}
#spot-card{width:min(620px,92vw);height:fit-content;border-radius:16px;overflow:hidden}
#spotlight.open #spot-card{animation:spotIn .18s ease}
@keyframes spotIn{from{opacity:0;transform:scale(.965) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
#spot-in{width:100%;box-sizing:border-box;background:transparent;border:0;outline:none;color:#fff;font-size:22px;padding:15px 18px 11px;font:inherit;font-size:22px}
#spot-in::placeholder{color:rgba(255,255,255,.45)}
#spot-res{max-height:54vh;overflow:auto;padding:2px 8px 10px}
.spot-gh{font-size:11.5px;letter-spacing:.05em;opacity:.55;padding:10px 10px 3px}
.spot-it{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:14.5px;color:#fff}
.spot-it.sel{background:rgba(10,132,255,.85)}
.spot-it .appico{width:30px;height:30px;border-radius:8px;font-size:16px;flex:none}
.spot-it .sic{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(255,255,255,.14)}
.spot-it .snm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-it .sub{margin-left:auto;font-size:12px;opacity:.55;white-space:nowrap;padding-left:10px}
.spot-none{padding:16px 12px;opacity:.6;font-size:14px}
/* v0.50 Files as Finder: sidebar + toolbar + views + preview. */
.fv{display:flex;flex-direction:column;height:100%}
.fv-path{padding:11px 16px 7px;font-size:13px;opacity:.78}
.fv-path b{color:#fff;font-weight:600}
.fv-main{flex:1;display:flex;min-height:0}
.fv-side{width:176px;flex:none;border-right:1px solid rgba(255,255,255,.1);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.fv-sit{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:6px;color:#fff}
.fv-sit:hover{background:rgba(255,255,255,.08)}
.fv-sit.on{background:rgba(10,132,255,.8)}
.fv-sit .cnt{opacity:.6;font-size:12px}
.fv-center{flex:1;display:flex;flex-direction:column;min-width:0}
.fv-tools{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.fv-tools .seg button.on{background:rgba(255,255,255,.88);color:#111;font-weight:600}
.fv-q{flex:1;min-width:110px;max-width:230px;margin-left:auto;padding:5px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;font-size:13px;outline:none}
.fv-q::placeholder{color:rgba(255,255,255,.5)}
.fv-sorts{padding:5px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;font-size:13px;outline:none}
.fv-sorts option{color:#111}
.fv-body{flex:1;overflow:auto;padding:12px}
.fv-grid{display:grid;grid-template-columns:repeat(auto-fill,98px);gap:6px}
.fv-it{width:98px;background:none;border:0;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;border-radius:12px;user-select:none;-webkit-user-select:none}
.fv-it:hover{background:rgba(255,255,255,.07)}
.fv-it.sel{background:rgba(10,132,255,.48)}
.fv-it .appico{width:52px;height:52px;pointer-events:none}
.fv-it .fvn{font-size:12px;text-align:center;line-height:1.3;max-width:94px;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
table.fv-tab{width:100%;border-collapse:collapse;font-size:13px;color:#fff}
.fv-tab th{text-align:left;padding:5px 8px;opacity:.65;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.14);user-select:none}
.fv-tab td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.fv-tab tbody tr{cursor:pointer}
.fv-tab tbody tr.sel td{background:rgba(10,132,255,.42)}
.fv-cols{display:flex;height:100%}
.fv-col{width:208px;flex:none;overflow:auto;border-right:1px solid rgba(255,255,255,.09);padding:6px}
.fv-col .fv-it{width:100%;flex-direction:row;justify-content:flex-start;padding:6px 8px;gap:9px}
.fv-col .fv-it .appico{width:28px;height:28px;border-radius:7px;font-size:14px;flex:none}
.fv-col .fv-it .fvn{text-align:left;max-width:140px}
.fv-colh{font-size:11.5px;opacity:.55;padding:4px 8px;letter-spacing:.04em}
.fv-prev{width:240px;flex:none;border-left:1px solid rgba(255,255,255,.1);padding:16px 14px;overflow:auto;text-align:center}
.fv-prev .appico{width:78px;height:78px;border-radius:17px;font-size:35px}
.fv-prev img.fv-thumb{max-width:100%;max-height:170px;border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.fv-pname{font-weight:650;font-size:14.5px;margin-top:11px;word-break:break-all;line-height:1.4}
.fv-pmeta{margin-top:9px;font-size:12.5px;opacity:.78;line-height:1.85;text-align:left}
.fv-pbtns{display:flex;flex-direction:column;gap:7px;margin-top:13px}
.fv-pbtns .btn{width:100%}
.fv-none{opacity:.6;font-size:13.5px;padding:22px 6px;text-align:center}
#lockscreen{position:fixed;inset:0;z-index:3000;display:none;background:rgba(16,16,22,.42);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%)}
#lockscreen.show{display:flex;align-items:center;justify-content:center}
.lk-card{text-align:center;color:#fff;width:min(340px,86vw)}
.lk-avatar{width:88px;height:88px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(180deg,#64d2ff,#0a62d6);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;box-shadow:0 10px 34px rgba(0,0,0,.45)}
.lk-name{font-size:21px;font-weight:650;margin-bottom:4px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.lk-sub{font-size:13px;opacity:.75;margin-bottom:18px}
.lk-form{display:flex;gap:8px;justify-content:center}
.lk-form input{width:200px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;font-size:14px;outline:none;text-align:center}
.lk-form input::placeholder{color:rgba(255,255,255,.55)}
.lk-form button{padding:8px 16px;border-radius:999px;border:none;background:rgba(255,255,255,.85);color:#111;font-size:14px;cursor:pointer}
.lk-err{color:#ffb4ae;font-size:13px;min-height:20px;margin-top:10px}
.lk-lasterr{display:none;color:#ffd9a8;background:rgba(255,159,10,.14);border:1px solid rgba(255,159,10,.35);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.55;margin-top:10px;text-align:left;word-break:break-word}
.lk-prog{margin-top:16px}
.lk-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.lk-bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .3s ease}
.lk-progtxt{font-size:12px;opacity:.75;margin-top:6px}
.lk-off{margin-top:26px;font-size:13px;opacity:.7;cursor:pointer}
.lk-off:hover{opacity:1}
@keyframes lkshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.lk-shake{animation:lkshake .45s ease}
#ccpanel.hidden{display:none}
#ccpanel.pop{opacity:0;transform:scale(.97) translateY(-6px)}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-tile{position:relative;border-radius:16px;background:rgba(255,255,255,.10);padding:11px 12px;cursor:pointer;min-height:58px;box-sizing:border-box}
.cc-tile:hover{background:rgba(255,255,255,.16)}
.cc-tile.wide{grid-column:1/-1}
.cc-tile .cc-ico{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#636366;color:#fff;align-items:center;justify-content:center;font-size:15px;vertical-align:top}
.cc-tile.on .cc-ico{background:#0a84ff}
.cc-tile .cc-tx{display:inline-block;margin-left:9px;vertical-align:top;max-width:calc(100% - 44px)}
.cc-tile .cc-name{font-size:13px;letter-spacing:-.2px;font-weight:600;line-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-tile .cc-sub{font-size:12px;opacity:.75;margin-top:2px;line-height:1.35}
.cc-tile .cc-chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);opacity:.55;font-size:13px;padding:6px}
.cc-list{margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:6px}
.cc-li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;font-size:13px;cursor:pointer}
.cc-li:hover{background:rgba(255,255,255,.12)}
.cc-li .cc-dot{width:8px;height:8px;border-radius:50%;background:#8e8e93;flex:none}
.cc-li .cc-dot.on{background:#30d158}
.cc-li .cc-cur{margin-left:auto;font-size:11.5px;opacity:.65}
.cc-slider{display:flex;align-items:center;gap:12px;margin-top:12px;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.10);font-size:13px}
.cc-slider input[type=range]{flex:1;accent-color:#0a84ff}
.cc-foot{margin-top:12px;text-align:center}
.cc-foot button{background:none;border:0;color:#fff;opacity:.8;font-size:13px;cursor:pointer;padding:4px 10px}
.cc-foot button:hover{opacity:1;text-decoration:underline}
#ncenter{position:fixed;top:46px;right:10px;bottom:12px;width:376px;border-radius:22px;z-index:1500;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s ease,opacity .3s ease}
#ncenter.nc-off{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
#nc-scroll{overflow-y:auto;padding:16px 14px;flex:1}
#nc-date{font-size:21px;font-weight:700;margin:2px 2px 12px}
.nc-sec{font-size:12.5px;font-weight:600;opacity:.6;margin:14px 2px 7px;letter-spacing:.4px}
.ncard{position:relative;border-radius:16px;background:rgba(255,255,255,.10);padding:11px 13px;margin-bottom:9px;cursor:pointer}
.ncard:hover{background:rgba(255,255,255,.15)}
.ncard .n-src{font-size:11.5px;opacity:.65;letter-spacing:.3px}
.ncard .n-title{font-size:13.5px;font-weight:600;margin-top:1px}
.ncard .n-body{font-size:12.5px;opacity:.8;margin-top:2px;line-height:1.45;word-break:break-word}
.ncard .n-time{position:absolute;right:12px;top:11px;font-size:11px;opacity:.55}
.ncard .n-act{margin-top:8px}
.ncard .n-act button{background:#0a84ff;color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.ncard .nx{position:absolute;left:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:rgba(90,90,100,.95);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:11px;line-height:18px;text-align:center;cursor:pointer;opacity:0;transition:opacity .15s}
.ncard:hover .nx,.nstack:hover .nx{opacity:1}
.nstack{position:relative;margin-bottom:9px}
.nstack .npeek{position:absolute;left:6px;right:6px;bottom:-5px;height:14px;border-radius:12px;background:rgba(255,255,255,.07);z-index:0}
.nstack .ncard{margin-bottom:0;position:relative;z-index:1}
.nstack .n-count{display:inline-block;background:rgba(255,255,255,.22);border-radius:8px;font-size:11px;padding:0 6px;margin-left:7px;vertical-align:1px}
.nstack .n-clear{position:absolute;right:2px;top:-24px;font-size:12px;opacity:0;cursor:pointer;background:none;border:0;color:#fff}
.nstack:hover .n-clear{opacity:.85}
.nc-showless{text-align:center;font-size:12.5px;opacity:.75;cursor:pointer;padding:3px 0 9px}
.nc-showless:hover{opacity:1}
.nc-empty{font-size:13px;opacity:.6;padding:8px 2px}
.wdg{border-radius:18px;background:rgba(255,255,255,.10);padding:12px 13px;margin-bottom:10px;cursor:pointer}
.wdg:hover{background:rgba(255,255,255,.15)}
.wdg .w-name{font-size:12.5px;font-weight:600;opacity:.75;margin-bottom:7px}
.wdg .w-big{font-size:15px;font-weight:600}
.wdg .w-sub{font-size:12.5px;opacity:.75;margin-top:2px}
.wdg .w-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:7px;overflow:hidden}
.wdg .w-bar i{display:block;height:100%;background:#30d158;border-radius:3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11.5px;text-align:center}
.cal-grid .cal-h{opacity:.55;padding:2px 0}
.cal-grid .cal-d{padding:3px 0;border-radius:50%}
.cal-grid .cal-d.dim{opacity:.3}
.cal-grid .cal-d.today{background:#ff453a;color:#fff;font-weight:700}
.wdg-edit{display:flex;align-items:center;gap:8px;border-radius:14px;background:rgba(255,255,255,.07);padding:9px 12px;margin-bottom:8px;font-size:13px}
.wdg-edit .row{margin-left:auto;display:flex;gap:6px;align-items:center}
.wdg-edit button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12px}
.nc-foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.12);text-align:center}
.nc-foot button{background:none;border:0;color:#fff;opacity:.8;font-size:13px;cursor:pointer}
.nc-foot button:hover{opacity:1;text-decoration:underline}
#banners{position:fixed;top:46px;right:10px;z-index:1600;display:flex;flex-direction:column;gap:10px;width:376px;pointer-events:none}

#dropveil{position:fixed;inset:10px;z-index:2900;border:2.5px dashed rgba(140,210,255,.9);border-radius:22px;background:rgba(20,40,70,.35);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:650;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
#dropveil.hidden{display:none}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:3200;background:rgba(28,28,34,.9);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;border-radius:12px;padding:10px 18px;font-size:13.5px;box-shadow:0 14px 34px rgba(0,0,0,.45);max-width:80vw;text-align:center}
#toast.hidden{display:none}
.imgstage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:rgba(0,0,0,.25);border-radius:12px;overflow:auto}
.imgstage img{max-width:100%;max-height:100%;object-fit:contain}
.imgstage img.full{max-width:none;max-height:none}
pre.textview{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.65;color:#e8e8ed}
table.gridtab th{background:rgba(255,255,255,.10);font-weight:650}
table.gridtab td,table.gridtab th{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
/* ---------- app store (v0.24) ---------- */
.stcat{text-align:left;padding:7px 11px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.stcat:hover{background:rgba(255,255,255,.10)}
.stcat.on{background:rgba(10,132,255,.28);border-color:rgba(120,190,255,.45)}
.stcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:7px}
.stcard .sthead{display:flex;gap:10px;align-items:center}
.stcard .sthead .appico{width:42px;height:42px;border-radius:10px;font-size:20px;margin:0;flex:none}
.stcard .sthead .appico img{border-radius:inherit}
.stbadge{display:inline-block;padding:2px 8px;border-radius:99px;background:rgba(48,209,88,.20);border:1px solid rgba(48,209,88,.4);font-size:11px;color:#a9efbe}
.stbar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.stbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* ---------- dock ---------- */
#dockwrap{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:center;z-index:900;pointer-events:none;transition:transform .3s cubic-bezier(.22,1,.36,1)}
/* v0.46: Dock position (bottom default / left / right) + auto-hide.
   Side docks span the full edge height and centre the Dock on it;
   magnification grows the icons toward the screen interior, the
   running dot sits on the outboard side, labels pop inboard. */
#dockwrap.pos-left{left:10px;right:auto;top:0;bottom:0;justify-content:flex-start;align-items:center}
#dockwrap.pos-right{left:auto;right:10px;top:0;bottom:0;justify-content:flex-start;align-items:center}
#dockwrap.pos-left #dock{flex-direction:column;align-items:flex-start}
#dockwrap.pos-right #dock{flex-direction:column;align-items:flex-end}
#dockwrap.pos-left .ditem,#dockwrap.pos-right .ditem{flex-direction:row;align-items:center}
#dockwrap.pos-left .ddot{order:-1}
#dockwrap.pos-left .dlabel{left:calc(100% + 14px);right:auto;bottom:auto;top:50%;transform:translateY(-50%)}
#dockwrap.pos-right .dlabel{left:auto;right:calc(100% + 14px);bottom:auto;top:50%;transform:translateY(-50%)}
/* auto-hide: slide the whole wrap off its edge, leaving a 3px
   trigger sliver (the wrap sits 10px off the edge; 100% + 7px of
   travel leaves exactly 3px showing). A hidden Dock takes no
   pointer events -- the reveal trigger is the document-level
   pointer tracker in the v0.46 dock behaviour block. */
#dockwrap.pos-bottom.dock-hidden{transform:translateY(calc(100% + 7px))}
#dockwrap.pos-left.dock-hidden{transform:translateX(calc(-100% - 7px))}
#dockwrap.pos-right.dock-hidden{transform:translateX(calc(100% + 7px))}
#dockwrap.dock-hidden #dock{pointer-events:none}
/* magnification release: sizes are written per frame while the
   pointer moves (no transition); the .settle class restores a
   short transition only for the snap-back on pointer leave. */
#dock.settle .dockbtn .appico{transition:width .18s ease-out,height .18s ease-out}
/* settings segmented control (Dock position picker) */
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:#e8e8ed;font:inherit;font-size:12.5px;padding:4px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:#0a84ff;color:#fff}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:7px;padding:8px 10px;background:rgba(30,30,38,.42);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.24);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.ditem{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.dockbtn{border:0;background:transparent;cursor:pointer;padding:0;transition:transform .12s ease-out;transform-origin:bottom center}
.dockbtn .appico{width:52px;height:52px;border-radius:12px}
.dlabel{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:rgba(40,40,46,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12px;padding:3px 10px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.ditem:hover .dlabel{opacity:1}
.ddot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0}
.ddot.on{opacity:1}
/* ---------- external app windows in the stage strip (v0.18 窗口统一·乙) ---------- */
#extstrip{position:fixed;left:10px;bottom:104px;z-index:25;width:148px;display:flex;flex-direction:column;gap:8px}
/* v0.46 interim coexistence: with the Dock on the left edge the
   Stage Manager strip mirrors to the right edge (position only). */
#extstrip.mirror{left:auto;right:10px}
#extstrip.hidden{display:none}
#extstrip .extlab{font-size:11px;color:rgba(255,255,255,.88);text-shadow:0 1px 4px rgba(0,0,0,.85);padding:0 2px}
.extcard{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 10px 26px rgba(0,0,0,.42);cursor:pointer;color:#fff;text-align:left;font:inherit;opacity:.8;transition:opacity .25s,border-color .25s,box-shadow .25s}
.extcard:hover{background:rgba(74,74,88,.62);opacity:1}
.extcard .et{min-width:0;flex:1}
.extcard .et b{display:block;font-size:12px;font-weight:600;height:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
/* v0.38: the window the user is actually in gets the accent ring,
   a lit dot and a full-bright title; the rest dim, minimized more. */
.extcard.mini{opacity:.55}
.extcard.active{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px rgba(10,132,255,.55),0 10px 26px rgba(0,0,0,.42)}
.extcard.active .et b{opacity:1}
.extcard .actdot{display:none;width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 6px rgba(10,132,255,.9)}
.extcard.active .actdot{display:block}
/* v0.38: the desktop view's own red traffic light (menubar, far
   left). Unlike the Edge frame's X it HIDES the view instead of
   destroying it, so the return from the tray is the same window. */
#mb-hide{width:13px;height:13px;border-radius:50%;border:0;background:#ff5f57;cursor:pointer;padding:0;flex:none;box-shadow:inset 0 0 2px rgba(0,0,0,.3);color:transparent;font-size:9px;line-height:13px;text-align:center}
#mb-hide:hover{color:rgba(0,0,0,.55);filter:brightness(1.08)}
.extcard .et span{display:block;font-size:11px;height:15px;line-height:15px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- v0.56 ---------- */
:root{--deskico:54px}
#icons .icon .appico{width:var(--deskico);height:var(--deskico);border-radius:calc(var(--deskico)*.24);font-size:calc(var(--deskico)*.5)}
.appico .appArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none}
.dockbtn .appico .appArt,.lp-item .appico .appArt{padding:0}
/* Stage Manager preview cards (item 1) */
.extcard.prev{flex-direction:column;align-items:stretch;gap:6px;padding:6px;width:172px}
#extstrip:has(.extcard.prev){width:184px}
.extcard .ethumb{width:100%;height:88px;flex:none;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.30);display:block;pointer-events:none}
.extcard .ecap{display:flex;align-items:center;gap:6px;min-width:0;height:24px;flex:none;padding:0 2px 2px}
.extcard .ecap b{font-size:11.5px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.extcard .ecap .appico{width:20px;height:20px;border-radius:5px;font-size:11px;margin:0;flex:none}
.extcard .extRealIcon{width:26px;height:26px;border-radius:6px;flex:none;object-fit:cover}
/* context-menu submenus (items 5 + 7) */
.ctxitem.hasSub{position:relative;padding-right:22px}
.ctxitem.hasSub::after{content:'›';position:absolute;right:10px;opacity:.65}
.ctxitem .radio{font-style:normal;width:14px;display:inline-block;opacity:.9}
.ctxSub{position:absolute;left:calc(100% + 2px);top:-6px;min-width:150px;padding:6px;border-radius:12px;background:rgba(32,32,40,.92);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 44px rgba(0,0,0,.5);display:none;z-index:5}
.ctxitem.hasSub:hover .ctxSub,.ctxitem.hasSub.openSub .ctxSub{display:block}
.ctxSub.flip{left:auto;right:calc(100% + 2px)}
.ctxSub .ctxitem{white-space:nowrap}
/* folder minis + folder pop extras (item 4) */
.folderico .fmini{position:relative;overflow:hidden}
.folderico .fmini .appico{width:100%;height:100%;border-radius:5px;font-size:12px;margin:0;box-shadow:none}
.fp-foot{display:flex;gap:8px;justify-content:center;margin-top:14px}
.fp-foot button{padding:7px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:13px;cursor:pointer}
.fp-foot button:hover{background:rgba(255,255,255,.24)}
.fp-pick{position:absolute;inset:0;background:rgba(16,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:5;border-radius:inherit}
.fp-pick-panel{width:min(430px,86%);max-height:74%;overflow:auto;background:rgba(38,38,46,.97);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px;color:#fff}
.fp-pick-panel h4{margin:0 0 10px;font-size:14px}
.fp-pick-it{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border:0;border-radius:9px;background:transparent;color:#fff;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.fp-pick-it:hover{background:rgba(255,255,255,.12)}
.fp-pick-it .appico{width:30px;height:30px;border-radius:7px;font-size:15px;margin:0;flex:none}
.fp-grid.dropIn{outline:2px solid var(--accent);outline-offset:5px;border-radius:10px}
/* v0.56: the folder pop's backdrop lets pointer events through
   (only the panel itself is interactive), so a desktop drag can
   START and travel while a folder is open -- that is what makes
   "drag into the open folder" a real gesture. Outside clicks
   still close it via the document pointerdown rule. */
#folderpop{pointer-events:none}
#folderpop .fp-panel{pointer-events:auto}
</style>
