name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.go'
      - 'update.go'
      - 'accel.go'
      - 'firefox.go'
      - 'procomp.go'
      - 'proc_windows.go'
      - 'proc_other.go'
      - 'index.html'
      - 'go.mod'
      - 'go.sum'
      - 'ssh.go'
      - 'servermon.go'
      - 'servermon_agent.go'
      - 'winmgr.go'
      - 'winmgr_windows.go'
      - 'winmgr_other.go'
      - 'diag.go'
      - 'settings.go'
      - 'nodes.go'
      - 'notify.go'
      - 'vault.go'
      - 'vaultspace_windows.go'
      - 'vaultspace_other.go'
      - 'storage.go'
      - 'files.go'
      - 'owncheck.go'
      - 'winset.go'
      - 'shellview.go'
      - 'tray_windows.go'
      - 'tray_other.go'
      - 'hotkey.go'
      - 'hotkey_windows.go'
      - 'hotkey_other.go'
      - 'viewcmd.go'
      - 'bosskey.go'
      - 'remote.go'
      - 'remote_tsnet.go'
      - 'remote_stub.go'
      - 'apps.go'
      - 'apps.json'
      - 'openclaw.go'
      - 'openclaw_plus.go'
      - 'openclaw_windows.go'
      - 'openclaw_other.go'
      - 'sandbox.go'
      - 'sandbox_windows.go'
      - 'sandbox_other.go'
      - 'immerse.go'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Fetch sing-box core (official v1.14.4, legacy Windows 7 build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64-legacy-windows-7.zip" -OutFile "singbox.zip"
          $len = (Get-Item "singbox.zip").Length
          Write-Host "singbox.zip bytes: $len"
          if ($len -ne 27010034) { throw "sing-box zip size mismatch: $len" }

      - name: Download Go modules (incl. tailscale/tsnet)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download

      # The Sandboxie installer is embedded into the EXE (v0.39) but
      # never committed to git: fetch the pinned official package,
      # verify size + SHA-256, and stage it at the go:embed path.
      - name: Fetch Sandboxie component (official v1.18.8, pinned, embedded)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sandboxie-plus/Sandboxie/releases/download/v1.18.8/Sandboxie-Plus-x64-v1.18.8.exe" -OutFile "assets/sandboxie-plus-x64-v1.18.8.exe"
          $len = (Get-Item "assets/sandboxie-plus-x64-v1.18.8.exe").Length
          Write-Host "sandboxie installer bytes: $len"
          if ($len -ne 24930680) { throw "Sandboxie installer size mismatch: $len" }
          $hash = (Get-FileHash "assets/sandboxie-plus-x64-v1.18.8.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "sandboxie installer sha256: $hash"
          if ($hash -ne "f27078ff74a07906fd51476079e1a7a8f5e20c8bb75a9d2ae86169d47179ae76") { throw "Sandboxie installer sha256 mismatch: $hash" }

      - name: Build single-file EXE (windows/amd64)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-H windowsgui -s -w" -o MJ-System.exe .
          (Get-Item "MJ-System.exe").Length

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "MJ-System.exe" -DestinationPath "MJ-System-64bit.zip" -Force
          (Get-Item "MJ-System-64bit.zip").Length
          $hash = (Get-FileHash "MJ-System-64bit.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "MJ-System-64bit.zip").Length
          $manifest = [ordered]@{ version = "0.55"; file = "MJ-System-64bit.zip"; size = $size; sha256 = $hash }
          $json = $manifest | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "update.json"), $json, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "update.json"


      - name: Package Firefox component (ESR 153.5.1 zh-CN, portable)
        shell: pwsh
        run: |
          $ffver = "153.5.1esr"
          $url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/$ffver/win64/zh-CN/Firefox%20Setup%20$ffver.exe"
          Invoke-WebRequest -Uri $url -OutFile "ffsetup.exe"
          $ilen = (Get-Item "ffsetup.exe").Length
          Write-Host "ffsetup.exe bytes: $ilen"
          if ($ilen -lt 50000000) { throw "Firefox installer too small: $ilen" }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip x "ffsetup.exe" "-offx" -y | Out-Null
          if (!(Test-Path "ffx\core\firefox.exe")) { throw "firefox.exe not found after extract" }
          New-Item -ItemType Directory -Force -Path "ffx\core\distribution" | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD "ffx\core\distribution\policies.json"), '{ "policies": { "DisableAppUpdate": true } }', (New-Object System.Text.UTF8Encoding $false))
          Compress-Archive -Path "ffx\core\*" -DestinationPath "MJ-Firefox.zip" -Force
          $fhash = (Get-FileHash "MJ-Firefox.zip" -Algorithm SHA256).Hash.ToLower()
          $fsize = (Get-Item "MJ-Firefox.zip").Length
          $fman = [ordered]@{ version = $ffver; file = "MJ-Firefox.zip"; size = $fsize; sha256 = $fhash }
          $fjson = $fman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "firefox.json"), $fjson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "firefox.json"

      - name: Assemble OpenClaw component (portable Node v24.22.1 + OpenClaw 2026.10.8)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ocVer = "2026.10.8"
          $nodeVer = "24.22.1"
          $stage = Join-Path $PWD "oc-stage"
          $comp = Join-Path $stage "component"
          $runtimeDir = Join-Path $comp "runtime"
          $appDir = Join-Path $comp "app"
          New-Item -ItemType Directory -Force -Path $runtimeDir, $appDir | Out-Null
          # Portable Node: official win-x64 zip from nodejs.org, its
          # contents land directly in component\runtime (node.exe at
          # the runtime root), same layout as the validation runs.
          $nodeZip = Join-Path $stage "node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVer/node-v$nodeVer-win-x64.zip" -OutFile $nodeZip
          Write-Host "node zip bytes: $((Get-Item $nodeZip).Length)"
          Expand-Archive -Path $nodeZip -DestinationPath (Join-Path $stage "node-x") -Force
          Copy-Item -Path (Join-Path $stage "node-x\node-v$nodeVer-win-x64\*") -Destination $runtimeDir -Recurse -Force
          $nodeExe = Join-Path $runtimeDir "node.exe"
          if (!(Test-Path $nodeExe)) { throw "node.exe missing after extract" }
          # Runtime pinning (validation run #1 died right here: install
          # scripts resolved bare `node` to the runner's preinstalled
          # Node 22 and OpenClaw's version check aborted the install).
          # Same triple pinning as openclaw-validate.yml: PATH first,
          # --scripts-prepend-node-path=true, absolute-path calls, and
          # a fail-fast guard before installing anything.
          $env:PATH = "$runtimeDir;$env:PATH"
          $nodeV = (& $nodeExe -v).Trim()
          Write-Host "node -v = $nodeV"
          if ($nodeV -ne "v$nodeVer") { throw "node version mismatch: $nodeV" }
          $resolvedNode = (Get-Command node -ErrorAction Stop).Source
          if (-not ($resolvedNode -like "$runtimeDir*")) { throw "node resolves outside component runtime: $resolvedNode" }
          $npm = Join-Path $runtimeDir "npm.cmd"
          # npm local-prefix install of the pinned OpenClaw into
          # component\app. The npm cache stays in the staging area,
          # never inside the component; the zip ships runtime + app
          # only (state is provisioned by the daemon at first start).
          $env:npm_config_cache = Join-Path $stage "npm-cache"
          $pkg = [ordered]@{ dependencies = [ordered]@{ openclaw = $ocVer } }
          ($pkg | ConvertTo-Json) | Set-Content (Join-Path $appDir "package.json") -Encoding utf8
          Push-Location $appDir
          & $npm install --no-audit --no-fund --loglevel=warn --scripts-prepend-node-path=true --registry "https://registry.npmjs.org/"
          $npmCode = $LASTEXITCODE
          Pop-Location
          if ($npmCode -ne 0) { throw "npm install failed: exit $npmCode" }
          $ocBin = Join-Path $appDir "node_modules\.bin\openclaw.cmd"
          if (!(Test-Path $ocBin)) { throw "openclaw entry shim missing after install: $ocBin" }
          $ocEntry = Join-Path $appDir "node_modules\openclaw\openclaw.mjs"
          if (!(Test-Path $ocEntry)) { throw "openclaw.mjs missing after install: $ocEntry" }
          $ocV = (& $ocBin --version 2>&1 | Out-String).Trim()
          Write-Host "openclaw --version = $ocV"
          if ($ocV -notlike "*$ocVer*") { throw "openclaw version mismatch: $ocV" }
          Compress-Archive -Path (Join-Path $comp "runtime"), (Join-Path $comp "app") -DestinationPath "MJ-OpenClaw.zip" -Force
          $osize = (Get-Item "MJ-OpenClaw.zip").Length
          Write-Host "MJ-OpenClaw.zip bytes: $osize"
          if ($osize -lt 100000000) { throw "OpenClaw component zip implausibly small: $osize" }
          $ohash = (Get-FileHash "MJ-OpenClaw.zip" -Algorithm SHA256).Hash.ToLower()
          $oman = [ordered]@{ version = $ocVer; file = "MJ-OpenClaw.zip"; size = $osize; sha256 = $ohash }
          $ojson = $oman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "openclaw.json"), $ojson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "openclaw.json"

      - name: Package ONLYOFFICE component (Desktop Editors 10.0.0, official portable zip)
        shell: pwsh
        run: |
          $ooVer = "10.0.0"
          $ooUrl = "https://github.com/ONLYOFFICE/DesktopEditors/releases/download/v$ooVer/DesktopEditors_x64.zip"
          Invoke-WebRequest -Uri $ooUrl -OutFile "oo.zip"
          $ooSize = (Get-Item "oo.zip").Length
          Write-Host "onlyoffice zip bytes: $ooSize"
          if ($ooSize -ne 397286158) { throw "onlyoffice zip size mismatch: $ooSize" }
          tar.exe -tf "oo.zip" | Out-File -Encoding utf8 "oo-list.txt"
          if (!(Select-String -Path "oo-list.txt" -SimpleMatch "DesktopEditors.exe" -Quiet)) { throw "DesktopEditors.exe not found in onlyoffice zip" }
          Copy-Item "oo.zip" "MJ-OnlyOffice.zip"
          $ooHash = (Get-FileHash "MJ-OnlyOffice.zip" -Algorithm SHA256).Hash.ToLower()
          $ooMan = [ordered]@{ version = $ooVer; file = "MJ-OnlyOffice.zip"; size = $ooSize; sha256 = $ooHash }
          $ooJson = $ooMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "onlyoffice.json"), $ooJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "onlyoffice.json"

      - name: Package LibreOffice component (26.8.2, official MSI admin-extract)
        shell: pwsh
        run: |
          $loVer = "26.8.2"
          $loUrl = "https://download.documentfoundation.org/libreoffice/stable/$loVer/win/x86_64/LibreOffice_${loVer}_Win_x86-64.msi"
          Invoke-WebRequest -Uri $loUrl -OutFile "lo.msi"
          $msiSize = (Get-Item "lo.msi").Length
          Write-Host "libreoffice msi bytes: $msiSize"
          if ($msiSize -ne 375934976) { throw "libreoffice msi size mismatch: $msiSize" }
          $loDir = Join-Path $PWD "lo-admin"
          $loProc = Start-Process msiexec.exe -ArgumentList "/a `"$PWD\lo.msi`" /qn TARGETDIR=`"$loDir`"" -Wait -PassThru
          if ($loProc.ExitCode -ne 0) { throw "msiexec /a failed: exit $($loProc.ExitCode)" }
          $sofficeItem = Get-ChildItem $loDir -Recurse -Filter "soffice.exe" | Select-Object -First 1
          if (!$sofficeItem) { throw "soffice.exe missing after admin extract" }
          $loRoot = $sofficeItem.Directory.Parent.FullName
          Write-Host "libreoffice root: $loRoot"
          Compress-Archive -Path (Join-Path $loRoot "*") -DestinationPath "MJ-LibreOffice.zip" -Force
          tar.exe -tf "MJ-LibreOffice.zip" | Out-File -Encoding utf8 "lo-list.txt"
          if (!(Select-String -Path "lo-list.txt" -SimpleMatch "soffice.exe" -Quiet)) { throw "soffice.exe not in MJ-LibreOffice.zip" }
          $loSize = (Get-Item "MJ-LibreOffice.zip").Length
          Write-Host "MJ-LibreOffice.zip bytes: $loSize"
          if ($loSize -lt 100000000) { throw "libreoffice component zip implausibly small: $loSize" }
          $loHash = (Get-FileHash "MJ-LibreOffice.zip" -Algorithm SHA256).Hash.ToLower()
          $loMan = [ordered]@{ version = $loVer; file = "MJ-LibreOffice.zip"; size = $loSize; sha256 = $loHash }
          $loJson = $loMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "libreoffice.json"), $loJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "libreoffice.json"

      - name: Package ImageGlass component (10.0.6.906, official portable zip)
        shell: pwsh
        run: |
          $igVer = "10.0.6.906"
          $igUrl = "https://github.com/d2phap/ImageGlass/releases/download/$igVer/ImageGlass_${igVer}_win-x64.zip"
          Invoke-WebRequest -Uri $igUrl -OutFile "ig.zip"
          $igSize = (Get-Item "ig.zip").Length
          Write-Host "imageglass zip bytes: $igSize"
          if ($igSize -ne 43934433) { throw "imageglass zip size mismatch: $igSize" }
          tar.exe -tf "ig.zip" | Out-File -Encoding utf8 "ig-list.txt"
          if (!(Select-String -Path "ig-list.txt" -SimpleMatch "ImageGlass.exe" -Quiet)) { throw "ImageGlass.exe not found in imageglass zip" }
          Copy-Item "ig.zip" "MJ-ImageGlass.zip"
          $igHash = (Get-FileHash "MJ-ImageGlass.zip" -Algorithm SHA256).Hash.ToLower()
          $igMan = [ordered]@{ version = $igVer; file = "MJ-ImageGlass.zip"; size = $igSize; sha256 = $igHash }
          $igJson = $igMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "imageglass.json"), $igJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "imageglass.json"

      - name: Package Krita component (6.0.4.1, official portable zip)
        shell: pwsh
        run: |
          $krVer = "6.0.4.1"
          $krUrl = "https://download.kde.org/stable/krita/$krVer/krita-x64-$krVer.zip"
          Invoke-WebRequest -Uri $krUrl -OutFile "kr.zip"
          $krSize = (Get-Item "kr.zip").Length
          Write-Host "krita zip bytes: $krSize"
          if ($krSize -ne 245761499) { throw "krita zip size mismatch: $krSize" }
          tar.exe -tf "kr.zip" | Out-File -Encoding utf8 "kr-list.txt"
          if (!(Select-String -Path "kr-list.txt" -SimpleMatch "krita.exe" -Quiet)) { throw "krita.exe not found in krita zip" }
          Copy-Item "kr.zip" "MJ-Krita.zip"
          $krHash = (Get-FileHash "MJ-Krita.zip" -Algorithm SHA256).Hash.ToLower()
          $krMan = [ordered]@{ version = $krVer; file = "MJ-Krita.zip"; size = $krSize; sha256 = $krHash }
          $krJson = $krMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "krita.json"), $krJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "krita.json"

      - name: Package VSCodium component (1.143.17232, official portable zip)
        shell: pwsh
        run: |
          $vsVer = "1.143.17232"
          $vsUrl = "https://github.com/VSCodium/vscodium/releases/download/$vsVer/VSCodium-win32-x64-$vsVer.zip"
          Invoke-WebRequest -Uri $vsUrl -OutFile "vs.zip"
          $vsSize = (Get-Item "vs.zip").Length
          Write-Host "vscodium zip bytes: $vsSize"
          if ($vsSize -ne 231406156) { throw "vscodium zip size mismatch: $vsSize" }
          tar.exe -tf "vs.zip" | Out-File -Encoding utf8 "vs-list.txt"
          if (!(Select-String -Path "vs-list.txt" -SimpleMatch "VSCodium.exe" -Quiet)) { throw "VSCodium.exe not found in vscodium zip" }
          Copy-Item "vs.zip" "MJ-VSCodium.zip"
          $vsHash = (Get-FileHash "MJ-VSCodium.zip" -Algorithm SHA256).Hash.ToLower()
          $vsMan = [ordered]@{ version = $vsVer; file = "MJ-VSCodium.zip"; size = $vsSize; sha256 = $vsHash }
          $vsJson = $vsMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "vscodium.json"), $vsJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "vscodium.json"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.55
          name: 铭杰终端机 v0.55（64 位单文件版 · 桌面图标修复）
          body: |
            64 位单文件版：解压后运行 MJ-System.exe（需 64 位 Windows）。
            第一次运行会自动释放内置 sing-box 核心，数据保存在 EXE 旁的 Data/ 文件夹（节点、网站应用、桌面布局都在里面，跟着文件夹走）。
            应用内更新：v0.6 起在「设置 → 软件更新」里完成，仓库公开、免令牌。
            近版功能：网站应用化（真实图标、双击打开、文件夹分组）、软件内全局加速、台前调度（左侧实时缩略图）、窗口统一（外部应用统一调度与开窗落位）、SSH 远程终端、内置调试控制台（状态与日志集中查看、一键导出诊断包）、小窗手机宽（终端未最大化或较窄时网站应用以手机宽打开）、应用商店（官方便携应用直下进 Data/apps，校验钉死）、小龙虾组件、服务器监控面板。
            本版 v0.55：紧急修复 v0.54 的桌面图标全灭——更新到 v0.54 后桌面与启动台一个图标都不显示（守护进程、节点与数据一直正常，菜单和各个应用窗口也能打开，Dock 只剩下主页/启动台/控制台/文件/Chrome 五个）。根因在前端脚本的初始化顺序：Dock 的应用图标是在页面脚本刚开始执行时逐个构建的，构建时会调用每个应用的图标生成；v0.54 给 Firefox 的图标接上了它的安装状态（FFSTATE），但这个变量的声明在同一个脚本里排在约 770 行之后——脚本执行到 Firefox 这一项时变量尚未初始化，浏览器直接抛错并中断整段脚本：排在它后面的桌面名单、布局加载与启动序列全部没有执行，桌面与启动台于是恒空；菜单和窗口因为是预先登记的函数所以照常能用，Dock 也正好停在 Firefox 之前的四项（再加启动台钮），与真机照片严丝合缝。本版把 FFSTATE 的声明移到 Dock 构建之前（状态的加载与使用位置不变），并给整条名单链加上降级纪律：Dock、桌面、启动台逐个构建图标时，任何一个条目出错只跳过或降级它自己、并在浏览器控制台具名记下，绝不再让一个图标拖垮整张名单；启动序列改为逐项结算，单个数据源失败不挡首次绘制。新增桌面启动回归测试（deskboot_test.js）：在 Node 里按浏览器的方式把页面脚本完整真跑一遍（假 DOM＋假数据），断言桌面与启动台名单非空、Firefox 图标在列，并模拟一条坏数据（组件名为空）验证其余图标照常渲染——这个测试对 v0.54 的代码能稳定复现失败、对本版通过。给老用户的话：你的桌面布局数据一直完好地存在守护进程侧，本次故障里它既没有被写坏、也没有被读到过；升级到 v0.55 后图标会按原有顺序自动全部回来，不需要任何操作。若设置侧栏出现过「没有匹配的设置项」，那是设置搜索框里留有查询词、清掉即可，与本故障无关。v0.54 的六项修复内容不变（开窗呈现、Firefox 按钮与桌面待遇、Chrome 深色框、文件音乐/视频分类、搬家数据回退提示、通知分类）。本版真机待验：升级后桌面与启动台图标全数回来、顺序与 v0.53 时一致；Dock 图标补齐 Firefox 之后的应用（SSH/服务器/控制台/应用商店/小龙虾/节点/设置）；Firefox 桌面图标的未下载/下载中/已装真实图标三态正常。
            上一版 v0.54：六项真机反馈打包修——头条是「打开应用不自动跳出来」。① 开窗呈现（头条）：根因不在前台权限，在垫背的方向——窗口出生时要把桌面垫到新窗口正下方，旧代码对 SetWindowPos 的插入参数理解反了：它把桌面抬到最顶层之后，把新窗口插到了桌面之下，落位矩形（桌面内 62%×85%）于是被桌面整个盖住；登记、落位、抬前台其实都成功了，窗口只是被自己的桌面压在底下，所以在台前调度或顶栏「窗口」菜单里点一下（那条路会把窗口真正提到最顶）就能出来。本版改对方向：新窗口先到顶、桌面再插到它正下方。同时把巡逻的出生核验改诚实：旧核验只看「是不是前台窗口」，被盖住的窗口照样是前台、于是被判「已呈现」再不重试；新核验要同时满足前台＋在桌面之上＋未最小化才算上台，没上台的补提预算从 1 次放宽到 2 次（只对从未上台的窗口），用尽仍未露面会在控制台具名留痕并交还用户；老板键隐藏期间新窗口照旧只跟随隐藏、绝不自己跳出来（隐藏态只等待、不核验）；沉浸模式开/关不影响呈现判定。② Firefox 两件：应用化窗口没有关闭/最小化按钮——根因在我们给 Firefox 应用模式播种的 userChrome.css：它把 #titlebar 整个折叠了，而 Firefox 自绘标题栏的窗口按钮正住在 #titlebar 里；认领与呈现机械无辜（隔离 Chrome 走同一套操作、按钮俱在）。本版起该样式只折叠标签栏/地址栏/书签栏，标题栏保留、按钮盒钉死可见；样式在每次启动时重写，下次以应用模式打开即自愈。另一件是桌面待遇：Firefox 本来就在桌面/启动台/聚焦/最近打开里（与五个生产力组件同列），此前缺的是状态层——本版补齐同款待遇：未下载/下载进度/失败角标、装好后换成从 firefox.exe 提取的真实图标、未装时点图标直接开始下载（进度在 Firefox 页看）。③ Chrome 窗口外观：认领隔离 Chrome 的窗口时给它套终端机的深色框——DWM 层面的边框色、标题栏色、标题文字色与圆角（取桌面玻璃色板），离册或守护进程退出时还原系统默认；并在每次启动时往隔离档案播种深色主题色，让 Chrome 自己画的框架部分也呈深色（浏览器运行中档案被占用时跳过播种、下次冷启动生效）。如实边界：标签页条与窗口按钮的字形是 Chrome 自己画的，改不了；DWM 标题栏色对 Chrome 的自绘框可能不显形，实际看得见的主要是边框与圆角（Windows 11）；Windows 10 不支持这组 DWM 属性，会静默降级为只剩深色播种，控制台留一条。④ 文件加分类：「文件」侧栏新增音乐（mp3/flac/wav/m4a/aac/ogg/opus/aiff 等）与视频（mp4/mkv/webm/mov/avi/m4v 等）两组，各带数量，图标/列表/分栏三种视图下都可过滤，媒体文件照旧同时出现在全部与最近导入里；分类是按扩展名的纯函数并有测试固化；音频用音符占位图，视频用播放符占位图（守护进程的缩略图只解码静态图片，视频没有可复用的缩略图）。⑤ 搬家后图片失效：全仓排查结论先说清——自定义壁纸、导入图片与其缩略图缓存、组件与商店图标、网站应用图标、桌面布局、盒内应用登记，存的都是相对引用或运行时按当前文件夹推导，没有一处把旧机器的绝对路径存下来；查到的真凶是数据目录的静默回退：程序文件夹不可写时（搬到 Program Files、或拷过去的文件夹带着另一台机器的权限），守护进程一声不吭地改用本机 LocalAppData 存数据，整个 Data 看起来就像空了一样——壁纸、图片、图标全都「失效」。本版把回退改成响亮的：控制台具名警告两个路径、设置 → 关于出现醒目提示，并加了模拟搬家回归测试（换基准目录后 Data 内引用仍可解析）。若你的实际情况不是回退，更新后看设置 → 关于的「数据目录」一行与控制台 system 模块即可当场分辨。⑥ 通知分类：通知中心分「系统通知 / 应用通知」两节呈现，设置 → 通知同步分两节：系统六来源一项不动；应用节列出已安装的应用（商店应用＋组件含 Firefox 与小龙虾＋桌面上的浏览器应用），每个一对开关（允许通知/横幅），默认开。商店应用、生产力组件、Firefox、小龙虾的安装完成事件从此归应用通知并带应用名（此前商店与组件装完根本不发通知，本版补上）。老通知没有分类字段的一律按系统读，不丢不乱。如实边界：这里管的是终端机为应用产生的事件（安装完成等）；网页自己在 Chrome 里发的通知走 Windows 通知中心，截不到、也不假装能管。本版真机待验：从桌面/Dock/启动台/聚焦打开商店应用、组件、隔离 Chrome 及其应用窗，窗口是否一次到位（沉浸开/关各验一次）；老板键隐藏中打开应用，新窗口不露面、整套回来时它在；Firefox 应用模式下右上角关闭/最小化/最大化按钮齐全；隔离 Chrome 窗口的边框/圆角与深色框架观感（Win10 则确认只有播种生效、控制台有一条降级日志）；把整个文件夹拷到另一台电脑后壁纸与导入图片是否照常、若目录不可写设置 → 关于是否出现数据回退提示。
            上一版 v0.53：保险库恢复加固——修的是一次真机实锤的数据安全级故障（2026-10-30）：保险库解锁时进度每次走到百分之六十多就静默退回密码框，密码明明是对的，人被锁在自己数据门外。根因在旧恢复方式：所有分片要全部解密还原成功之后才统一删除，恢复全程密文与明文同时占盘——可用空间小于保险库总量（约等于 mj-vault 文件夹大小）就必然失败，且每次重试都死在同一个百分比；而失败原因只写进日志，锁屏上什么都不显示，锁定状态下日志又恰好读不到。本版四处修复：① 逐片恢复：每成功还原一片，立即把该片从清单摘除、存盘、删文件（与上锁一侧早就在用的逐片纪律对齐），恢复需要的额外空闲空间从「一整份数据」降到「约一片（约 128 MB）」；中途失败只剩下没恢复完的分片，再输一次密码自动续跑，进度按字节计、不倒退，已恢复的文件重试时原样保留、不再被动。② 中断上锁的恢复不再误删文件：旧恢复动笔前会把「分片里出现过的顶层目录」在 Data 里整目录删掉——若状态来自上锁途中被中断，那个正封到一半的目录里还没封进去的文件只存在于原地，会被永久删除；本版这步清理只在「封存完整且是首次恢复尝试」时才做，中断封存一律跳过、靠逐文件覆盖还原，未封存的文件一个都不碰。③ 解锁失败的原因直接显示在锁屏的密码框下方（密码错与恢复失败从此分得清清楚楚），空间不足时会写明还差多少。④ 恢复开始前先做空间预检：连最大的一片都放不下时直接具名提示、不启动恢复，不再走到一半才死。磁盘格式一字未改：旧版本留下的保险库（包括半封存状态）本版直接兼容。**给正卡在解锁的人**：两条救援路——① 不换版本：先给终端机所在磁盘腾出比 mj-vault 文件夹更大的可用空间，再重新输密码（旧版恢复就是需要一整份数据的空闲）；② 换本版：先在锁屏点「关机」退出，从本发布页手动下载本版 EXE 覆盖旧 EXE（Data 与 mj-vault 两个文件夹不要动），重新打开输密码解锁——本版只需约一片余量，万一还失败，原因会写在锁屏上。本版真机待验：那台正卡着的机器用本版完整走通救援（半封存数据恢复＋幸存文件完好）；数 GB 级保险库逐片恢复的进度与耗时；磁盘空间预检在真低空间机器上的提示是否清楚。
            上一版 v0.52：老板键——v0.50 的 F8 全局召唤按 2026-10-30 真机反馈重做。旧版两个毛病：在终端机里按 F8 毫无反应；在宿主其他程序里按 F8，终端机要等一会儿才慢慢出现。本版起 F8 的语义就是老板键（默认 F8，可改）：① 整套隐藏：终端机的窗口在最前面时（桌面视图，或任意一个已被台前调度认领的外部窗口）按一下，整套窗口即时一起隐藏——进程一个不关、守护进程与节点照常在后台运行，系统托盘留一个图标作锚。再按一次热键、或点托盘图标，整套原样回来（隐藏前开着哪几个窗口就回来哪几个、桌面视图带到最前面）。保险库锁定时热键只唤出密码屏，隐藏分支不适用。退出前（设置退出 / 托盘退出 / 空闲自动退出 / 更新交接）会先把老板隐藏的窗口恢复可见，绝不把窗口留在隐藏态退出。② 即时（本版的病灶所在）：旧召唤的迟缓出在链条上——按键之后守护进程先给自己打一个 HTTP 电话（/api/openshell），那个接口在碰窗口之前要先等代理核心就绪、最长约 6 秒，聚焦搜索还要再等桌面页面的通道连上；而在终端机里按 F8，旧逻辑根本没有隐藏这一支，只是把已经在最前面的窗口又「抬」了一遍，看起来就是没反应。本版把隐藏与抬升都改成守护进程在热键线程里直接对窗口句柄操作：隐藏是一次按下整批消失；召唤是恢复整套＋显示桌面＋带到前台，当场生效，不等视图进程、不等页面通道、不等任何轮询。聚焦搜索的打开命令改走原有的粘性视图通道、在窗口出现之后异步跟上。唯一的例外是桌面视图进程已经不在（比如先前关过它）：那要重新拉起浏览器窗口，冷启动的耗时是客观的；命令会在新视图连上后自动补达，不会丢。③ 按键可自定义：设置 → 通用新增「老板键」一节——预设 F8（默认）/ F9 / F7 / F6 / F12 / 关闭，外加「自定义…」录制按钮：点开后直接按下想要的组合即可（按 Esc 取消）。规则写明：单个 F1–F12 可以；字母 / 数字必须带 Ctrl / Alt / Shift 一起用（裸字母会被全局热键吃掉、影响正常打字）；Win 键组合不能用（系统保留、视图也录不到）；不合规当场具名说明是哪一条不行。老版本的 F7 / F8 / F9 / 关闭设置原样生效，组合写法（如 ctrl+f8）在读取时自动规范成标准形式。组合被别的程序抢注时，控制台具名警告、设置页状态行如实显示「被占用」——你的设置不会被回滚，但也不会假装生效，换一个组合即可。每次按键走了哪一支（隐藏 / 召唤 / 锁定）都会记进控制台（模块 system），下次真机诊断不用猜。④ 与沉浸模式正交共存：老板隐藏不动沉浸的标记与样式，整套回来之后巡逻按原有规则复核。本版真机待验：隐藏 / 召唤的实际延迟体感（桌面视图活着时应为按下即达）；外部窗口（例如隔离 Chrome 的应用窗）在最前面时按 F8 是否整批隐藏；游戏全屏下热键是否仍能到达；注册成功后 F8 在 Edge 里不再触发它自带的功能（按键被系统截走，属预期）；自定义组合（如 Alt+Q）的录制手感与冲突显示。
            上一版 v0.51：生产力组件——五个开源软件做成按需下载的系统组件，主程序与主更新包不因此变大。ONLYOFFICE 文档（Desktop Editors 10.0.0）、LibreOffice（26.8.2）、ImageGlass 看图（10.0.6.906）、Krita 绘画（6.0.4.1）、VSCodium 代码（1.143.17232），各自是 Release 上的一个 zip＋一份校验清单（与 Firefox / 小龙虾组件同格式）；在「设置 → 组件」里逐个下载，校验 SHA-256 后装进 Data/components/<组件>，桌面出现各自的真实图标（从程序本体提取）；没装时图标是「未下载」态，点它也会开始下载。五个包合计约 1.3 GB，所以按需装、用哪个装哪个。包来源都是官方线：ONLYOFFICE / ImageGlass / VSCodium 用官方 GitHub 发布包，Krita 用 KDE 官方便携包，LibreOffice 用官方 MSI 在打包机上做管理式解包取程序文件（PortableApps 的社区便携包版本明显滞后，没用它）。① 数据收容（数据进 Data，不散落宿主）：ONLYOFFICE 没有官方的便携数据开关，守护进程启动它时把 APPDATA / LOCALAPPDATA / 临时目录指进组件自己的 profile 目录（是否完全生效按下方真机项复核）；LibreOffice 用它官方支持的 -env:UserInstallation 启动参数把用户配置整体放进组件目录；ImageGlass 的官方便携版配置本就放在程序旁，天然在组件目录里；Krita 用官方 --resource-location 参数把资源目录（笔刷、预设、工作区、资源库）放进组件目录——但它的几个小配置文件（kritarc 等）没有官方重定向手段，仍会写在宿主的 %LOCALAPPDATA% 里，如实说明、不假装全包；VSCodium 用官方便携模式（程序旁的 data 文件夹，守护进程预建在组件目录里），用户数据与扩展都在里面。② 打开路由：导入的文档 / 表格 / 演示（docx/xlsx/pptx/odt/ods/odp/csv/tsv）用办公套件打开——设置 → 组件新增「默认办公套件」（ONLYOFFICE / LibreOffice，默认 ONLYOFFICE），只装了一个就用那个，一个都没装时打开文档会明确请你先去装组件，绝不静默失败；图片装了 ImageGlass 就用它打开（没装走内置看图）；代码与文本装了 VSCodium 就用它打开（没装走内置查看器）；PDF 与其余类型沿用现状。③ 启动后与其它外部应用一视同仁：照常被台前调度认领、落位、沉浸，退出时关应用同样覆盖它们；保险库锁定时组件不可启动（Data 已密封）。④ VSCodium 的扩展市场是 Open VSX：微软专有扩展（如 Pylance）装不了，这是 VSCodium 的既定边界，先说清楚。本版真机待验：五个应用各自的首次启动；数据是否真落 Data（复核方法：每个应用打开用一会儿再退出，看宿主 %APPDATA% / %LOCALAPPDATA% 有没有新冒出 ONLYOFFICE / krita 之类的目录）；大包的实际下载时长；ONLYOFFICE 与 LibreOffice 打开同一份 docx 的观感；VSCodium 从 Open VSX 装扩展的实况。GUI 本体在打包环境里无法启动验证，本版只验了各包的官方来源、字节大小与主程序在包内的位置。
            上一版 v0.50：UI 复刻线第三件——顶栏菜单补全、启动台、聚焦搜索、F8 全局召唤、文件应用 Finder 化。① 顶栏菜单补全（不许有死菜单）：菜单栏的「文件 / 编辑 / 显示 / 窗口 / 帮助」此前只是几个字，现在每个都是真菜单，按 macOS 语法接真功能；「铭杰」菜单补「设置…」（⌘, 真绑定）。文件：导入文件…、新建文件夹、关闭窗口（关当前活动窗口，没有活动窗口时置灰）。编辑：剪切 / 复制 / 粘贴 / 全选派发给桌面视图里正聚焦的输入元素，没有可派发目标时置灰；撤销 / 重做在 shell 层没有对应语义，不放。显示：沉浸模式、桌面全屏、台前调度、Dock 自动隐藏四个勾选项与设置同源、状态实时反映、点即切换，与控制中心 / 设置三方一致。窗口：最小化 / 缩放作用于当前活动窗口（无则置灰），下方列出全部已打开窗口（系统内窗口＋台前调度登记的外部窗口），点一下唤起（走既有呈现路径）。帮助：打开控制台、导出诊断包、关于（带版本号）。顺带把窗口绿灯接上真缩放（此前只是摆设），并修了「铭杰」菜单空壳在左上角露一小片玻璃的老毛病。② 启动台：Dock 新增启动台图标（在工作站右侧、Finder 旁边的位置），点开是全屏覆盖层——壁纸模糊底、居中偏上搜索框、分页图标网格＋页码点（滚轮 / 方向键翻页），动画是淡入＋轻微缩放。内容就是桌面能启动的全部：网站应用、商店应用、盒内应用、系统应用（设置 / 控制台 / 应用商店 / 文件 / SSH / 服务器 / 节点等），文件夹按现有模型渲染并可原地打开。与桌面共用同一份布局数据源（DESKORDER 与文件夹模型）：启动台里拖动重排，改的就是桌面布局，不做第二份数据；搜索框按名称过滤（这是启动台自带过滤，与聚焦是两回事）。Esc / 点空白处关闭。③ 聚焦搜索：三种打开方式——桌面模式按 F5（桌面视图拦截 F5，不再触发浏览器重载；外部已认领窗口的 F5 不归终端机管）、顶栏控制中心图标左侧的放大镜图标、Ctrl+Space，三路通到同一个面板。面板是屏幕上方居中的悬浮卡，大输入框，分组结果：应用 / 文件 / 设置 / 节点 / 操作（快捷动作：锁定屏幕仅在保险库启用时出现、关机…、打开控制台、检查更新）。数据只来自终端机内部：桌面应用注册表、Data/files 的导入文件、设置页索引、节点的名字（经既有接口读取，只取名字不碰秘密字段，点节点即切换出口）。空查询显示「最近打开」（打开记录存在视图本机）。排序：前缀匹配优先于包含匹配，最近打开加权；全键盘操作（↑↓ 选择、回车打开、Esc 关），鼠标可点；打开结果一律走与桌面点击相同的打开路径。保险库锁定期间 F5 / 放大镜不打开聚焦，密码屏只管密码。④ F8 全局召唤热键（守护进程，Windows）：守护进程用 RegisterHotKey 注册无修饰 F8，接入既有消息线程基础设施。在任何界面（包括游戏里）按下：保险库锁定 → 唤出锁定屏视图；否则 → 唤回整套视图（复用托盘图标的唤回路径）并让桌面视图打开聚焦——命令经一条新的专用视图通道（SSE）下发，视图是被召唤才新建、晚一步连上时命令会补达，不丢。注册失败（F8 被别的程序抢注）会在控制台具名警告（模块 system）；设置 → 通用新增「全局召唤热键」一行：可选 F8 / F9 / F7 / 关闭，显示当前键与注册状态（已注册 / 被占用），改键即时重注册。守护进程退出即注销（系统自动回收进程的热键注册），不留任何常驻。⑤ 文件应用 Finder 化（数据与打开路由不动，只重做脸与骨架）：窗口照 Finder——左侧边栏（全部文件＋按类型的智能分组：图片 / 文档 / 表格 / 压缩包 / 其他＋最近导入）、工具栏（视图 segmented：图标 / 列表 / 分栏；排序菜单：名称 / 大小 / 类型 / 导入时间；窗口内搜索过滤当前组）、右侧预览窗格。图标视图：缩略图网格，双击打开走既有路由；列表视图：名称 / 大小 / 类型 / 导入时间四列、点列头可排序；分栏视图：分组列 → 文件列 → 预览列（我们的文件是单层库，分栏按类型分组实现，如实如此）。预览窗格：缩略图、名称、大小、类型、导入时间，按钮 打开 / 导出到电脑 / 重命名… / 删除（删除走既有删除通道并同步桌面图标引用）。右键菜单与桌面文件菜单一致（打开 / 重命名 / 导出 / 删除；重命名能干净支持——布局引用按既有模型迁移）。多选：Ctrl/⌘+点击多选、Shift+点击连选，可批量删除 / 导出；宿主文件拖进文件窗口同样触发导入（与桌面拖入并列，本来就是同一条导入通道）。标题区明示虚拟路径「文稿库 › 当前组」——它是 Data/files 的单层文稿库，不是电脑上的文件夹；原先那个浏览宿主目录的旧脸从本窗口退役（守护进程的对应接口保留未动）。「导入时间」用文件的修改时间：库里没有单独存导入时刻，导入即写入，文件时间就是到达时间。本版真机待验：F5 在 Edge --app 里拦截是否稳、F8 与常见软件（游戏 / 录屏 / 输入法）的抢注实况、启动台 / 聚焦的动画手感、文件分栏视图的实际观感。上一版 v0.49：节点专业化——节点页按 Clash 级客户端重做（对标 Clash Verge），页面全图形化、macOS 设计语言。① 模式系统：规则 / 全局 / 直连三模式，页面顶部 segmented 即时切换、持久化、重启恢复。规则模式的默认集就是议定的绕过大陆（GeoSite CN＋GeoIP CN 直连、其余走代理、私有地址直连），规则集文件（.srs）由守护进程自动备齐到 core 目录（7 天刷新，走节点优先、直连兜底）；规则集一时下载不到时控制台会具名警告「绕过大陆未生效」，只剩自定义规则与私有地址直连，绝不假装生效。设置 → 节点与网络新增「核心启动时的模式」（跟随上次 / 规则 / 全局 / 直连）。与「全局加速」的关系：加速开关仍是终端内路由的总闸，模式管核心内部的分流，两边不冲突；隔离浏览器始终经 127.0.0.1:2080。② 节点与分组：节点按来源成分组卡片（每个订阅一组、手动一组），行内有协议徽章、服务器地址、实测延迟（没测过显示「未测」、失败显示具名原因）。点节点即真切换出口（v0.47 控制中心欠的账本版还清：控制中心的节点展开列表同步改成点行即切换，不再是跳页）：核心在跑且 Clash API 可用时走热切换、不重启核心，切换后回读校验；不行才重生成配置＋重启。选择持久化进 Data/nodes.json，生成的配置里 selector 的默认出口严格跟着选择走。测速是真测：为每个节点临时起一个只含它（和它的前置链）的核心实例，用守护进程的 HTTP 客户端经它打开测速目标量延迟——不用 sing-box 的 delay 接口（实测 1.14.4 的 delay 端点无视传入的测速地址、只测它内置的地址，不可控）；核心文件不在时退回 TCP 握手计时并如实标注。单节点、整组、虚拟组都能测，结果逐个落库并记控制台（模块 node）。③ 虚拟组（Clash 语义）：自动选择（sing-box urltest，核心内按 10 分钟间隔测速选最快，页面与控制中心都画得出当前命中）与故障转移并列可选为出口。一句如实说明：sing-box 没有 fallback 出站类型，故障转移由守护进程的看门狗实现——每 30 秒按成员顺序用同一套真测速探活，把 selector 指到第一个活着的成员（热切换优先）。④ 订阅：多订阅增删改名、各自启用开关、各自自动更新间隔（0＝用全局默认；全局默认与总开关在 设置 → 节点与网络），手动单订更新与全部更新；更新走既有下载路线（核心在跑走节点、否则直连）。解析 subscription-userinfo 画流量进度条与到期（没这个头就如实不显示）；内容支持分享链接、base64 与 Clash YAML（ss/vmess/vless/trojan/hysteria2 可转，不支持的类型计数并记日志，不静默吞）。更新后按节点身份、再按名称保留当前选择，保留不了记日志并回退到第一个可用出口。端点完全相同的节点视为同一个：跨组重复只保留先出现的一份（否则生成的配置会出现重复出站标签被核心整体拒绝）。⑤ 实时连接与流量：生成的配置开启 sing-box 的 Clash API（只监听 127.0.0.1，密钥本地随机生成、存 Data、不进日志，可在设置里关）。节点页顶部有实时上下行速率与会话累计、本次会话的细线渐变面积图（与服务器面板同款图表语言）；「实时连接」区列出目标主机、网络类型、出站链、上下行字节与开始时间，可单条关闭或全部关闭。API 不可用（核心没跑/开关关了）时该区如实显示原因，没有假数据。⑥ 链式代理与 IPv6：每个节点可设前置（无 / 任一其他节点 / WARP 中继），落在 sing-box 的 detour 上，配置生成、测速、实际流量都带着这条链。本地 IPv6 出口在启动与打开节点页时探测：服务器是 IPv6 字面地址又没有本地 IPv6 出口的节点打「不可直达」徽章，行内一键给它套前置。内置 WARP：节点页一键用 Cloudflare 的公开注册流程（wgcf 同款）在本机生成 WireGuard 身份存进 Data，作为常驻的「WARP 中继」——可作前置，也可直接选为出口；注册失败或被网络挡住会具名报错并可重试，绝不静默假装可用。⑦ DNS 三方案：防污染（默认，远程 DoH 经代理、规则模式下国内域名走本地解析）/ 直连（系统 DNS）/ 自定义 DoH 地址，切换即重生成配置并记日志。⑧ 自定义规则：域名 / 域名后缀 / IP 段 × 代理 / 直连 / 拒绝，可增删与启停，编译进 route 且排在默认集之前；默认集在页面里只读展示，看得见绕过大陆长什么样；非法规则保存时具名报错。⑨ 控制台留痕：配置生成与校验（core）、模式/出口切换（core）、订阅与测速（node）、前置与 DNS 变更（core），Clash API 异常在相关操作里具名。生成的每一种可达配置（模式×DNS×前置组合）都过了同版本 sing-box 1.14.4 的 check，并有金快照测试固化。红线不变：不做 TUN、不接管系统代理——宿主电脑的网络设置永远不动。本版真机待验：真实订阅的流量头解析、公网节点的测速与切换手感、WARP 在你的网络下能否注册成功、IPv6 节点套前置后的真实可达性（本地只验了机制与本地链路）。上一版 v0.48：四件事挤进一版——更新器加固、退出关应用、顶栏关机、全量保险库＋锁屏。① 更新器加固（修的是真机实锤的故障：v0.46 升 v0.47 时，58.8 MB 每次都下载完成，却死在最后一步把临时文件改名为正式包时报「文件正被另一进程使用」，一晚失败四次）：下载句柄在改名之前显式关闭（不再靠函数末尾的延迟关闭跨过改名）；改名带退避重试（12 次、约 50 秒，给杀毒软件扫描松手留窗口），每次失败都在控制台留痕（模块 update，注明第几次）；重试仍失败就改走兜底——把临时文件以新句柄复制成正式包、校验大小后删掉临时文件；下载前先核对已有的临时文件：大小与清单一致、SHA-256 也对得上的，说明上次其实已经下完，直接跳过下载走校验＋改名，不再白下 58 MB；只下了一部分的，用 Range 请求接着下（服务器若不支持续传就整包重下，最终 SHA-256 校验不过绝不安装）。② 退出关应用＋顶栏关机：从设置退出、托盘退出，或顶栏左端「铭杰」菜单（苹果菜单位，本版新建）里的「关机…」退出时，先还原沉浸模式，再请终端机打开的应用（隔离浏览器、商店应用、盒内应用）自己关闭，等约 5 秒还不退的，才逐个结束「由终端机启动/认领」的进程并在控制台记名，然后停核心退出——不再把应用留在宿主后台。红线不变：终端机没启动、没认领的宿主程序绝不碰。设置 → 通用新增开关「退出时关闭打开的应用」（默认开），文案写明只管用户主动退出；更新交接不关应用，空闲自动退出也不关（保险库启用时例外，见③）。「铭杰」菜单第一项是「关于铭杰终端机」，就是原来点标志打开的主页。③ 全量保险库＋锁屏（设置 → 安全与隐私新增「保险库」一节）：启用时设密码（输两遍、至少 6 位、给强度提示）；启用后，守护进程的每一条退出路径都先上锁再退出——包括空闲自动退出（人离场正是要防的场景），唯一例外是更新交接（它不是真退出，且全程在解锁会话内）。上锁＝把整个 Data 目录加密：导入的文件、浏览器资料、节点与订阅、SSH 密钥、商店应用本体、盒子全盘、组件与小龙虾配置，无一例外，范围外只有 EXE 本体与旁边的公开 sing-box 核心；磁盘上只留 EXE 旁的保险库目录，拷走全是乱码。下次打开终端机先到密码屏（按 macOS 锁屏做：壁纸模糊底、圆形头像、密码框、输错抖动）：输对密码才解密还原、撤标记，再走正常启动序列（节点自启照常，大体积有进度）；输错只留在密码屏、一条数据不动，锁定期间的输错总次数会在解锁成功后汇总记进控制台。顶栏「铭杰」菜单在保险库启用后多出「锁定屏幕」一项（没启用就不出现——没密码不做假锁）：锁屏＝关掉终端机内打开的应用、停核心与组件、把数据上锁、停在密码屏，守护进程不退出。锁定期间守护进程只服务密码屏与解锁端点，其余接口一律拒绝；节点不自启；远程协助通道整体停下（它的组网状态本来就在 Data 里，一并密封）。密码学不自创协议：数据的钥匙是一把随机主密钥，AES-256-GCM 分片加密（目标约 128 MB 一片、流式处理不整包载入内存、每片随机 nonce、整片 SHA-256 登记进清单、先验过才删那一片的明文）；密码经 Argon2id（time=3、内存 64 MB、threads=4、16 字节随机盐）派生出包裹密钥来封存主密钥，所以改密码只需重包裹、秒级完成，不重加密数据（设置里输旧密码即可改；停用保险库也要输密码，停用后退出不再上锁）。万一上锁途中被断电/强杀：已完成的片保留、剩下的还是明文（绝不出现「片没验过而明文先删」），下次启动认出这个半密封状态，输密码后按「先恢复成完整的明文 Data」收尾，数据零丢失。控制台留痕归 vault 模块（info 级）：启用、上锁开始与完成（片数与总量）、解锁成功、解锁失败、锁屏、恢复收尾；密码、密钥、明文内容绝不进日志。④ 三条如实说明（启用页与设置文案同样写明）：其一，锁屏会关闭终端机内打开的应用，和 macOS 保活应用的做法不同——这是无驱动模型决定的；其二，解锁运行期间数据在磁盘上是明文，这是免安装、免驱动便携方案的边界——保险库防的是「终端机关掉/锁上之后，文件夹被拷走」；其三，密码忘记无法找回，没有后门，主密钥只在你的密码里。上一版 v0.47：UI 复刻线第二件——顶栏补齐 macOS 的控制中心与通知中心（按《macOS 使用手册》的控制中心 / 通知中心 / 通知设置三页行为复刻，与终端机自己的功能结合）。① 控制中心：菜单栏右侧新增双开关图标（自绘），点开是一张玻璃面板。最上面是节点大格（核心控制，常驻不可关）：显示已连/未连与当前默认节点名，点主体直接连接/断开，点右边的箭头在面板内展开已保存节点列表（连接时用默认的第一个节点，增删在节点页）。开关格一点即开关、与设置双向同源：沉浸模式、台前调度、桌面全屏、Dock 自动隐藏。远程协助格点箭头展开三态（关 / 只读诊断 / 协助）：关即关总开关，只读/协助会把已配对操作者统一到该档（按人分别设仍在 设置 → 安全与隐私，走的都是既有分级机制）。壁纸格显示当前壁纸名，点主体换下一张预设，展开是预设列表点选（与设置页同源）。一条整行滑杆：Dock 图标大小（44–64，拖动时 Dock 实时变，松手落设置）——只放有真实参数支撑的滑杆，不凑数。面板底部「编辑控制中心」跳到 设置 → 桌面与 Dock 新增的「控制中心」一节，逐格开关显隐。控制中心图标右侧还有手册里的隐私指示点：有远程协助会话正连着时亮橙点，没有就不显示。② 通知中心：点菜单栏的日期时间开/关（点桌面、按 Esc 也关），整列从右侧滑入。上半是通知：状态型的状态在就一直在、不可删，带主操作按钮——隔离安装待登记（按钮去商店登记）、软件更新可用（去设置·软件更新）、服务器告警中（去服务器面板），都由守护进程从各模块自己的现成状态组装，不新建轮询。事件型的是发生过的事，记录在 Data/notifications.json（滚动上限 50 条）：节点连接失败/断开、隔离安装完成、文件导入完成、远程协助会话开始/结束、检测到新版本（只在检出那一瞬间发一条，带横幅；常驻的「更新可用」由状态型负责）。同一来源的多条自动成叠：顶层显示最新一条加计数，点开展开、Show less 收起，悬停出 × 清单条、栈上悬停出「全部清除」清整组；点通知本体按它的路由跳过去处理并清掉该条。和手册一样按来源管通知：设置新增「通知」页，六个来源（应用隔离、软件更新、服务器监控、节点、远程协助、文件）逐个有「允许通知」与「横幅」两开关——关允许则该来源不记录、状态型也不出现；关横幅只关横幅。新事件到达且通知中心关着时，桌面右上角滑入横幅（来源+标题+正文，约 6 秒自动消、悬停暂停、点它跳转并清除、× 直接清）；沉浸模式不拦横幅，它不是专注模式。③ 小部件在通知下方，三个全是真数据：日历（月视图，今日高亮）、服务器（主服务器名+在线状态+CPU/内存迷你条，数据走服务器监控现成接口）、节点（当前节点名+状态）。点小部件跳对应面板（日历没有对应面板，只展示）。底部「编辑小部件」进编辑态：逐个开关显隐、↑↓ 排序，布局存设置跟着文件夹走。天气没有数据源，不做。④ 控制台留痕归 notify 模块：通知的记录与清除都记 info（同来源同事件 10 分钟内去重防刷屏），面板开合不记。本版不含：Dock 第二件（右键菜单/徽章/弹跳）与节点页的节点切换（现有产品里选择器默认恒为第一个节点，切换是节点页专业化的一部分）仍按原排期。上一版 v0.46：UI 复刻线第一件——Dock 基础行为包（先把 macOS 的逻辑讨论清楚，再一件件复刻；本件只做 Dock 的位置、自动隐藏与放大曲线，右键菜单、徽章、启动弹跳是第二件，本版不含）。① Dock 位置成为设置项：设置 → 桌面与 Dock 新增「Dock」一节，位置可在底部（默认）/ 左侧 / 右侧之间切换，即时生效；竖排时 Dock 居中于该边，图标放大朝屏幕内侧长、运行指示点在外侧、名称标签在图标内侧弹出。台前调度开着时把 Dock 放到左侧，会和台前调度条带抢左缘：条带（系统内缩略图与外部应用卡片）临时镜像到右缘，Dock 改回来它也跟着回来——只是位置镜像，行为不变（临时共存规则）。② 自动隐藏 Dock：同页开关，默认关（找得到优先，和沉浸模式一个哲学）。开启后 Dock 沿所在边滑出、只留 3px 触发沿；指针贴到那条边停约 0.3 秒就滑入（快速甩到边沿立即滑入），移开约 0.4 秒滑出；正在拖桌面图标、或把文件从电脑拖进来靠近 Dock 时保持显示。视图本身不可见时不跑任何计时器。③ 放大曲线校准：旧实现是线性衰减，又靠浏览器 transition 在离散档位之间补间，还每帧量取正在变化中的图标位置，指针一动图标在后面追、带抖动。现在按 macOS 模型逐帧连续计算——升余弦衰减：峰值约 1.85 倍正落在指针下方的图标上、影响半径约 ±3 个图标、曲线在峰值和边缘都平滑收尾；每帧先量齐所有图标中心再统一写尺寸，放大时图标彼此推开、Dock 整体变长，底部保持基线对齐、侧边保持贴边对齐。指针离开时图标以 0.18 秒平滑落回。本版的动画时长与几何参数都收成了命名常量，为后续的统一动画规范件预留。上一版 v0.45：沉浸模式——终端机打开的一切只留在终端机里，宿主只出屏幕、键盘和鼠标。设置 → 桌面与 Dock 新增「沉浸模式」开关（默认关，你亲手打开）：开启后，已经登记进台前调度的窗口（隔离浏览器、盒内应用、桌面自己，一视同仁）会从宿主任务栏和 Alt-Tab 里消失，切换入口只剩台前调度与 Dock；回宿主的锚是右下角的托盘图标，点它整套回来。安全线是「找得到优先于藏得好」：窗口只有确认登记进台前调度之后才会被隐藏，没被认领的窗口永远留在宿主任务栏上；巡逻每轮复核，已沉浸的窗口一旦不在册立刻还原并在控制台报警；守护进程退出（设置退出 / 托盘退出 / 空闲退出 / 更新交接四条路）前，会先把全部沉浸窗口的样式还原、标记摘除，一个不漏。每个被沉浸的窗口都留有终端机自己的标记：万一守护进程被强杀或崩溃，个别窗口可能暂时留在隐藏状态——把那个窗口关掉即自愈，下次打开终端机时启动清扫也会把遗留窗口自动还原回任务栏（设置里的说明同样如实写了这一句）。同页新增「桌面全屏」开关：桌面视图以无边框全屏占据它所在的显示器，关掉开关即恢复原来的窗口大小与位置（全屏期间几何记忆暂停采样，不会把全屏本身记成「上次的位置」）。两个开关都即时生效于全部在册窗口，不用重启。上一版 v0.44：隔离安装补上「重装已装应用」的登记通道（v0.43 真机现场：把同一个 Telegram 安装包（td-setup-win-x64-7.3.3）再走一遍隔离安装，v0.43 的机制全部正常——会话豁免、30 秒进度心跳、组合完成判定 37 秒收尾——却只能报「没找到能登记的新程序」：Telegram 其实早在上一次安装时就已经装在盒子里了，只是当时登记错了人；而同版本重装时 Inno 安装器对版本相同的文件默认跳过不重写，这次一个新文件都没写，单靠「安装新增了什么」这条差分线找候选必然落空，装也装了、登记无门）。现在：安装跑完若没有新增候选，不再直接判失败，而是按安装包名到盒子现有的全部程序里找对得上的——产品词元提取与匹配（去掉 setup/install/x64/win 这类噪声词与版本号，剩余词元对候选的程序名、所在文件夹打分，含 td 对 Telegram Desktop 这类「文件夹首字母缩写」的匹配）；通用小工具（7z 系列等）和插件、临时目录里的文件照旧按形态排除，卸载器照旧排除；与安装包名对不上的别家程序亲和度不够，绝不混进来，宁可保持原来的失败结论。命中的候选带「盒内已有」标记进待登记：控制台和商店弹窗都会写明白——本次安装没有新增文件，这个程序应该是已经装在盒子里了，下面是从盒内找到的已有程序，确认主程序即可登记；待登记存盘与守护进程启动恢复走同一条回退（恢复时差分为空也按安装包名再找一次），来源标记一并存盘。从「已有」池登记的流程与新装完全一致（数据封堵名单匹配、数据目录推断照常）。收尾语三态分开：新装完成待登记 / 已在盒内待登记（本次无新增文件）/ 真失败（盒内既无新增、也找不到对得上的已有程序，保留原具名文案）。上一版 v0.43：隔离安装可靠性修复（针对 v0.42 真机装 Telegram 时暴露的现场问题）。① 安装不再无声卡死：以前的完成判定要等盒内进程「全部退出」，而 Telegram 装完会自动把本体拉起来常驻，流程于是干等满 5 分钟、全程没进度也没报错（其实最后是装完了的）。现在改成组合判定：安装器已退出＋盒内文件安静下来一段时间即算装完，常驻的应用本体不再阻塞；等待期间每 30 秒在控制台报一次进度（安装器状态、盒内会话进程数、新增文件数），商店里也实时显示阶段（下载/导入→盒内安装中→扫描登记→完成/失败）和已用时；真卡到总超时（静默安装 15 分钟、交互式 30 分钟）会以具名失败收尾，并给出当时状态摘要（安装器是否退出、盒内剩余进程、新增文件数）。② 安装器的窗口不再被抢：安装会话期间，该会话的盒内窗口完全豁免台前调度的认领、落位与呈现（此前静默安装的 Setup 窗口被巡逻登记、还被落位摆进了桌面）；「终止本次安装」也改为只终止本会话的进程，不再把盒子里其他应用一起关掉。③ 装完后的「选主程序登记」不会再丢：这一步现在会存盘，关掉商店页面、重启终端都在；安装完成时控制台会明确指路（到应用商店 → 隔离安装完成登记）；已有待登记时重复点安装会被挡下，先处理完再装下一个。④ 候选可信度（本版另一个真机事故：Telegram 的 5 个候选里混进了盒内微信补丁器临时解压的 7z.exe，用户把它登记成了「Telegram」，文件随后被微信自己清掉，点开只剩 Sandboxie 的原始报错）：现在通用小工具（7z 系列等）和插件/临时目录里的文件按形态直接排除出候选；候选在生成时、登记弹窗打开期间、点击登记时三处都会复核文件是否还在盒子里，不在的即时划掉或拒绝登记，绝不许登记一个不存在的路径；与安装包看起来无关的候选会在弹窗里打标提醒（预选只是建议，登记仍需你亲手点确认）；盒内应用每次启动前也会复核登记的程序还在不在，失效登记由终端机用自己的话说明并提供一键移除，设置 → 应用隔离的列表里也会直接标出失效登记。⑤ 按用户目录安装的应用（如 Telegram 装在 AppData\Roaming）补齐了候选排序权重，能正常排到前列。⑥ 顺带修了盒内进程名单的解析：Sandboxie 名单第一行是程序「个数」，旧解析把个数也当成 PID 收了进来（真机名单里出现过的 PID「17」就是它），可能把宿主上恰好同号的进程误认成盒内进程（现场有一扇宿主的管理员 PowerShell 因此被误认领）；现在按官方格式严格按行解析，系统类程序（PowerShell、cmd 等）走盒名单认领时还要再过一次实时名单复核，复核不过就不认领并留日志备查。上一版 v0.42：盒内应用数据封堵（v0.41 真机验收发现的新问题：盒内微信能打开了，但它读到了宿主机那份微信的账户数据，摆出的是一键登录而不是全新扫码——沙盒默认只隔离「写」不隔离「读」，盒子里没有的文件，它会读到宿主机上的真实文件）。本版给数据封堵名单内的应用（当前：微信家族，即 Weixin.exe 与 WeChat.exe）把它们的数据目录设为「只认盒内」（Sandboxie 的 WriteFilePath 按程序规则：宿主侧内容隐藏、盒内这一份照常读写）：宿主机那份数据对它们不存在，盒内从一份全新数据开始（微信即全新扫码登录），之后的数据也只长在盒子里、跟着文件夹走。这道封堵同时覆盖注册表：微信决定数据存哪儿，还会读注册表里 HKCU\Software\Tencent\WeChat 与 HKCU\Software\Tencent\Weixin 两处的值（比如宿主机那份改过的自定义存储目录），这两棵键一并设为「只认盒内」（Sandboxie 的 WriteKeyPath 按程序规则），免得盒内微信顺着宿主的值摸到封堵之外的数据目录。一句保留：盒内虚拟注册表是全盒共用的一个文件，封堵之前盒内微信自己写进影子键的旧值本版不做手术清除（离线改这个文件风险过高）——那是盒内应用自己的旧写入，不是宿主机的数据，宿主的值从此也读不到；真要连这点旧值都归零，用设置里的清空盒子即可。已经登记的盒内微信会在下一次启动前被套上封堵，并一次性清掉盒内影子里先前漏入的旧数据副本（只删盒子里面的这一份，宿主机那份全程只读不碰）；新隔离安装这类应用时，登记弹窗会提前说明它将使用全新数据。名单外的应用写入始终隔离，但读取仍可能看到宿主机上的同名文件，设置 → 应用隔离的「先说清楚」里已写明。顺带：盒子配置里按官方 BorderColor 键关掉了 Sandboxie 给盒内窗口画的黄色边框，窗口归属看台前调度即可。上一版 v0.41：盒内应用窗口呈现修复（v0.40 的真机分型日志实锤：微信进程活着、主窗口其实已经生成，只是处于隐藏状态，而认领只认可见窗口，于是全部落选，也没有任何一步去把它显示出来；同时盒子里积压了前两次失败启动留下的同名残留进程，单实例应用会把之后的启动都委托给这个隐藏的残留并继续保持隐藏）。本版：① 认领放宽——盒内应用的隐藏主窗口（有标题、非系统类的应用窗口）也能被认领，用户从桌面点击启动时守护进程会主动把它显示出来再呈现，显示前后的可见状态记入控制台；平时巡逻发现同样的隐藏窗口只登记、不抢着显示，呈现留给用户的点击。② 启动前清同名残留——盒内已有与该应用同名、且名下没有可见应用窗口的进程，判为残留，启动前逐个终止（只清同名进程，绝不动盒内其他应用）再全新拉起；若同名进程正显示着窗口，则不杀，直接呈现它已有的窗口。③ 万一仍失败，分型新增「有隐藏应用窗口但呈现失败」一类，与「进程在但无窗口」分开记录，日志一眼可辨。上一版 v0.40：热修盒内应用窗口认领（v0.39 真机首验发现：微信盒内装好、启动后窗口没能进台前调度）。根因是盒内进程由 Sandboxie 服务创建、不在守护进程的进程树里，镜像路径又是盒内虚拟路径，原有的进程树/文件夹两条身份线都认不出它。本版把 Sandboxie 自己的盒内进程名单（Start.exe /listpids）变成一等身份来源：启动时先快照盒内 PID 集、启动后差分出新 PID 直供台前调度登记；应用已在盒内运行时再点图标（差分为空）走二次启动路径，直接呈现它已有的窗口，不再误报失败；巡逻每轮刷新一次盒名单作为归属信号兜底认领；万一仍超时，控制台日志会分型说明——进程没起来 / 进程起来又退出 / 进程活着但没窗口 / 窗口在其他盒内进程名下——并附超时时刻的盒内 PID 名单与窗口交叉核对结果，下次诊断不用猜。v0.39 的应用隔离其余内容不变：应用隔离——只有安装版的软件（比如微信）也能住进终端机了。① 隔离组件：设置 → 应用隔离里一键安装 Sandboxie Plus（版本与校验钉死，安装包已内置在本程序里，没网的新电脑也能装；全程自动，只需在系统的管理员确认窗口点一次「是」）。它把软件的安装与运行关进一个盒子：程序文件、注册表、数据全落在 EXE 旁的 Data/sandbox，跟着文件夹走——换电脑把组件装一次，盒子里的软件和登录原样接着用；删掉盒子就是真卸载。先说清楚：驱动会常驻在这台电脑上直到你卸载组件，这个功能适合你自己的电脑；盒内应用默认直连网络（应用自己认代理的可指向 127.0.0.1:2080 走节点，强制全流量走节点是 Sandboxie 的付费功能，本产品不提供）。② 隔离安装：应用商店新增路线——给个安装包地址或导入本地安装包，认得出类型的自动静默装进盒子，认不出的在盒内打开安装界面让你点完；装完确认主程序，图标直接上桌面，双击打开，窗口照样进台前调度。③ 本版 EXE 约 78 MB（隔离组件包内置所致），仍是单文件，发布与更新方式不变。
            MJ-Firefox.zip / firefox.json 是 Firefox 组件的安装包与校验清单，MJ-OpenClaw.zip / openclaw.json 是小龙虾组件的安装包与校验清单，MJ-OnlyOffice.zip / onlyoffice.json、MJ-LibreOffice.zip / libreoffice.json、MJ-ImageGlass.zip / imageglass.json、MJ-Krita.zip / krita.json、MJ-VSCodium.zip / vscodium.json 是 v0.51 五个生产力组件的安装包与校验清单，都由程序按需下载，手动使用主程序时不用管。
            update.json 是给程序自动更新用的校验清单（版本/大小/SHA-256），手动下载时不用管它。
