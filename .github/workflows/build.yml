name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.go'
      - 'update.go'
      - 'accel.go'
      - 'proc_windows.go'
      - 'proc_other.go'
      - 'index.html'
      - 'go.mod'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Fetch sing-box core (official v1.14.4, legacy Windows 7 build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64-legacy-windows-7.zip" -OutFile "singbox.zip"
          $len = (Get-Item "singbox.zip").Length
          Write-Host "singbox.zip bytes: $len"
          if ($len -ne 27010034) { throw "sing-box zip size mismatch: $len" }

      - name: Build single-file EXE (windows/amd64)
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-H windowsgui -s -w" -o MJ-System.exe .
          (Get-Item "MJ-System.exe").Length

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "MJ-System.exe" -DestinationPath "MJ-System-64bit.zip" -Force
          (Get-Item "MJ-System-64bit.zip").Length
          $hash = (Get-FileHash "MJ-System-64bit.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "MJ-System-64bit.zip").Length
          $manifest = [ordered]@{ version = "0.15"; file = "MJ-System-64bit.zip"; size = $size; sha256 = $hash }
          $json = $manifest | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "update.json"), $json, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "update.json"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.15
          name: 铭杰终端机 v0.15（64 位单文件版 · 台前调度）
          body: |
            64 位单文件版：解压后运行 MJ-System.exe（需 64 位 Windows）。
            第一次运行会自动释放内置 sing-box 核心，数据保存在 EXE 旁的 Data/ 文件夹。
            本版修复：启动节点时桌面上冒出的黑色控制台窗口已消除——sing-box 核心（含启动前校验）与内置终端的子进程全部改为无窗口启动，浏览器打开时桌面保持干净。其他功能与 v0.8 相同（软件内全局加速、应用内更新）。
            升级方法：设置 → 软件更新 →「检查更新」→「下载更新」→「重启并更新」。
            update.json 是给程序自动更新用的校验清单（版本/大小/SHA-256），手动下载时不用管它。
          files: |
            MJ-System-64bit.zip
            update.json
