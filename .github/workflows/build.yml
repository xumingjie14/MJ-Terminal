name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:

  # v0.57 architecture block 1: the CI hard gate. Every check the
  # local flow runs by hand -- Go tests, the seven node JS suites,
  # gofmt cleanliness, windows-target vet -- runs here FIRST, and
  # the build job below `needs` this job: a red gate means the
  # release steps never execute. Nothing here needs a display; the
  # suites are pure node scripts and the Go tests are headless.
  # v0.58 architecture block 2 adds the frontend gate at the head
  # of this job: npm ci installs the pinned TypeScript/esbuild
  # toolchain, tsc typechecks the web/ sources, the build
  # regenerates index.html, and a git-diff step FAILS the job if
  # the committed artifact is not byte-identical to the fresh
  # build -- a stale artifact can never slip through and get
  # silently rebuilt-and-passed by the later steps.
  # v0.59 architecture block 3 adds the API contract gate after
  # the embed fetches (the generator is `go run .`, which needs
  # the full package to compile): web/src/api-types.ts is
  # regenerated from the Go contract structs and the job FAILS
  # if the committed file differs.
  # v0.60 architecture block 4 needs no new step here: the
  # backend now lives partly in internal/ packages (diag,
  # datastore, events), which `go test ./...` and the cross-build
  # below cover unchanged, and the feature-registry gate
  # (registry_test.go: console module tags, settings-key
  # ownership, local+remote route coverage) runs inside the
  # same Go test suite.
  # v0.61 architecture block 5 (security close-out) adds three
  # things: the crypto-consolidation gate (asec_gate_test.go:
  # no package outside internal/asec imports crypto primitives
  # directly) rides inside the Go test suite like the registry
  # gate; a bounded fuzz smoke step below runs every parser
  # fuzz target for 20s (their seed corpora already run inside
  # `go test ./...`); and the build job signs the update
  # manifest after Package (update.json.sig), because the
  # daemon now refuses unsigned or badly signed manifests.
  verify:
    runs-on: windows-latest
    steps:
      # Pin LF BEFORE checkout: with the runner's default CRLF
      # conversion every file would look unformatted to gofmt and
      # the check would measure line endings, not formatting.
      - name: Pin git to LF (gofmt check integrity)
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Frontend gate (v0.58 block 2): pinned toolchain from the
      # committed lockfile, typecheck, rebuild, freshness proof.
      - name: Install frontend toolchain (npm ci)
        shell: pwsh
        run: npm ci

      - name: Frontend typecheck (tsc --noEmit)
        shell: pwsh
        run: npm run typecheck

      - name: Frontend build (regenerate index.html)
        shell: pwsh
        run: npm run build

      - name: Artifact freshness gate (committed index.html must equal fresh build)
        shell: pwsh
        run: |
          git diff --exit-code -- index.html
          if ($LASTEXITCODE -ne 0) { throw "committed index.html is stale: run 'npm run build' and commit the regenerated artifact" }
          Write-Host "index.html: committed artifact matches a fresh build"

      - name: Download Go modules (incl. tailscale/tsnet)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go mod download

      # go:embed prerequisites -- the same pinned fetches the
      # build job performs: singbox.zip and the Sandboxie
      # installer are not committed and the package does not
      # compile (or test) without them.
      - name: Fetch sing-box core (official v1.14.4, legacy Windows 7 build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64-legacy-windows-7.zip" -OutFile "singbox.zip"
          $len = (Get-Item "singbox.zip").Length
          Write-Host "singbox.zip bytes: $len"
          if ($len -ne 27010034) { throw "sing-box zip size mismatch: $len" }

      - name: Fetch Sandboxie component (official v1.18.8, pinned, embedded)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sandboxie-plus/Sandboxie/releases/download/v1.18.8/Sandboxie-Plus-x64-v1.18.8.exe" -OutFile "assets/sandboxie-plus-x64-v1.18.8.exe"
          $len = (Get-Item "assets/sandboxie-plus-x64-v1.18.8.exe").Length
          Write-Host "sandboxie installer bytes: $len"
          if ($len -ne 24930680) { throw "Sandboxie installer size mismatch: $len" }
          $hash = (Get-FileHash "assets/sandboxie-plus-x64-v1.18.8.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "sandboxie installer sha256: $hash"
          if ($hash -ne "f27078ff74a07906fd51476079e1a7a8f5e20c8bb75a9d2ae86169d47179ae76") { throw "Sandboxie installer sha256 mismatch: $hash" }

      # API contract gate (v0.59 block 3): regenerate the
      # TypeScript contract from the Go structs; a stale
      # committed contract fails the job (same pattern as the
      # block-2 artifact freshness gate).
      - name: API contract freshness gate (regenerate api-types.ts, must be unchanged)
        shell: pwsh
        run: |
          go run . -apigen-out=web/src/api-types.ts
          if ($LASTEXITCODE -ne 0) { throw "apigen failed" }
          git diff --exit-code -- web/src/api-types.ts
          if ($LASTEXITCODE -ne 0) { throw "committed web/src/api-types.ts is stale: run 'npm run api:gen' and commit the regenerated contract" }
          Write-Host "api-types.ts: committed contract matches the Go structs"

      - name: gofmt check
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { $bad | ForEach-Object { Write-Host "not gofmt-clean: $_" }; throw "gofmt check failed" }
          Write-Host "gofmt: all files clean"

      # The unsafeptr analyzer is the ONLY vet check turned off:
      # the Win32 interop layer carries four known unsafe.Pointer
      # warnings (sandbox_windows.go, winmgr_windows.go) that
      # predate this gate; every other analyzer gates the release.
      - name: go vet (windows target)
        shell: pwsh
        run: go vet -unsafeptr=false ./...

      - name: Go tests
        shell: pwsh
        run: go test ./...

      # Fuzz smoke (v0.61 block 5): every parser fuzz target
      # (share links / subscription bodies, base64, update
      # manifest + signature verify, vault metadata, SSH keys)
      # gets a bounded 20s live run. A crasher or hang here
      # fails the gate like any other red test. Blocking and
      # bounded by construction.
      #
      # Flake hardening (v0.62-test1, after run #140): that run
      # failed FuzzParseSubContent at 21.03s with nothing but
      # "context deadline exceeded" and NO failing input. A
      # local investigation proved no slow input exists for
      # this target: a 180s run completes 724k execs clean;
      # every one of 466 cached corpus inputs executes in
      # ~0.4ms or less; parseSubContent scales linearly (1MB
      # of share-link lines = 225ms; a 2.2MB Clash YAML with
      # 20k proxies = 400ms) -- orders of magnitude below the
      # fuzz worker's 10s per-input watchdog, which turns any
      # genuine hang into a WRITTEN crasher input, never a
      # bare deadline error. The bare error is the fuzz
      # coordinator's shutdown race: at -fuzztime expiry a
      # worker that does not respond within its 1s budget
      # (internal/fuzz workerTimeoutDuration; on Windows the
      # stop path goes straight to Kill) can surface the
      # expired context as the run's failure when a burstable
      # runner stalls at exactly that instant. So a failure
      # is retried ONCE, only when it carries exactly that
      # signature: "context deadline exceeded" in the output
      # AND no crasher evidence anywhere (no "Failing input
      # written to", no panic, no new file under
      # testdata/fuzz/<target>). Anything else -- and
      # anything that fails twice -- throws on the spot, so
      # a real crasher or hang can never be retried away:
      # it always writes its input first. -timeout 120s
      # bounds each test binary outright (6x the fuzz budget)
      # so a wedged coordinator self-terminates instead of
      # eating the job.
      - name: Fuzz smoke (parser fuzz targets, 20s each)
        shell: pwsh
        run: |
          $targets = @("FuzzParseShareLink", "FuzzParseSubContent", "FuzzB64Decode", "FuzzUpdateManifestParse", "FuzzVaultLoadMeta", "FuzzVaultShardHeader", "FuzzVaultOpenEncoded", "FuzzSSHKeyParse")
          foreach ($tgt in $targets) {
            Write-Host "== fuzz $tgt =="
            $corpusDir = Join-Path "testdata" (Join-Path "fuzz" $tgt)
            $before = @()
            if (Test-Path $corpusDir) { $before = @(Get-ChildItem $corpusDir -File | Select-Object -ExpandProperty Name) }
            $attempt = 0
            while ($true) {
              $attempt++
              $out = (& go test -run=NONE -timeout 120s -fuzz="^$tgt$" -fuzztime=20s . 2>&1 | Out-String)
              $code = $LASTEXITCODE
              if ($out) { Write-Host $out }
              if ($code -eq 0) { break }
              $after = @()
              if (Test-Path $corpusDir) { $after = @(Get-ChildItem $corpusDir -File | Select-Object -ExpandProperty Name) }
              $newFiles = @($after | Where-Object { $before -notcontains $_ })
              $isFlake = ($out -match "context deadline exceeded") -and
                         ($out -notmatch "Failing input written to") -and
                         ($out -notmatch "panic:") -and
                         ($newFiles.Count -eq 0)
              if ($isFlake -and $attempt -eq 1) {
                Write-Warning "fuzz $tgt failed with the coordinator deadline signature and no failing input (see the flake-hardening comment above); retrying once."
                continue
              }
              throw "fuzz smoke failed: $tgt"
            }
          }

      - name: JS suites (node)
        shell: pwsh
        run: |
          $suites = @("deskboot_test.js", "desk56_test.js", "launchpad_test.js", "spot_test.js", "filesview_test.js", "ncgroup_test.js", "dockmag_test.js", "events_test.js")
          foreach ($s in $suites) {
            Write-Host "== $s =="
            node $s
            if ($LASTEXITCODE -ne 0) { throw "JS suite failed: $s" }
          }

      - name: Cross-build check (linux target)
        shell: pwsh
        run: |
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build ./...

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Fetch sing-box core (official v1.14.4, legacy Windows 7 build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64-legacy-windows-7.zip" -OutFile "singbox.zip"
          $len = (Get-Item "singbox.zip").Length
          Write-Host "singbox.zip bytes: $len"
          if ($len -ne 27010034) { throw "sing-box zip size mismatch: $len" }

      - name: Download Go modules (incl. tailscale/tsnet)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download

      # The Sandboxie installer is embedded into the EXE (v0.39) but
      # never committed to git: fetch the pinned official package,
      # verify size + SHA-256, and stage it at the go:embed path.
      - name: Fetch Sandboxie component (official v1.18.8, pinned, embedded)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sandboxie-plus/Sandboxie/releases/download/v1.18.8/Sandboxie-Plus-x64-v1.18.8.exe" -OutFile "assets/sandboxie-plus-x64-v1.18.8.exe"
          $len = (Get-Item "assets/sandboxie-plus-x64-v1.18.8.exe").Length
          Write-Host "sandboxie installer bytes: $len"
          if ($len -ne 24930680) { throw "Sandboxie installer size mismatch: $len" }
          $hash = (Get-FileHash "assets/sandboxie-plus-x64-v1.18.8.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "sandboxie installer sha256: $hash"
          if ($hash -ne "f27078ff74a07906fd51476079e1a7a8f5e20c8bb75a9d2ae86169d47179ae76") { throw "Sandboxie installer sha256 mismatch: $hash" }

      - name: Build single-file EXE (windows/amd64)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-H windowsgui -s -w" -o MJ-System.exe .
          (Get-Item "MJ-System.exe").Length

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "MJ-System.exe" -DestinationPath "MJ-System-64bit.zip" -Force
          (Get-Item "MJ-System-64bit.zip").Length
          $hash = (Get-FileHash "MJ-System-64bit.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "MJ-System-64bit.zip").Length
          $manifest = [ordered]@{ version = "0.69"; file = "MJ-System-64bit.zip"; size = $size; sha256 = $hash }
          $json = $manifest | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "update.json"), $json, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "update.json"


      # v0.61 block 5: sign the update manifest. The daemon
      # refuses any update.json whose detached Ed25519 signature
      # (update.json.sig) is missing or does not verify against
      # the public key embedded in internal/asec, so an unsigned
      # release is a release v0.61+ updaters reject. The private
      # key reaches this step ONLY as the MJ_UPDATE_SIGNING_KEY
      # secret (PKCS#8 PEM); it is staged on the runner temp
      # volume for this step only and deleted in the same step,
      # and is never echoed. If the secret is not configured the
      # step warns loudly and produces NO signature -- this first
      # signed version deliberately does not hard-fail the whole
      # build on a missing secret; set the secret and re-run to
      # ship a signed manifest.
      - name: Sign update manifest (Ed25519, update.json.sig)
        shell: pwsh
        env:
          MJ_UPDATE_SIGNING_KEY: ${{ secrets.MJ_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MJ_UPDATE_SIGNING_KEY)) {
            Write-Warning "MJ_UPDATE_SIGNING_KEY secret is not set: update.json will be published UNSIGNED and v0.61+ updaters will refuse it."
          } else {
            $keyFile = Join-Path $env:RUNNER_TEMP "mj-update-signing.pem"
            [IO.File]::WriteAllText($keyFile, $env:MJ_UPDATE_SIGNING_KEY, (New-Object System.Text.UTF8Encoding $false))
            try {
              go run signmanifest_tool.go -key $keyFile -in "update.json" -out "update.json.sig"
              if ($LASTEXITCODE -ne 0) { throw "manifest signing failed" }
              $sigLen = (Get-Item "update.json.sig").Length
              Write-Host "update.json.sig bytes: $sigLen"
              if ($sigLen -ne 64) { throw "update.json.sig size mismatch: $sigLen" }
            } finally {
              Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package Firefox component (ESR 153.5.1 zh-CN, portable)
        shell: pwsh
        run: |
          $ffver = "153.5.1esr"
          $url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/$ffver/win64/zh-CN/Firefox%20Setup%20$ffver.exe"
          Invoke-WebRequest -Uri $url -OutFile "ffsetup.exe"
          $ilen = (Get-Item "ffsetup.exe").Length
          Write-Host "ffsetup.exe bytes: $ilen"
          if ($ilen -lt 50000000) { throw "Firefox installer too small: $ilen" }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip x "ffsetup.exe" "-offx" -y | Out-Null
          if (!(Test-Path "ffx\core\firefox.exe")) { throw "firefox.exe not found after extract" }
          New-Item -ItemType Directory -Force -Path "ffx\core\distribution" | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD "ffx\core\distribution\policies.json"), '{ "policies": { "DisableAppUpdate": true } }', (New-Object System.Text.UTF8Encoding $false))
          Compress-Archive -Path "ffx\core\*" -DestinationPath "MJ-Firefox.zip" -Force
          $fhash = (Get-FileHash "MJ-Firefox.zip" -Algorithm SHA256).Hash.ToLower()
          $fsize = (Get-Item "MJ-Firefox.zip").Length
          $fman = [ordered]@{ version = $ffver; file = "MJ-Firefox.zip"; size = $fsize; sha256 = $fhash }
          $fjson = $fman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "firefox.json"), $fjson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "firefox.json"

      - name: Assemble OpenClaw component (portable Node v24.22.1 + OpenClaw 2026.10.8)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ocVer = "2026.10.8"
          $nodeVer = "24.22.1"
          $stage = Join-Path $PWD "oc-stage"
          $comp = Join-Path $stage "component"
          $runtimeDir = Join-Path $comp "runtime"
          $appDir = Join-Path $comp "app"
          New-Item -ItemType Directory -Force -Path $runtimeDir, $appDir | Out-Null
          # Portable Node: official win-x64 zip from nodejs.org, its
          # contents land directly in component\runtime (node.exe at
          # the runtime root), same layout as the validation runs.
          $nodeZip = Join-Path $stage "node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVer/node-v$nodeVer-win-x64.zip" -OutFile $nodeZip
          Write-Host "node zip bytes: $((Get-Item $nodeZip).Length)"
          Expand-Archive -Path $nodeZip -DestinationPath (Join-Path $stage "node-x") -Force
          Copy-Item -Path (Join-Path $stage "node-x\node-v$nodeVer-win-x64\*") -Destination $runtimeDir -Recurse -Force
          $nodeExe = Join-Path $runtimeDir "node.exe"
          if (!(Test-Path $nodeExe)) { throw "node.exe missing after extract" }
          # Runtime pinning (validation run #1 died right here: install
          # scripts resolved bare `node` to the runner's preinstalled
          # Node 22 and OpenClaw's version check aborted the install).
          # Same triple pinning as openclaw-validate.yml: PATH first,
          # --scripts-prepend-node-path=true, absolute-path calls, and
          # a fail-fast guard before installing anything.
          $env:PATH = "$runtimeDir;$env:PATH"
          $nodeV = (& $nodeExe -v).Trim()
          Write-Host "node -v = $nodeV"
          if ($nodeV -ne "v$nodeVer") { throw "node version mismatch: $nodeV" }
          $resolvedNode = (Get-Command node -ErrorAction Stop).Source
          if (-not ($resolvedNode -like "$runtimeDir*")) { throw "node resolves outside component runtime: $resolvedNode" }
          $npm = Join-Path $runtimeDir "npm.cmd"
          # npm local-prefix install of the pinned OpenClaw into
          # component\app. The npm cache stays in the staging area,
          # never inside the component; the zip ships runtime + app
          # only (state is provisioned by the daemon at first start).
          $env:npm_config_cache = Join-Path $stage "npm-cache"
          $pkg = [ordered]@{ dependencies = [ordered]@{ openclaw = $ocVer } }
          ($pkg | ConvertTo-Json) | Set-Content (Join-Path $appDir "package.json") -Encoding utf8
          Push-Location $appDir
          & $npm install --no-audit --no-fund --loglevel=warn --scripts-prepend-node-path=true --registry "https://registry.npmjs.org/"
          $npmCode = $LASTEXITCODE
          Pop-Location
          if ($npmCode -ne 0) { throw "npm install failed: exit $npmCode" }
          $ocBin = Join-Path $appDir "node_modules\.bin\openclaw.cmd"
          if (!(Test-Path $ocBin)) { throw "openclaw entry shim missing after install: $ocBin" }
          $ocEntry = Join-Path $appDir "node_modules\openclaw\openclaw.mjs"
          if (!(Test-Path $ocEntry)) { throw "openclaw.mjs missing after install: $ocEntry" }
          $ocV = (& $ocBin --version 2>&1 | Out-String).Trim()
          Write-Host "openclaw --version = $ocV"
          if ($ocV -notlike "*$ocVer*") { throw "openclaw version mismatch: $ocV" }
          Compress-Archive -Path (Join-Path $comp "runtime"), (Join-Path $comp "app") -DestinationPath "MJ-OpenClaw.zip" -Force
          $osize = (Get-Item "MJ-OpenClaw.zip").Length
          Write-Host "MJ-OpenClaw.zip bytes: $osize"
          if ($osize -lt 100000000) { throw "OpenClaw component zip implausibly small: $osize" }
          $ohash = (Get-FileHash "MJ-OpenClaw.zip" -Algorithm SHA256).Hash.ToLower()
          $oman = [ordered]@{ version = $ocVer; file = "MJ-OpenClaw.zip"; size = $osize; sha256 = $ohash }
          $ojson = $oman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "openclaw.json"), $ojson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "openclaw.json"

      - name: Package ONLYOFFICE component (Desktop Editors 10.0.0, official portable zip)
        shell: pwsh
        run: |
          $ooVer = "10.0.0"
          $ooUrl = "https://github.com/ONLYOFFICE/DesktopEditors/releases/download/v$ooVer/DesktopEditors_x64.zip"
          Invoke-WebRequest -Uri $ooUrl -OutFile "oo.zip"
          $ooSize = (Get-Item "oo.zip").Length
          Write-Host "onlyoffice zip bytes: $ooSize"
          if ($ooSize -ne 397286158) { throw "onlyoffice zip size mismatch: $ooSize" }
          tar.exe -tf "oo.zip" | Out-File -Encoding utf8 "oo-list.txt"
          if (!(Select-String -Path "oo-list.txt" -SimpleMatch "DesktopEditors.exe" -Quiet)) { throw "DesktopEditors.exe not found in onlyoffice zip" }
          Copy-Item "oo.zip" "MJ-OnlyOffice.zip"
          $ooHash = (Get-FileHash "MJ-OnlyOffice.zip" -Algorithm SHA256).Hash.ToLower()
          $ooMan = [ordered]@{ version = $ooVer; file = "MJ-OnlyOffice.zip"; size = $ooSize; sha256 = $ooHash }
          $ooJson = $ooMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "onlyoffice.json"), $ooJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "onlyoffice.json"

      - name: Package LibreOffice component (26.8.2, official MSI admin-extract)
        shell: pwsh
        run: |
          $loVer = "26.8.2"
          $loUrl = "https://download.documentfoundation.org/libreoffice/stable/$loVer/win/x86_64/LibreOffice_${loVer}_Win_x86-64.msi"
          Invoke-WebRequest -Uri $loUrl -OutFile "lo.msi"
          $msiSize = (Get-Item "lo.msi").Length
          Write-Host "libreoffice msi bytes: $msiSize"
          if ($msiSize -ne 375934976) { throw "libreoffice msi size mismatch: $msiSize" }
          $loDir = Join-Path $PWD "lo-admin"
          $loProc = Start-Process msiexec.exe -ArgumentList "/a `"$PWD\lo.msi`" /qn TARGETDIR=`"$loDir`"" -Wait -PassThru
          if ($loProc.ExitCode -ne 0) { throw "msiexec /a failed: exit $($loProc.ExitCode)" }
          $sofficeItem = Get-ChildItem $loDir -Recurse -Filter "soffice.exe" | Select-Object -First 1
          if (!$sofficeItem) { throw "soffice.exe missing after admin extract" }
          $loRoot = $sofficeItem.Directory.Parent.FullName
          Write-Host "libreoffice root: $loRoot"
          Compress-Archive -Path (Join-Path $loRoot "*") -DestinationPath "MJ-LibreOffice.zip" -Force
          tar.exe -tf "MJ-LibreOffice.zip" | Out-File -Encoding utf8 "lo-list.txt"
          if (!(Select-String -Path "lo-list.txt" -SimpleMatch "soffice.exe" -Quiet)) { throw "soffice.exe not in MJ-LibreOffice.zip" }
          $loSize = (Get-Item "MJ-LibreOffice.zip").Length
          Write-Host "MJ-LibreOffice.zip bytes: $loSize"
          if ($loSize -lt 100000000) { throw "libreoffice component zip implausibly small: $loSize" }
          $loHash = (Get-FileHash "MJ-LibreOffice.zip" -Algorithm SHA256).Hash.ToLower()
          $loMan = [ordered]@{ version = $loVer; file = "MJ-LibreOffice.zip"; size = $loSize; sha256 = $loHash }
          $loJson = $loMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "libreoffice.json"), $loJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "libreoffice.json"

      - name: Package ImageGlass component (10.0.6.906, official portable zip)
        shell: pwsh
        run: |
          $igVer = "10.0.6.906"
          $igUrl = "https://github.com/d2phap/ImageGlass/releases/download/$igVer/ImageGlass_${igVer}_win-x64.zip"
          Invoke-WebRequest -Uri $igUrl -OutFile "ig.zip"
          $igSize = (Get-Item "ig.zip").Length
          Write-Host "imageglass zip bytes: $igSize"
          if ($igSize -ne 43934433) { throw "imageglass zip size mismatch: $igSize" }
          tar.exe -tf "ig.zip" | Out-File -Encoding utf8 "ig-list.txt"
          if (!(Select-String -Path "ig-list.txt" -SimpleMatch "ImageGlass.exe" -Quiet)) { throw "ImageGlass.exe not found in imageglass zip" }
          Copy-Item "ig.zip" "MJ-ImageGlass.zip"
          $igHash = (Get-FileHash "MJ-ImageGlass.zip" -Algorithm SHA256).Hash.ToLower()
          $igMan = [ordered]@{ version = $igVer; file = "MJ-ImageGlass.zip"; size = $igSize; sha256 = $igHash }
          $igJson = $igMan | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "imageglass.json"), $igJson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "imageglass.json"

