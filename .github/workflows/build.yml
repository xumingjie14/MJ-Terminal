      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.69-test4
          prerelease: true
          name: 铭杰终端机 v0.69-test4（测试版 · 大版本：任务管理器 + 添加应用 + 落点收口）
          body: |
            【测试版】v0.69-test4：一个大版本，三块一起出。先行验证版，不是正式版。64 位单文件版：解压后运行 MJ-System.exe（需 64 位 Windows）。验证方式：只替换 EXE（Data/ 不动），或在「设置 → 软件更新」打开测试版通道后在应用内更新。
            【与 test3 的区别】功能三块与 test3 完全相同，只修 test3 真机复测仍漏的下载出口（用户实测「图片另存为还有七七八八的还是跳到（宿主）下载」）。逐项盘清共五处，本版一并收口：(1) 另存为家族走的是另一份保存记忆：图片/链接另存为、Ctrl+S 存网页、打印存 PDF 用的都是 savefile.default_directory，不是下载目录——老档案里这份记忆若曾指向宿主下载夹，保存框就一直从那儿开；且 download.prompt_for_download 若开着，每次下载都弹框、起点还是旧记忆。本版将 download.default_directory、savefile.default_directory 与 download.prompt_for_download=false 三键同钉到 Data/Downloads（关掉下载前询问是收口口径：点下载直接落 Data，不弹框回旧记忆）。(2) 桌面视图（Edge 壳，档案 Data/ShellProfile）从没钉过：控制台导出日志、文件下载、SSH 下载、数据导出等在视图内触发的下载，默认落宿主下载夹；本版每次拉起视图前对 ShellProfile 的 Default/Preferences 跑同一套三键钉（Edge 与 Chrome 同为 Chromium 布局与键名，一套代码），保险库锁定期间跳过（那时视图用的是临时档案，真实档案在解锁后的首次拉起与退出回钉时补钉）。(3) 驻留沿用旧值：Preferences 只在浏览器完全退出时才写得进，test3 的钉写在启动一刻——浏览器若正驻留，写被跳过、运行实例继续用旧值，看起来就像「锁了还跳宿主」。本版加退出回钉看守：守护进程以既有巡逻节奏（2 秒）盯 ChromeProfile 与 ShellProfile 两个档案根目录的 lockfile，一旦由有变无（浏览器/视图彻底退出）立即回钉该档案全部键（隔离 Chrome 的深色主题播种同为 Preferences 写入、同病同治，一并回钉），控制台 [browser] 记一行「浏览器已退出，已回钉下载与保存目录」（视图为「桌面视图已退出…」）。竞态如实说明：回钉前会再确认一次 lockfile 确已消失，各写入函数内部还会再查一次；若浏览器恰在回钉瞬间重启，最坏情况是一次启动没钉住、下一次退出再钉，不会写坏档案。(4) Firefox 按站记忆：它会按网站记上次保存目录，老记录指向宿主时会让另存为从那儿开；本版在播种的 user.js 里关掉按站记忆（browser.download.lastDir.savePerSite=false，已存的按站记录随之不再被采用，不做数据库手术），并把全局 browser.download.lastDir 一并钉到 Data/Downloads。(5) 启动自检行措辞随之更新为「下载/保存目录已锁定 Data/Downloads」，浏览器运行中沿用分支同理。边界口径（本版不变）：程序自己选的落点一律 Data；用户在保存框里亲手导航到别处、或把文件拖出浏览器，属显式导出，不拦截——但保存框的起点永远在 Data。盒装应用内选的路径物理落在 Data/sandbox（应用里看着像宿主路径），收口本来就成立。测试侧：三键合并与落盘按真实目录结构覆盖（含 ShellProfile 场景、根目录 Preferences 永不被创建的负例、已有档案里 prompt 为 true 时被翻转为 false 且无关键不被扰动），看守的跳变判定做成纯函数单测（无→有不钉、有→无钉、无→无不重复钉），并经变异验证（临时摘掉 savefile 一钉，套件立刻变红，恢复后复绿）。
            【块一 · 任务管理器】菜单栏右侧新增脉搏图标入口（设置 → 桌面与 Dock → 菜单栏 可关），点开是速览面板；另有独立应用「任务管理器」（桌面 / 启动台 / 聚焦搜索可达）：终端自己的进程按应用分组（隔离 Chrome 及其全部子进程聚合、Firefox 两个条目分开、节点核心、生产力组件、商店便携应用、沙盒应用），每进程 CPU% 与内存（工作集）、分组聚合，列可排序、可搜索、分组可折叠，1 秒刷新（关掉即停采）；窗口无响应会标「无响应」；系统内打开的窗口也列在里面，结束 = 走正常关窗路径。结束动作：普通进程直接结束，核心与浏览器全体要二次确认；核心走它自己的停止路径，重启也只有核心有（现成路径），浏览器只能结束不能重启（没有现成路径，不硬造）。守护进程本体单列一行（版本 / 运行时长 / 自身占用），没有结束按钮——它的出口只有 设置 → 退出系统。管辖边界：只列守护进程登记归属的进程（自己拉起的、跑本终端档案的、程序在终端文件夹/Data 下的、沙盒名单里的），电脑上其他软件的进程永不列出、永不动。全部动作记进控制台 [taskmgr]。
            【块二 · 添加应用】Chrome 自带的「安装应用」装的东西进的是 Chrome 自己的应用系统，永远到不了 MJ 桌面——本版补上 MJ 原生入口（不依赖任何浏览器扩展）：(A) 台前调度里应用化窗口的卡片右键菜单新增「固定为桌面应用」：守护进程本来就知道这个窗口的网址和标题，据此直接登记进桌面应用账本；(B) 桌面右键菜单与启动台新增「添加应用…」：粘贴网址，守护进程走节点抓页面标题预填（可改名），保存时再走节点抓站点图标存进 Data/webicons（apple-touch-icon → 图标链接 → favicon 依次回退，抓不到用字母图标）。重复网址会检测并提示已有，不会悄悄覆盖。自加条目和出厂条目一样出现在桌面 / Dock / 台前调度 / 聚焦搜索，可经条目右键菜单改名、卸载。
            【块三 · 落点收口（铁律：终端产生的文件只能落 Data）】(1) 落点全钉：每次启动隔离 Chrome（写其档案 Default/Preferences）、每次拉起桌面视图（写 ShellProfile 的 Default/Preferences）时，把下载目录（download.default_directory）、另存为家族的保存记忆（savefile.default_directory）与下载前询问（download.prompt_for_download=false）三键一并钉到当前这台电脑的 Data/Downloads 绝对路径，目录不存在自动建；Firefox 侧播种 user.js（下载目录钉死 + 关掉按网站记上次目录 + 全局 lastDir 钉死）。浏览器或视图彻底退出时，看守再回钉一次（治驻留实例沿用旧值）。每次启动控制台 [browser] 都有一行自检（「下载/保存目录已锁定 Data/Downloads」；已在运行时沿用档案里已钉好的值，也会明说），每次回钉也有一行记录。(2) PWA 快捷方式清扫：Chrome「安装应用」会在宿主开始菜单 / 桌面生成指向本终端 Chrome 档案的 .lnk——浏览器启动时守护进程扫描这两个位置，只删除字节内容明确指向本终端 Data\ChromeProfile 路径的 .lnk（靠路径特征判定，宁可漏删不可误删；宿主自己 Chrome 的快捷方式永不命中），逐个记 [browser] 日志（含完整路径），清空的「Chrome Apps」文件夹一并移除；开关在 设置 → 浏览器（默认开）。(3) 审计结论：商店应用装在 Data/apps、生产力组件装在 Data/components、沙盒载荷在 Data/sandbox、本版新增的站点图标在 Data/webicons、下载在 Data/Downloads——都在 Data 下；Firefox 程序本体在 EXE 旁的 core 文件夹（在终端文件夹内、跟着文件夹走，但严格说不在 Data 里），如实标注，不算宿主泄漏。
            【顺手修复】v0.68 的网页通知总开关（设置 → 通知 →「网页通知」允许 / 横幅）拨了不生效：守护进程设置处理漏了这两个键的分支，前端拨动被静默忽略。本版补上，拨动即落盘生效。
            请重点验证：(1) 任务管理器：打开隔离 Chrome 几个网页 + 一个应用化窗口、启动核心，在顶栏面板和任务管理器窗口里确认分组与占用在动；结束一个普通进程（如某个组件）立即生效；结束核心有二次确认且核心真停下，再点「重启」能接回；把某个窗口弄到无响应时（可选）能看到标记。(2) 添加应用：对一个已打开的应用化窗口在台前调度卡片右键选「固定为桌面应用」，桌面出现该应用、图标是站点图标、点开能用；再在桌面右键「添加应用…」粘贴一个新网址，识别出标题、保存后桌面出现且能打开；对已存在的网址再添加一次，应提示已存在。(3) 落点收口（test4 重点）：在隔离 Chrome 里普通下载一个文件，应落终端文件夹的 Data/Downloads；再对一张图片右键「图片另存为」，保存框的起点应在 Data/Downloads（就此保存，确认文件实落）；Ctrl+S 存一个网页、或打印存一页 PDF，起点同理。去控制台导出一次日志（桌面视图内下载），确认也落 Data/Downloads。驻留链路验证：先让 Chrome 开着驻留（此间下载可能仍沿用旧值，正是要验的一环），然后把 Chrome 完全退出，看控制台 [browser] 是否出现「浏览器已退出，已回钉下载与保存目录」；重新打开 Chrome 再下载，应落 Data/Downloads。然后在 Chrome 里对一个网站用「安装应用」装成 PWA，重启一次隔离浏览器，确认宿主开始菜单 / 桌面里指向本档案的快捷方式被清掉、控制台 [browser] 有清扫记录；去 设置 → 浏览器 关掉清扫开关后重复一次，快捷方式应保留。(4) 复核 test3 两项：把 Chrome 完全退出（任务管理器里确认没有 chrome.exe）再从终端机冷启动隔离浏览器，30 秒后看控制台 [notify]——出现「网页通知桥未见连接」时警告里应带本次浏览器文件名（预期 chrome.exe；如实预期：品牌版 Chrome 137+ 从代码层面忽略 --load-extension，本版不承诺桥能连上，桥的装载路线留待后续立项）；来一条长标题长正文的通知时，确认右上角横幅标题只占一行、正文最多两行带省略，不再整段铺开。
            数据与设置与 v0.68 完全兼容：只换 EXE 即可，设置、节点、桌面布局原样保留；0.69 线新增设置键 taskmgrBar（顶栏任务管理器入口，默认开）与 pwaSweep（PWA 快捷方式清扫，默认开），新增 Data 子目录 Downloads 与 webicons。MJ-Firefox.zip、MJ-OpenClaw.zip 与五个生产力组件包是程序按需下载的组件，update.json / update.json.sig 是自动更新用的校验清单与签名，手动使用主程序时都不用管。
          files: |
            MJ-System-64bit.zip
            update.json
            update.json.sig
