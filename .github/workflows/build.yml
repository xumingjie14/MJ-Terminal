name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.go'
      - 'update.go'
      - 'accel.go'
      - 'firefox.go'
      - 'proc_windows.go'
      - 'proc_other.go'
      - 'index.html'
      - 'go.mod'
      - 'go.sum'
      - 'ssh.go'
      - 'servermon.go'
      - 'servermon_agent.go'
      - 'winmgr.go'
      - 'winmgr_windows.go'
      - 'winmgr_other.go'
      - 'diag.go'
      - 'settings.go'
      - 'notify.go'
      - 'storage.go'
      - 'files.go'
      - 'owncheck.go'
      - 'winset.go'
      - 'shellview.go'
      - 'tray_windows.go'
      - 'tray_other.go'
      - 'remote.go'
      - 'remote_tsnet.go'
      - 'remote_stub.go'
      - 'apps.go'
      - 'apps.json'
      - 'openclaw.go'
      - 'openclaw_plus.go'
      - 'openclaw_windows.go'
      - 'openclaw_other.go'
      - 'sandbox.go'
      - 'sandbox_windows.go'
      - 'sandbox_other.go'
      - 'immerse.go'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Fetch sing-box core (official v1.14.4, legacy Windows 7 build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64-legacy-windows-7.zip" -OutFile "singbox.zip"
          $len = (Get-Item "singbox.zip").Length
          Write-Host "singbox.zip bytes: $len"
          if ($len -ne 27010034) { throw "sing-box zip size mismatch: $len" }

      - name: Download Go modules (incl. tailscale/tsnet)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download

      # The Sandboxie installer is embedded into the EXE (v0.39) but
      # never committed to git: fetch the pinned official package,
      # verify size + SHA-256, and stage it at the go:embed path.
      - name: Fetch Sandboxie component (official v1.18.8, pinned, embedded)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sandboxie-plus/Sandboxie/releases/download/v1.18.8/Sandboxie-Plus-x64-v1.18.8.exe" -OutFile "assets/sandboxie-plus-x64-v1.18.8.exe"
          $len = (Get-Item "assets/sandboxie-plus-x64-v1.18.8.exe").Length
          Write-Host "sandboxie installer bytes: $len"
          if ($len -ne 24930680) { throw "Sandboxie installer size mismatch: $len" }
          $hash = (Get-FileHash "assets/sandboxie-plus-x64-v1.18.8.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "sandboxie installer sha256: $hash"
          if ($hash -ne "f27078ff74a07906fd51476079e1a7a8f5e20c8bb75a9d2ae86169d47179ae76") { throw "Sandboxie installer sha256 mismatch: $hash" }

      - name: Build single-file EXE (windows/amd64)
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-H windowsgui -s -w" -o MJ-System.exe .
          (Get-Item "MJ-System.exe").Length

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "MJ-System.exe" -DestinationPath "MJ-System-64bit.zip" -Force
          (Get-Item "MJ-System-64bit.zip").Length
          $hash = (Get-FileHash "MJ-System-64bit.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "MJ-System-64bit.zip").Length
          $manifest = [ordered]@{ version = "0.47"; file = "MJ-System-64bit.zip"; size = $size; sha256 = $hash }
          $json = $manifest | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "update.json"), $json, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "update.json"


      - name: Package Firefox component (ESR 153.5.1 zh-CN, portable)
        shell: pwsh
        run: |
          $ffver = "153.5.1esr"
          $url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/$ffver/win64/zh-CN/Firefox%20Setup%20$ffver.exe"
          Invoke-WebRequest -Uri $url -OutFile "ffsetup.exe"
          $ilen = (Get-Item "ffsetup.exe").Length
          Write-Host "ffsetup.exe bytes: $ilen"
          if ($ilen -lt 50000000) { throw "Firefox installer too small: $ilen" }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip x "ffsetup.exe" "-offx" -y | Out-Null
          if (!(Test-Path "ffx\core\firefox.exe")) { throw "firefox.exe not found after extract" }
          New-Item -ItemType Directory -Force -Path "ffx\core\distribution" | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD "ffx\core\distribution\policies.json"), '{ "policies": { "DisableAppUpdate": true } }', (New-Object System.Text.UTF8Encoding $false))
          Compress-Archive -Path "ffx\core\*" -DestinationPath "MJ-Firefox.zip" -Force
          $fhash = (Get-FileHash "MJ-Firefox.zip" -Algorithm SHA256).Hash.ToLower()
          $fsize = (Get-Item "MJ-Firefox.zip").Length
          $fman = [ordered]@{ version = $ffver; file = "MJ-Firefox.zip"; size = $fsize; sha256 = $fhash }
          $fjson = $fman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "firefox.json"), $fjson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "firefox.json"

      - name: Assemble OpenClaw component (portable Node v24.22.1 + OpenClaw 2026.10.8)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ocVer = "2026.10.8"
          $nodeVer = "24.22.1"
          $stage = Join-Path $PWD "oc-stage"
          $comp = Join-Path $stage "component"
          $runtimeDir = Join-Path $comp "runtime"
          $appDir = Join-Path $comp "app"
          New-Item -ItemType Directory -Force -Path $runtimeDir, $appDir | Out-Null
          # Portable Node: official win-x64 zip from nodejs.org, its
          # contents land directly in component\runtime (node.exe at
          # the runtime root), same layout as the validation runs.
          $nodeZip = Join-Path $stage "node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVer/node-v$nodeVer-win-x64.zip" -OutFile $nodeZip
          Write-Host "node zip bytes: $((Get-Item $nodeZip).Length)"
          Expand-Archive -Path $nodeZip -DestinationPath (Join-Path $stage "node-x") -Force
          Copy-Item -Path (Join-Path $stage "node-x\node-v$nodeVer-win-x64\*") -Destination $runtimeDir -Recurse -Force
          $nodeExe = Join-Path $runtimeDir "node.exe"
          if (!(Test-Path $nodeExe)) { throw "node.exe missing after extract" }
          # Runtime pinning (validation run #1 died right here: install
          # scripts resolved bare `node` to the runner's preinstalled
          # Node 22 and OpenClaw's version check aborted the install).
          # Same triple pinning as openclaw-validate.yml: PATH first,
          # --scripts-prepend-node-path=true, absolute-path calls, and
          # a fail-fast guard before installing anything.
          $env:PATH = "$runtimeDir;$env:PATH"
          $nodeV = (& $nodeExe -v).Trim()
          Write-Host "node -v = $nodeV"
          if ($nodeV -ne "v$nodeVer") { throw "node version mismatch: $nodeV" }
          $resolvedNode = (Get-Command node -ErrorAction Stop).Source
          if (-not ($resolvedNode -like "$runtimeDir*")) { throw "node resolves outside component runtime: $resolvedNode" }
          $npm = Join-Path $runtimeDir "npm.cmd"
          # npm local-prefix install of the pinned OpenClaw into
          # component\app. The npm cache stays in the staging area,
          # never inside the component; the zip ships runtime + app
          # only (state is provisioned by the daemon at first start).
          $env:npm_config_cache = Join-Path $stage "npm-cache"
          $pkg = [ordered]@{ dependencies = [ordered]@{ openclaw = $ocVer } }
          ($pkg | ConvertTo-Json) | Set-Content (Join-Path $appDir "package.json") -Encoding utf8
          Push-Location $appDir
          & $npm install --no-audit --no-fund --loglevel=warn --scripts-prepend-node-path=true --registry "https://registry.npmjs.org/"
          $npmCode = $LASTEXITCODE
          Pop-Location
          if ($npmCode -ne 0) { throw "npm install failed: exit $npmCode" }
          $ocBin = Join-Path $appDir "node_modules\.bin\openclaw.cmd"
          if (!(Test-Path $ocBin)) { throw "openclaw entry shim missing after install: $ocBin" }
          $ocEntry = Join-Path $appDir "node_modules\openclaw\openclaw.mjs"
          if (!(Test-Path $ocEntry)) { throw "openclaw.mjs missing after install: $ocEntry" }
          $ocV = (& $ocBin --version 2>&1 | Out-String).Trim()
          Write-Host "openclaw --version = $ocV"
          if ($ocV -notlike "*$ocVer*") { throw "openclaw version mismatch: $ocV" }
          Compress-Archive -Path (Join-Path $comp "runtime"), (Join-Path $comp "app") -DestinationPath "MJ-OpenClaw.zip" -Force
          $osize = (Get-Item "MJ-OpenClaw.zip").Length
          Write-Host "MJ-OpenClaw.zip bytes: $osize"
          if ($osize -lt 100000000) { throw "OpenClaw component zip implausibly small: $osize" }
          $ohash = (Get-FileHash "MJ-OpenClaw.zip" -Algorithm SHA256).Hash.ToLower()
          $oman = [ordered]@{ version = $ocVer; file = "MJ-OpenClaw.zip"; size = $osize; sha256 = $ohash }
          $ojson = $oman | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD "openclaw.json"), $ojson, (New-Object System.Text.UTF8Encoding $false))
          Get-Content "openclaw.json"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.47
          name: 铭杰终端机 v0.47（64 位单文件版 · 顶栏：控制中心＋通知中心）
          body: |
            64 位单文件版：解压后运行 MJ-System.exe（需 64 位 Windows）。
            第一次运行会自动释放内置 sing-box 核心，数据保存在 EXE 旁的 Data/ 文件夹（节点、网站应用、桌面布局都在里面，跟着文件夹走）。
            应用内更新：v0.6 起在「设置 → 软件更新」里完成，仓库公开、免令牌。
            近版功能：网站应用化（真实图标、双击打开、文件夹分组）、软件内全局加速、台前调度（左侧实时缩略图）、窗口统一（外部应用统一调度与开窗落位）、SSH 远程终端、内置调试控制台（状态与日志集中查看、一键导出诊断包）、小窗手机宽（终端未最大化或较窄时网站应用以手机宽打开）、应用商店（官方便携应用直下进 Data/apps，校验钉死）、小龙虾组件、服务器监控面板。
            本版 v0.47：UI 复刻线第二件——顶栏补齐 macOS 的控制中心与通知中心（按《macOS 使用手册》的控制中心 / 通知中心 / 通知设置三页行为复刻，与终端机自己的功能结合）。① 控制中心：菜单栏右侧新增双开关图标（自绘），点开是一张玻璃面板。最上面是节点大格（核心控制，常驻不可关）：显示已连/未连与当前默认节点名，点主体直接连接/断开，点右边的箭头在面板内展开已保存节点列表（连接时用默认的第一个节点，增删在节点页）。开关格一点即开关、与设置双向同源：沉浸模式、台前调度、桌面全屏、Dock 自动隐藏。远程协助格点箭头展开三态（关 / 只读诊断 / 协助）：关即关总开关，只读/协助会把已配对操作者统一到该档（按人分别设仍在 设置 → 安全与隐私，走的都是既有分级机制）。壁纸格显示当前壁纸名，点主体换下一张预设，展开是预设列表点选（与设置页同源）。一条整行滑杆：Dock 图标大小（44–64，拖动时 Dock 实时变，松手落设置）——只放有真实参数支撑的滑杆，不凑数。面板底部「编辑控制中心」跳到 设置 → 桌面与 Dock 新增的「控制中心」一节，逐格开关显隐。控制中心图标右侧还有手册里的隐私指示点：有远程协助会话正连着时亮橙点，没有就不显示。② 通知中心：点菜单栏的日期时间开/关（点桌面、按 Esc 也关），整列从右侧滑入。上半是通知：状态型的状态在就一直在、不可删，带主操作按钮——隔离安装待登记（按钮去商店登记）、软件更新可用（去设置·软件更新）、服务器告警中（去服务器面板），都由守护进程从各模块自己的现成状态组装，不新建轮询。事件型的是发生过的事，记录在 Data/notifications.json（滚动上限 50 条）：节点连接失败/断开、隔离安装完成、文件导入完成、远程协助会话开始/结束、检测到新版本（只在检出那一瞬间发一条，带横幅；常驻的「更新可用」由状态型负责）。同一来源的多条自动成叠：顶层显示最新一条加计数，点开展开、Show less 收起，悬停出 × 清单条、栈上悬停出「全部清除」清整组；点通知本体按它的路由跳过去处理并清掉该条。和手册一样按来源管通知：设置新增「通知」页，六个来源（应用隔离、软件更新、服务器监控、节点、远程协助、文件）逐个有「允许通知」与「横幅」两开关——关允许则该来源不记录、状态型也不出现；关横幅只关横幅。新事件到达且通知中心关着时，桌面右上角滑入横幅（来源+标题+正文，约 6 秒自动消、悬停暂停、点它跳转并清除、× 直接清）；沉浸模式不拦横幅，它不是专注模式。③ 小部件在通知下方，三个全是真数据：日历（月视图，今日高亮）、服务器（主服务器名+在线状态+CPU/内存迷你条，数据走服务器监控现成接口）、节点（当前节点名+状态）。点小部件跳对应面板（日历没有对应面板，只展示）。底部「编辑小部件」进编辑态：逐个开关显隐、↑↓ 排序，布局存设置跟着文件夹走。天气没有数据源，不做。④ 控制台留痕归 notify 模块：通知的记录与清除都记 info（同来源同事件 10 分钟内去重防刷屏），面板开合不记。本版不含：Dock 第二件（右键菜单/徽章/弹跳）与节点页的节点切换（现有产品里选择器默认恒为第一个节点，切换是节点页专业化的一部分）仍按原排期。上一版 v0.46：UI 复刻线第一件——Dock 基础行为包（先把 macOS 的逻辑讨论清楚，再一件件复刻；本件只做 Dock 的位置、自动隐藏与放大曲线，右键菜单、徽章、启动弹跳是第二件，本版不含）。① Dock 位置成为设置项：设置 → 桌面与 Dock 新增「Dock」一节，位置可在底部（默认）/ 左侧 / 右侧之间切换，即时生效；竖排时 Dock 居中于该边，图标放大朝屏幕内侧长、运行指示点在外侧、名称标签在图标内侧弹出。台前调度开着时把 Dock 放到左侧，会和台前调度条带抢左缘：条带（系统内缩略图与外部应用卡片）临时镜像到右缘，Dock 改回来它也跟着回来——只是位置镜像，行为不变（临时共存规则）。② 自动隐藏 Dock：同页开关，默认关（找得到优先，和沉浸模式一个哲学）。开启后 Dock 沿所在边滑出、只留 3px 触发沿；指针贴到那条边停约 0.3 秒就滑入（快速甩到边沿立即滑入），移开约 0.4 秒滑出；正在拖桌面图标、或把文件从电脑拖进来靠近 Dock 时保持显示。视图本身不可见时不跑任何计时器。③ 放大曲线校准：旧实现是线性衰减，又靠浏览器 transition 在离散档位之间补间，还每帧量取正在变化中的图标位置，指针一动图标在后面追、带抖动。现在按 macOS 模型逐帧连续计算——升余弦衰减：峰值约 1.85 倍正落在指针下方的图标上、影响半径约 ±3 个图标、曲线在峰值和边缘都平滑收尾；每帧先量齐所有图标中心再统一写尺寸，放大时图标彼此推开、Dock 整体变长，底部保持基线对齐、侧边保持贴边对齐。指针离开时图标以 0.18 秒平滑落回。本版的动画时长与几何参数都收成了命名常量，为后续的统一动画规范件预留。上一版 v0.45：沉浸模式——终端机打开的一切只留在终端机里，宿主只出屏幕、键盘和鼠标。设置 → 桌面与 Dock 新增「沉浸模式」开关（默认关，你亲手打开）：开启后，已经登记进台前调度的窗口（隔离浏览器、盒内应用、桌面自己，一视同仁）会从宿主任务栏和 Alt-Tab 里消失，切换入口只剩台前调度与 Dock；回宿主的锚是右下角的托盘图标，点它整套回来。安全线是「找得到优先于藏得好」：窗口只有确认登记进台前调度之后才会被隐藏，没被认领的窗口永远留在宿主任务栏上；巡逻每轮复核，已沉浸的窗口一旦不在册立刻还原并在控制台报警；守护进程退出（设置退出 / 托盘退出 / 空闲退出 / 更新交接四条路）前，会先把全部沉浸窗口的样式还原、标记摘除，一个不漏。每个被沉浸的窗口都留有终端机自己的标记：万一守护进程被强杀或崩溃，个别窗口可能暂时留在隐藏状态——把那个窗口关掉即自愈，下次打开终端机时启动清扫也会把遗留窗口自动还原回任务栏（设置里的说明同样如实写了这一句）。同页新增「桌面全屏」开关：桌面视图以无边框全屏占据它所在的显示器，关掉开关即恢复原来的窗口大小与位置（全屏期间几何记忆暂停采样，不会把全屏本身记成「上次的位置」）。两个开关都即时生效于全部在册窗口，不用重启。上一版 v0.44：隔离安装补上「重装已装应用」的登记通道（v0.43 真机现场：把同一个 Telegram 安装包（td-setup-win-x64-7.3.3）再走一遍隔离安装，v0.43 的机制全部正常——会话豁免、30 秒进度心跳、组合完成判定 37 秒收尾——却只能报「没找到能登记的新程序」：Telegram 其实早在上一次安装时就已经装在盒子里了，只是当时登记错了人；而同版本重装时 Inno 安装器对版本相同的文件默认跳过不重写，这次一个新文件都没写，单靠「安装新增了什么」这条差分线找候选必然落空，装也装了、登记无门）。现在：安装跑完若没有新增候选，不再直接判失败，而是按安装包名到盒子现有的全部程序里找对得上的——产品词元提取与匹配（去掉 setup/install/x64/win 这类噪声词与版本号，剩余词元对候选的程序名、所在文件夹打分，含 td 对 Telegram Desktop 这类「文件夹首字母缩写」的匹配）；通用小工具（7z 系列等）和插件、临时目录里的文件照旧按形态排除，卸载器照旧排除；与安装包名对不上的别家程序亲和度不够，绝不混进来，宁可保持原来的失败结论。命中的候选带「盒内已有」标记进待登记：控制台和商店弹窗都会写明白——本次安装没有新增文件，这个程序应该是已经装在盒子里了，下面是从盒内找到的已有程序，确认主程序即可登记；待登记存盘与守护进程启动恢复走同一条回退（恢复时差分为空也按安装包名再找一次），来源标记一并存盘。从「已有」池登记的流程与新装完全一致（数据封堵名单匹配、数据目录推断照常）。收尾语三态分开：新装完成待登记 / 已在盒内待登记（本次无新增文件）/ 真失败（盒内既无新增、也找不到对得上的已有程序，保留原具名文案）。上一版 v0.43：隔离安装可靠性修复（针对 v0.42 真机装 Telegram 时暴露的现场问题）。① 安装不再无声卡死：以前的完成判定要等盒内进程「全部退出」，而 Telegram 装完会自动把本体拉起来常驻，流程于是干等满 5 分钟、全程没进度也没报错（其实最后是装完了的）。现在改成组合判定：安装器已退出＋盒内文件安静下来一段时间即算装完，常驻的应用本体不再阻塞；等待期间每 30 秒在控制台报一次进度（安装器状态、盒内会话进程数、新增文件数），商店里也实时显示阶段（下载/导入→盒内安装中→扫描登记→完成/失败）和已用时；真卡到总超时（静默安装 15 分钟、交互式 30 分钟）会以具名失败收尾，并给出当时状态摘要（安装器是否退出、盒内剩余进程、新增文件数）。② 安装器的窗口不再被抢：安装会话期间，该会话的盒内窗口完全豁免台前调度的认领、落位与呈现（此前静默安装的 Setup 窗口被巡逻登记、还被落位摆进了桌面）；「终止本次安装」也改为只终止本会话的进程，不再把盒子里其他应用一起关掉。③ 装完后的「选主程序登记」不会再丢：这一步现在会存盘，关掉商店页面、重启终端都在；安装完成时控制台会明确指路（到应用商店 → 隔离安装完成登记）；已有待登记时重复点安装会被挡下，先处理完再装下一个。④ 候选可信度（本版另一个真机事故：Telegram 的 5 个候选里混进了盒内微信补丁器临时解压的 7z.exe，用户把它登记成了「Telegram」，文件随后被微信自己清掉，点开只剩 Sandboxie 的原始报错）：现在通用小工具（7z 系列等）和插件/临时目录里的文件按形态直接排除出候选；候选在生成时、登记弹窗打开期间、点击登记时三处都会复核文件是否还在盒子里，不在的即时划掉或拒绝登记，绝不许登记一个不存在的路径；与安装包看起来无关的候选会在弹窗里打标提醒（预选只是建议，登记仍需你亲手点确认）；盒内应用每次启动前也会复核登记的程序还在不在，失效登记由终端机用自己的话说明并提供一键移除，设置 → 应用隔离的列表里也会直接标出失效登记。⑤ 按用户目录安装的应用（如 Telegram 装在 AppData\Roaming）补齐了候选排序权重，能正常排到前列。⑥ 顺带修了盒内进程名单的解析：Sandboxie 名单第一行是程序「个数」，旧解析把个数也当成 PID 收了进来（真机名单里出现过的 PID「17」就是它），可能把宿主上恰好同号的进程误认成盒内进程（现场有一扇宿主的管理员 PowerShell 因此被误认领）；现在按官方格式严格按行解析，系统类程序（PowerShell、cmd 等）走盒名单认领时还要再过一次实时名单复核，复核不过就不认领并留日志备查。上一版 v0.42：盒内应用数据封堵（v0.41 真机验收发现的新问题：盒内微信能打开了，但它读到了宿主机那份微信的账户数据，摆出的是一键登录而不是全新扫码——沙盒默认只隔离「写」不隔离「读」，盒子里没有的文件，它会读到宿主机上的真实文件）。本版给数据封堵名单内的应用（当前：微信家族，即 Weixin.exe 与 WeChat.exe）把它们的数据目录设为「只认盒内」（Sandboxie 的 WriteFilePath 按程序规则：宿主侧内容隐藏、盒内这一份照常读写）：宿主机那份数据对它们不存在，盒内从一份全新数据开始（微信即全新扫码登录），之后的数据也只长在盒子里、跟着文件夹走。这道封堵同时覆盖注册表：微信决定数据存哪儿，还会读注册表里 HKCU\Software\Tencent\WeChat 与 HKCU\Software\Tencent\Weixin 两处的值（比如宿主机那份改过的自定义存储目录），这两棵键一并设为「只认盒内」（Sandboxie 的 WriteKeyPath 按程序规则），免得盒内微信顺着宿主的值摸到封堵之外的数据目录。一句保留：盒内虚拟注册表是全盒共用的一个文件，封堵之前盒内微信自己写进影子键的旧值本版不做手术清除（离线改这个文件风险过高）——那是盒内应用自己的旧写入，不是宿主机的数据，宿主的值从此也读不到；真要连这点旧值都归零，用设置里的清空盒子即可。已经登记的盒内微信会在下一次启动前被套上封堵，并一次性清掉盒内影子里先前漏入的旧数据副本（只删盒子里面的这一份，宿主机那份全程只读不碰）；新隔离安装这类应用时，登记弹窗会提前说明它将使用全新数据。名单外的应用写入始终隔离，但读取仍可能看到宿主机上的同名文件，设置 → 应用隔离的「先说清楚」里已写明。顺带：盒子配置里按官方 BorderColor 键关掉了 Sandboxie 给盒内窗口画的黄色边框，窗口归属看台前调度即可。上一版 v0.41：盒内应用窗口呈现修复（v0.40 的真机分型日志实锤：微信进程活着、主窗口其实已经生成，只是处于隐藏状态，而认领只认可见窗口，于是全部落选，也没有任何一步去把它显示出来；同时盒子里积压了前两次失败启动留下的同名残留进程，单实例应用会把之后的启动都委托给这个隐藏的残留并继续保持隐藏）。本版：① 认领放宽——盒内应用的隐藏主窗口（有标题、非系统类的应用窗口）也能被认领，用户从桌面点击启动时守护进程会主动把它显示出来再呈现，显示前后的可见状态记入控制台；平时巡逻发现同样的隐藏窗口只登记、不抢着显示，呈现留给用户的点击。② 启动前清同名残留——盒内已有与该应用同名、且名下没有可见应用窗口的进程，判为残留，启动前逐个终止（只清同名进程，绝不动盒内其他应用）再全新拉起；若同名进程正显示着窗口，则不杀，直接呈现它已有的窗口。③ 万一仍失败，分型新增「有隐藏应用窗口但呈现失败」一类，与「进程在但无窗口」分开记录，日志一眼可辨。上一版 v0.40：热修盒内应用窗口认领（v0.39 真机首验发现：微信盒内装好、启动后窗口没能进台前调度）。根因是盒内进程由 Sandboxie 服务创建、不在守护进程的进程树里，镜像路径又是盒内虚拟路径，原有的进程树/文件夹两条身份线都认不出它。本版把 Sandboxie 自己的盒内进程名单（Start.exe /listpids）变成一等身份来源：启动时先快照盒内 PID 集、启动后差分出新 PID 直供台前调度登记；应用已在盒内运行时再点图标（差分为空）走二次启动路径，直接呈现它已有的窗口，不再误报失败；巡逻每轮刷新一次盒名单作为归属信号兜底认领；万一仍超时，控制台日志会分型说明——进程没起来 / 进程起来又退出 / 进程活着但没窗口 / 窗口在其他盒内进程名下——并附超时时刻的盒内 PID 名单与窗口交叉核对结果，下次诊断不用猜。v0.39 的应用隔离其余内容不变：应用隔离——只有安装版的软件（比如微信）也能住进终端机了。① 隔离组件：设置 → 应用隔离里一键安装 Sandboxie Plus（版本与校验钉死，安装包已内置在本程序里，没网的新电脑也能装；全程自动，只需在系统的管理员确认窗口点一次「是」）。它把软件的安装与运行关进一个盒子：程序文件、注册表、数据全落在 EXE 旁的 Data/sandbox，跟着文件夹走——换电脑把组件装一次，盒子里的软件和登录原样接着用；删掉盒子就是真卸载。先说清楚：驱动会常驻在这台电脑上直到你卸载组件，这个功能适合你自己的电脑；盒内应用默认直连网络（应用自己认代理的可指向 127.0.0.1:2080 走节点，强制全流量走节点是 Sandboxie 的付费功能，本产品不提供）。② 隔离安装：应用商店新增路线——给个安装包地址或导入本地安装包，认得出类型的自动静默装进盒子，认不出的在盒内打开安装界面让你点完；装完确认主程序，图标直接上桌面，双击打开，窗口照样进台前调度。③ 本版 EXE 约 78 MB（隔离组件包内置所致），仍是单文件，发布与更新方式不变。
            MJ-Firefox.zip / firefox.json 是 Firefox 组件的安装包与校验清单，MJ-OpenClaw.zip / openclaw.json 是小龙虾组件的安装包与校验清单，都由程序按需下载，手动使用主程序时不用管。
            update.json 是给程序自动更新用的校验清单（版本/大小/SHA-256），手动下载时不用管它。
