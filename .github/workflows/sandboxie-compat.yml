name: sandboxie-compat

# Manual compatibility matrix (NOT part of the product build):
# for each app leg on a FRESH windows-latest runner: install the pinned
# Sandboxie Plus, create a fresh MJBox pinned into a staging Data folder,
# install one mainstream app with the SAME judgement the product uses
# (installer-type sniffing: NSIS /S, Inno /VERYSILENT..., MSI refused as
# its own class, unknown types recorded as interactive-unsupported and
# NOT force-installed), then three assertions:
#   A1 installer finished AND program files exist inside the box
#   A2 the main exe is findable by the (approximated) product candidate
#      logic: post-install diff + affinity ranking, junk shapes excluded
#   A3 the main exe launches inside the box and stays alive >= 20 s
# Legs whose product judgement is a refusal (MSI / interactive) ALSO run
# a clearly separated EXPLORATORY pass with the family-conventional
# silent args, so the scoreboard shows what supporting that family
# would buy. Exploratory results never count toward the verdict.
# A final report job collects every leg's result.json and pushes a
# scoreboard file to the compat-results branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compat:
    name: compat (${{ matrix.app }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: wechat
            family: nsis-baseline
            url: https://dldir1v6.qq.com/weixin/Universal/Windows/WeChatWin_4.2.0.exe
            file: WeChatWin_4.2.0.exe
            bytes: 259938920
            sha256: fc948730e854ae0e03e64ac57ffde0f61b530d7a571d16df411914bad30a1526
            expected: Weixin.exe,WeChat.exe
            tokens: weixin,wechat
            hintdir: Tencent
            uninstregex: '微信|WeChat|Weixin'
            exploreargs: ''
          - app: notepadpp
            family: nsis
            url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.8.1/npp.8.9.8.1.Installer.x64.exe
            file: npp.8.9.8.1.Installer.x64.exe
            bytes: 6963432
            sha256: 26f3bcced788fadbac4e7e577b430ea2ce6060cf3bcad993ef4612ecd7d743da
            expected: notepad++.exe
            tokens: notepad++
            hintdir: Notepad++
            uninstregex: 'Notepad\+\+'
            exploreargs: ''
          - app: telegram
            family: inno
            url: https://github.com/telegramdesktop/tdesktop/releases/download/v7.3.3/td-setup-win-x64-7.3.3.exe
            file: td-setup-win-x64-7.3.3.exe
            bytes: 63102944
            sha256: 865cd80080ef1948bd818000c05fe81cabbbd0688a91c2cf8978f9cc73fd5a06
            expected: Telegram.exe
            tokens: telegram
            hintdir: Telegram Desktop
            uninstregex: 'Telegram'
            exploreargs: ''
          - app: discord
            family: squirrel
            url: 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'
            file: DiscordSetup.exe
            bytes: 0
            sha256: ''
            expected: Discord.exe
            tokens: discord
            hintdir: Discord
            uninstregex: 'Discord'
            exploreargs: '--silent'
          - app: vscode
            family: per-user
            url: 'https://update.code.visualstudio.com/latest/win32-x64-user/stable'
            file: VSCodeUserSetup.exe
            bytes: 0
            sha256: ''
            expected: Code.exe
            tokens: code,vscode
            hintdir: Microsoft VS Code
            uninstregex: 'Visual Studio Code'
            exploreargs: ''
          - app: chrome-msi
            family: msi
            url: https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi
            file: GoogleChromeStandaloneEnterprise64.msi
            bytes: 0
            sha256: ''
            expected: chrome.exe
            tokens: chrome
            hintdir: Google
            uninstregex: 'Google Chrome'
            exploreargs: ''
          - app: dingtalk
            family: custom-cn
            url: https://dtapp-cast.dingtalk.com/202908242023/4090273bee39319286ee77436ca0b845/dingtalk-desktop/win_installer/Release/DingTalk_v8.2.0.260119001.exe
            file: DingTalk_v8.2.0.260119001.exe
            bytes: 460186048
            sha256: ''
            expected: DingTalk.exe
            tokens: dingtalk
            hintdir: DingTalk
            uninstregex: '钉钉|DingTalk'
            exploreargs: '/S'
          - app: vlc
            family: other
            url: https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.exe
            file: vlc-3.0.21-win64.exe
            bytes: 44943296
            sha256: 9742689a50e96ddc04d80ceff046b28da2beefd617be18166f8c5e715ec60c59
            expected: vlc.exe
            tokens: vlc
            hintdir: VideoLAN
            uninstregex: 'VLC'
            exploreargs: ''
    steps:
      - name: Write compat script
        shell: pwsh
        run: |
          $script = @'
          param(
            [Parameter(Mandatory=$true)][string]$AppLabel,
            [Parameter(Mandatory=$true)][string]$FamilySlot,
            [Parameter(Mandatory=$true)][string]$InstallerUrl,
            [Parameter(Mandatory=$true)][string]$InstallerFile,
            [Parameter(Mandatory=$true)][long]$PinBytes,
            [Parameter(Mandatory=$true)][AllowEmptyString()][string]$PinSha256,
            [Parameter(Mandatory=$true)][string]$ExpectedCsv,
            [Parameter(Mandatory=$true)][string]$TokensCsv,
            [Parameter(Mandatory=$true)][string]$HostHintDir,
            [Parameter(Mandatory=$true)][string]$UninstallRegex,
            [Parameter(Mandatory=$true)][AllowEmptyString()][string]$ExploreArgs
          )
          $ErrorActionPreference = 'Continue'
          $Expected = $ExpectedCsv -split ','
          $Tokens = $TokensCsv -split ','
          $ResDir = Join-Path $env:GITHUB_WORKSPACE ("results\" + $AppLabel)
          New-Item -ItemType Directory -Force -Path $ResDir | Out-Null
          $DlDir = Join-Path $env:GITHUB_WORKSPACE 'dl'
          New-Item -ItemType Directory -Force -Path $DlDir | Out-Null
          $LogFile = Join-Path $ResDir 'log.txt'
          function Log([string]$Msg) {
            $line = "[{0}] {1}" -f (Get-Date -Format 'HH:mm:ss'), $Msg
            Write-Host $line
            Add-Content -Path $LogFile -Value $line -Encoding UTF8
          }
          function Save([string]$Name, [object]$Content) {
            $Content | Out-String -Width 400 | Set-Content (Join-Path $ResDir $Name) -Encoding UTF8
          }
          $R = [ordered]@{
            app = $AppLabel; familySlot = $FamilySlot
            installerUrl = $InstallerUrl; installerFile = $InstallerFile
            measuredBytes = 0; measuredSha256 = ''; pinNote = ''
            detectedType = ''; productClass = ''
            A1 = ''; A1symptom = ''; A2 = ''; A2symptom = ''; A3 = ''; A3symptom = ''
            verdict = ''; failClass = ''
            candidateTop = ''; candidateList = ''
            hostDirsClean = ''; hostUninstallClean = ''
            installExitCode = ''; installElapsedSec = ''
            exploratory = $null
          }
          # ---- pinned Sandboxie constants (same as sandboxie-validate) ----
          $SbieFile = 'Sandboxie-Plus-x64-v1.18.8.exe'
          $SbieUrl  = 'https://github.com/sandboxie-plus/Sandboxie/releases/download/v1.18.8/Sandboxie-Plus-x64-v1.18.8.exe'
          $SbieBytes = 24930680
          $SbieSha  = 'f27078ff74a07906fd51476079e1a7a8f5e20c8bb75a9d2ae86169d47179ae76'
          $BoxName  = 'MJBox'
          $IniPath  = 'C:\Windows\Sandboxie.ini'
          function Find-StartExe {
            $cands = @("$env:ProgramFiles\Sandboxie-Plus\Start.exe", "${env:ProgramFiles(x86)}\Sandboxie-Plus\Start.exe")
            foreach ($c in $cands) { if ($c -and (Test-Path $c)) { return $c } }
            return $null
          }
          function Get-FileMeasured([string]$Url, [string]$Dest) {
            if (-not (Test-Path $Dest)) {
              Log "downloading $Url"
              Invoke-WebRequest -Uri $Url -OutFile $Dest -UseBasicParsing
            }
            $f = Get-Item $Dest
            $h = (Get-FileHash $Dest -Algorithm SHA256).Hash.ToLower()
            Log "file $Dest bytes=$($f.Length) sha256=$h"
            return @($f.Length, $h)
          }
          function Get-UninstallMatches {
            $roots = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                       'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                       'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*')
            $items = foreach ($r in $roots) { Get-ItemProperty $r -ErrorAction SilentlyContinue }
            $items | Where-Object { $_.DisplayName -and ($_.DisplayName -match $UninstallRegex) } |
              ForEach-Object { "$($_.DisplayName) [$($_.DisplayVersion)]" } | Sort-Object -Unique
          }
          function Get-HostHintState {
            $state = @()
            foreach ($pf in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if (-not $pf) { continue }
              $p = Join-Path $pf $HostHintDir
              $state += "$p exists=$(Test-Path $p)"
            }
            return $state
          }
          function Get-BoxPids([string]$StartExe) {
            # Sandboxie /listpids output: FIRST line is the process COUNT,
            # each following line is one pid (strict parse, same fix as
            # product v0.43).
            try {
              $lines = & $StartExe "/box:$BoxName" /listpids 2>$null
              # Evidence side channel (harness only): raw, unparsed text
              # of the most recent call, for the launch check to record.
              # The parsed return value below is unchanged.
              $script:LastBoxPidsRaw = (@($lines) | ForEach-Object { "$_".Trim() }) -join ','
              $nums = @()
              foreach ($ln in $lines) {
                $t = "$ln".Trim()
                if ($t -match '^\d+$') { $nums += [int]$t }
              }
              if ($nums.Count -gt 1 -and $nums[0] -eq ($nums.Count - 1)) { $nums = $nums[1..($nums.Count - 1)] }
              elseif ($nums.Count -gt 1 -and $nums[0] -le $nums.Count) { $nums = $nums[1..($nums.Count - 1)] }
              return @($nums | Where-Object { $_ -ge 8 } | Sort-Object -Unique)
            } catch { $script:LastBoxPidsRaw = '<listpids call failed>'; return @() }
          }
          function Stop-Box([string]$StartExe) {
            try { & $StartExe "/box:$BoxName" /terminate 2>$null | Out-Null } catch {}
            Start-Sleep -Seconds 3
            foreach ($p in (Get-BoxPids $StartExe)) {
              try { Stop-Process -Id $p -Force -ErrorAction SilentlyContinue } catch {}
            }
            Start-Sleep -Seconds 2
          }
          function Set-BoxIni([string]$BoxRoot) {
            $text = ''
            if (Test-Path $IniPath) { $text = Get-Content $IniPath -Raw }
            $text = [regex]::Replace($text, '(?ms)^\[' + $BoxName + '\].*?(?=^\[|\z)', '')
            $section = "`r`n[$BoxName]`r`nEnabled=y`r`nFileRootPath=$BoxRoot`r`nAutoRecover=n`r`n"
            [IO.File]::WriteAllText($IniPath, ($text.TrimEnd() + $section), [Text.Encoding]::Unicode)
            Log "Sandboxie.ini [$BoxName] FileRootPath=$BoxRoot"
          }
          function Reload-Sbie([string]$StartExe) {
            for ($i = 0; $i -lt 3; $i++) {
              try { & $StartExe /reload 2>$null | Out-Null } catch {}
              Start-Sleep -Seconds 3
              $svc = Get-Service SbieSvc -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running') { return $true }
            }
            return $false
          }
          function To-VirtualPath([string]$BoxRoot, [string]$Physical) {
            $idx = $Physical.IndexOf('\drive\', [StringComparison]::OrdinalIgnoreCase)
            if ($idx -ge 0) {
              $rest = $Physical.Substring($idx + 7)
              if ($rest.Length -ge 3) { return $rest.Substring(0, 1) + ':' + $rest.Substring(1) }
            }
            # Per-user tree: under a FileRootPath box layout, Sandboxie
            # stores redirected per-user files (AppData and friends) in
            # <BoxRoot>\user\<username>\..., which mirrors the virtual
            # C:\Users\<username>\... The \drive\ mapping never matches
            # those paths; without this second mapping, per-user
            # installs (Telegram, VS Code) are invisible to the
            # candidate scan and the launch assertion.
            if ($Physical.StartsWith($BoxRoot, [StringComparison]::OrdinalIgnoreCase)) {
              $rel = $Physical.Substring($BoxRoot.Length).TrimStart('\')
              if ($rel -match '^user\\([^\\]+)\\(.+)$') {
                return 'C:\Users\' + $Matches[1] + '\' + $Matches[2]
              }
            }
            return $null
          }
          function Get-BoxSignature([string]$BoxRoot) {
            $files = Get-ChildItem $BoxRoot -Recurse -File -ErrorAction SilentlyContinue
            $sum = ($files | Measure-Object Length -Sum).Sum
            return "$($files.Count):$sum"
          }
          function Detect-InstallerType([string]$Path) {
            # Approximation of the product's file-feature sniffing.
            if ($Path -match '\.msi$') { return 'msi' }
            $fs = [IO.File]::OpenRead($Path)
            try {
              $head = New-Object byte[] 8
              [void]$fs.Read($head, 0, 8)
              if ($head[0] -eq 0xD0 -and $head[1] -eq 0xCF -and $head[2] -eq 0x11 -and $head[3] -eq 0xE0) { return 'msi' }
            } finally { $fs.Close() }
            $markers = @{
              'Inno Setup' = 'inno'; 'Nullsoft' = 'nsis'; 'Squirrel' = 'squirrel'
            }
            $chunkSize = 4MB
            $buf = New-Object byte[] $chunkSize
            $fs = [IO.File]::OpenRead($Path)
            try {
              $carry = ''
              while ($true) {
                $n = $fs.Read($buf, 0, $chunkSize)
                if ($n -le 0) { break }
                $text = $carry + [Text.Encoding]::ASCII.GetString($buf, 0, $n)
                foreach ($k in $markers.Keys) {
                  if ($text.Contains($k)) { return $markers[$k] }
                }
                if ($text.Length -gt 64) { $carry = $text.Substring($text.Length - 64) } else { $carry = $text }
              }
            } finally { $fs.Close() }
            return 'unknown'
          }
          function Find-Candidates([string]$BoxRoot) {
            # Approximation of product candidate logic (v0.43/v0.44):
            # all exes in the box shadow, uninstallers + junk shapes out,
            # affinity/placement scoring, top of list is the candidate.
            $junkSegs = @('extracted', 'xplugin', 'plugins', 'plugin', 'temp', 'tmp')
            $junkNames = @('7z.exe', '7za.exe', '7zr.exe', '7zfm.exe', 'unrar.exe', 'unzip.exe')
            $out = @()
            $exes = Get-ChildItem $BoxRoot -Recurse -Filter '*.exe' -File -ErrorAction SilentlyContinue
            foreach ($f in $exes) {
              $name = $f.Name
              $lower = $name.ToLower()
              if ($lower -like 'unins*' -or $lower -like '*uninstall*') { continue }
              if ($junkNames -contains $lower) { continue }
              $virt = To-VirtualPath $BoxRoot $f.FullName
              if (-not $virt) { continue }
              $segs = $virt -split '\\'
              $bad = $false
              foreach ($s in $segs) { if ($junkSegs -contains $s.ToLower()) { $bad = $true; break } }
              if ($bad) { continue }
              $score = 0
              if ($virt -match '\\AppData\\Roaming\\') { $score += 90 }
              elseif ($virt -match '\\AppData\\Local\\') { $score += 60 }
              elseif ($virt -match '\\Program Files') { $score += 30 }
              $parent = Split-Path $virt -Parent
              $parentName = Split-Path $parent -Leaf
              $stem = [IO.Path]::GetFileNameWithoutExtension($name).ToLower()
              foreach ($t in $Tokens) {
                $tt = $t.ToLower()
                if ($stem -eq $tt) { $score += 50 }
                if ($parentName.ToLower().Contains($tt)) { $score += 40 }
              }
              $score += [math]::Min(20, [math]::Floor($f.Length / 10MB))
              $out += [pscustomobject]@{ Name = $name; Virtual = $virt; Physical = $f.FullName; Bytes = $f.Length; Score = $score }
            }
            return @($out | Sort-Object Score -Descending)
          }
          function Wait-BoxInstall([string]$StartExe, [string]$BoxRoot, [Diagnostics.Process]$Starter, [int]$CapMinutes) {
            # Composite completion, product v0.43 style: starter exited AND
            # box file tree quiet >= 8 s; resident processes never block.
            $deadline = (Get-Date).AddMinutes($CapMinutes)
            $lastSig = Get-BoxSignature $BoxRoot
            $stableSince = Get-Date
            $installerGone = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 5
              if ($Starter.HasExited) { $installerGone = $true }
              $pids = Get-BoxPids $StartExe
              if ($installerGone -and $pids.Count -eq 0) {
                # nothing running: one more signature check then done
                $sig = Get-BoxSignature $BoxRoot
                if ($sig -eq $lastSig) { return @{ done = $true; timedOut = $false; pids = $pids } }
                $lastSig = $sig; $stableSince = Get-Date; continue
              }
              $sig = Get-BoxSignature $BoxRoot
              if ($sig -ne $lastSig) { $lastSig = $sig; $stableSince = Get-Date }
              $quiet = ((Get-Date) - $stableSince).TotalSeconds
              if ($installerGone -and $quiet -ge 8) { return @{ done = $true; timedOut = $false; pids = $pids } }
              Log "install watch: starterExited=$installerGone boxPids=$($pids.Count) quietSec=$([int]$quiet) sig=$sig"
            }
            return @{ done = $false; timedOut = $true; pids = (Get-BoxPids $StartExe) }
          }
          function Test-LaunchAlive([string]$StartExe, [string]$VirtualPath, [string]$ExeName) {
            & $StartExe "/box:$BoxName" "$VirtualPath" | Out-Null
            $stem = [IO.Path]::GetFileNameWithoutExtension($ExeName)
            $pidFound = 0
            for ($i = 0; $i -lt 18; $i++) {
              Start-Sleep -Seconds 5
              $bp = Get-BoxPids $StartExe
              foreach ($p in $bp) {
                $proc = Get-Process -Id $p -ErrorAction SilentlyContinue
                if ($proc -and $proc.ProcessName -eq $stem) { $pidFound = $p; break }
              }
              if ($pidFound) { break }
              $any = Get-Process -Name $stem -ErrorAction SilentlyContinue
              if ($any) { $pidFound = $any[0].Id; break }
            }
            if (-not $pidFound) { return @{ ok = $false; symptom = 'no process appeared within 90s' } }
            Start-Sleep -Seconds 20
            $alive = Get-Process -Id $pidFound -ErrorAction SilentlyContinue
            $finalPids = Get-BoxPids $StartExe
            $inBox = $finalPids -contains $pidFound
            # Evidence only -- the judgement above still rests solely on
            # the parsed list. Record the raw /listpids text and the
            # parsed list so a "pid alive but not in box list" result
            # can be told apart from a list-read problem.
            Log "A3 evidence ($ExeName): listpidsRaw=[$script:LastBoxPidsRaw]"
            Log "A3 evidence ($ExeName): listpidsParsed=[$($finalPids -join ',')]"
            return @{ ok = ([bool]$alive -and $inBox); symptom = "pid=$pidFound aliveAfter20s=$([bool]$alive) pidInBoxList=$inBox listRaw=[$script:LastBoxPidsRaw] listParsed=[$($finalPids -join ',')]" }
          }
          function Finish([int]$Code) {
            ($R | ConvertTo-Json -Depth 5) | Set-Content (Join-Path $ResDir 'result.json') -Encoding UTF8
            Save 'result-summary.txt' @(
              "app=$($R.app) familySlot=$($R.familySlot) detectedType=$($R.detectedType) productClass=$($R.productClass)"
              "A1=$($R.A1) :: $($R.A1symptom)"
              "A2=$($R.A2) :: $($R.A2symptom)"
              "A3=$($R.A3) :: $($R.A3symptom)"
              "verdict=$($R.verdict) failClass=$($R.failClass)"
            )
            Log "VERDICT $($R.app): $($R.verdict) class=$($R.failClass)"
            exit $Code
          }
          # ================= download + measure =================
          Log "=== compat leg for $AppLabel (slot $FamilySlot) ==="
          $installer = Join-Path $DlDir $InstallerFile
          try {
            $m = Get-FileMeasured $InstallerUrl $installer
            $R.measuredBytes = $m[0]; $R.measuredSha256 = $m[1]
          } catch {
            $R.A1 = 'FAIL'; $R.A1symptom = "download failed: $($_.Exception.Message)"
            $R.verdict = 'FAIL'; $R.failClass = 'download-failed'
            Finish 1
          }
          if ($PinBytes -gt 0 -and $R.measuredBytes -ne $PinBytes) { $R.pinNote = "PIN DRIFT: pinned bytes=$PinBytes measured=$($R.measuredBytes)" }
          if ($PinSha256 -and $R.measuredSha256 -ne $PinSha256) { $R.pinNote += " PIN DRIFT: pinned sha256=$PinSha256 measured=$($R.measuredSha256)" }
          if ($R.pinNote) { Log $R.pinNote }
          $R.detectedType = Detect-InstallerType $installer
          Log "detected installer type: $($R.detectedType)"
          # ================= Sandboxie =================
          $StartExe = Find-StartExe
          if (-not $StartExe) {
            try {
              $sbiePath = Join-Path $DlDir $SbieFile
              $sm = Get-FileMeasured $SbieUrl $sbiePath
              if ($sm[0] -ne $SbieBytes -or $sm[1] -ne $SbieSha) { throw "Sandboxie pin mismatch" }
              $ip = Start-Process $sbiePath -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -PassThru -Wait
              Log "sandboxie installer exit=$($ip.ExitCode)"
              for ($i = 0; $i -lt 36; $i++) {
                Start-Sleep -Seconds 5
                $StartExe = Find-StartExe
                $svc = Get-Service SbieSvc -ErrorAction SilentlyContinue
                if ($StartExe -and $svc -and $svc.Status -eq 'Running') { break }
              }
            } catch { Log "sandboxie install error: $($_.Exception.Message)" }
          }
          if (-not $StartExe) {
            $R.A1 = 'FAIL'; $R.A1symptom = 'harness: Sandboxie Start.exe not available'
            $R.verdict = 'FAIL'; $R.failClass = 'harness-sandboxie'
            Finish 1
          }
          $StageRoot = Join-Path $env:GITHUB_WORKSPACE ("stage-mj-" + $AppLabel)
          if (Test-Path $StageRoot) { Remove-Item $StageRoot -Recurse -Force }
          $BoxRoot = Join-Path $StageRoot 'Data\sandbox\MJBox'
          New-Item -ItemType Directory -Force -Path $BoxRoot | Out-Null
          Set-BoxIni $BoxRoot
          [void](Reload-Sbie $StartExe)
          # box smoke: marker must land in the box, never on host C:
          $smokeHost = 'C:\mj-smoke.txt'
          if (Test-Path $smokeHost) { Remove-Item $smokeHost -Force }
          & $StartExe "/box:$BoxName" /wait "$env:SystemRoot\System32\cmd.exe" /c "echo MJBOXSMOKE > C:\mj-smoke.txt" | Out-Null
          Start-Sleep -Seconds 2
          $smokeInBox = Get-ChildItem $StageRoot -Recurse -Filter 'mj-smoke.txt' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $smokeInBox -or (Test-Path $smokeHost)) {
            $R.A1 = 'FAIL'; $R.A1symptom = "harness: box smoke failed (inBox=$($smokeInBox.FullName) hostC=$(Test-Path $smokeHost))"
            $R.verdict = 'FAIL'; $R.failClass = 'harness-box'
            Finish 1
          }
          Stop-Box $StartExe
          $baseDirs = Get-HostHintState
          $baseUninst = @(Get-UninstallMatches)
          # ================= product judgement =================
          $type = $R.detectedType
          $silentArgs = $null
          if ($type -eq 'nsis') { $silentArgs = '/S'; $R.productClass = 'nsis-silent' }
          elseif ($type -eq 'inno') { $silentArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-'; $R.productClass = 'inno-silent' }
          elseif ($type -eq 'msi') { $R.productClass = 'msi-refused' }
          else { $R.productClass = 'interactive-unsupported' }
          Log "product class: $($R.productClass)"
          function Invoke-BoxInstall([string]$ArgString, [string]$Target) {
            Log "in-box install: $Target $ArgString"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            if ($ArgString) {
              $proc = Start-Process $StartExe -ArgumentList @("/box:$BoxName", '/wait', "`"$Target`"", $ArgString) -PassThru
            } else {
              $proc = Start-Process $StartExe -ArgumentList @("/box:$BoxName", '/wait', "`"$Target`"") -PassThru
            }
            $w = Wait-BoxInstall $StartExe $BoxRoot $proc 15
            $sw.Stop()
            $ec = ''
            try { if ($proc.HasExited) { $ec = $proc.ExitCode } } catch {}
            return @{ watch = $w; exitCode = "$ec"; elapsed = [math]::Round($sw.Elapsed.TotalSeconds, 1) }
          }
          function Run-Assertions([string]$Prefix) {
            $res = @{}
            $exes = Get-ChildItem $BoxRoot -Recurse -Filter '*.exe' -File -ErrorAction SilentlyContinue
            $res.A1 = ($exes.Count -gt 0)
            $res.A1symptom = "exesInBox=$($exes.Count)"
            $cands = Find-Candidates $BoxRoot
            $res.candidates = $cands
            if ($cands.Count -gt 0) {
              $top = $cands[0]
              $res.A2 = ($Expected -contains $top.Name)
              $res.A2symptom = "top=$($top.Virtual) score=$($top.Score) expectedOneOf=$ExpectedCsv"
            } else {
              $res.A2 = $false; $res.A2symptom = 'no candidate survived filtering'
            }
            $mainPhys = $null
            foreach ($e in $Expected) {
              $hit = Get-ChildItem $BoxRoot -Recurse -Filter $e -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { $mainPhys = $hit; break }
            }
            if ($mainPhys) {
              $mv = To-VirtualPath $BoxRoot $mainPhys.FullName
              $lt = Test-LaunchAlive $StartExe $mv $mainPhys.Name
              $res.A3 = $lt.ok; $res.A3symptom = $lt.symptom
              Stop-Box $StartExe
            } else {
              $res.A3 = $false; $res.A3symptom = "none of [$ExpectedCsv] present in box to launch"
            }
            return $res
          }
          if ($silentArgs) {
            $inst = Invoke-BoxInstall $silentArgs $installer
            $R.installExitCode = $inst.exitCode; $R.installElapsedSec = $inst.elapsed
            if (-not $inst.watch.done) {
              $R.A1 = 'FAIL'; $R.A1symptom = "install watch timed out after 15 min; leftover box pids: $($inst.watch.pids -join ',')"
            }
            $a = Run-Assertions 'A'
            if ($inst.watch.done) {
              # watch completed normally: A1 is the assertion result
              $R.A1 = $(if ($a.A1) { 'PASS' } else { 'FAIL' }); $R.A1symptom = $a.A1symptom + "; installerExit=$($inst.exitCode) elapsedSec=$($inst.elapsed)"
            } else {
              # keep watch verdict; still record what assertions saw
              if ($a.A1) { $R.A1symptom += '; files did land in box despite timeout' }
            }
            $R.A2 = $(if ($a.A2) { 'PASS' } else { 'FAIL' }); $R.A2symptom = $a.A2symptom
            $R.A3 = $(if ($a.A3) { 'PASS' } else { 'FAIL' }); $R.A3symptom = $a.A3symptom
            $R.candidateTop = $(if ($a.candidates.Count) { $a.candidates[0].Virtual } else { '' })
            $R.candidateList = ($a.candidates | Select-Object -First 8 | ForEach-Object { "$($_.Score) $($_.Virtual)" }) -join "`n"
          } else {
            # refused by product judgement: assertions fail at A1 with the class as symptom
            $R.A1 = 'FAIL'; $R.A1symptom = "product refuses this class today: $($R.productClass) (detectedType=$type)"
            $R.A2 = 'FAIL'; $R.A2symptom = 'not reached (install refused)'
            $R.A3 = 'FAIL'; $R.A3symptom = 'not reached (install refused)'
          }
          # containment snapshot (informational, mirrors validate metrics)
          $nowDirs = Get-HostHintState
          $nowUninst = @(Get-UninstallMatches)
          $newUninst = @($nowUninst | Where-Object { $baseUninst -notcontains $_ })
          $dirLeak = $false
          for ($i = 0; $i -lt $baseDirs.Count; $i++) {
            if ($baseDirs[$i] -match 'exists=False' -and $nowDirs[$i] -match 'exists=True') { $dirLeak = $true }
          }
          $R.hostDirsClean = $(if ($dirLeak) { 'FAIL' } else { 'PASS' })
          $R.hostUninstallClean = $(if ($newUninst.Count -eq 0) { 'PASS' } else { "FAIL new: $($newUninst -join '; ')" })
          Get-ChildItem $BoxRoot -Recurse -ErrorAction SilentlyContinue | Select-Object -First 300 | ForEach-Object { $_.FullName } | Set-Content (Join-Path $ResDir 'box-listing.txt') -Encoding UTF8
          # ================= exploratory pass (refused classes only) =================
          if (-not $silentArgs) {
            $exp = [ordered]@{ attempted = $false; method = ''; E1 = ''; E1symptom = ''; E2 = ''; E2symptom = ''; E3 = ''; E3symptom = ''; hostUninstallAfter = '' }
            $doExplore = $false; $expArgs = ''; $expTarget = $installer
            if ($type -eq 'msi') { $doExplore = $true; $exp.method = 'msiexec /i <pkg> /qn ALLUSERS=2 MSIINSTALLPERUSER=1 (inside box)' }
            elseif ($ExploreArgs) { $doExplore = $true; $exp.method = "family-conventional silent args: $ExploreArgs"; $expArgs = $ExploreArgs }
            if ($doExplore) {
              $exp.attempted = $true
              Stop-Box $StartExe
              Get-ChildItem $BoxRoot -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              if ($type -eq 'msi') {
                $msiVirt = $installer  # Start.exe passes host path; msiexec runs boxed-UI but service is host-side (that is the point of the probe)
                Log "exploratory MSI install via msiexec (boxed caller): $msiVirt"
                $sw = [Diagnostics.Stopwatch]::StartNew()
                $proc = Start-Process $StartExe -ArgumentList @("/box:$BoxName", '/wait', 'msiexec.exe', '/i', "`"$msiVirt`"", '/qn', 'ALLUSERS=2', 'MSIINSTALLPERUSER=1') -PassThru
                $w = Wait-BoxInstall $StartExe $BoxRoot $proc 15
                $sw.Stop()
                Log "exploratory watch done=$($w.done) elapsed=$([math]::Round($sw.Elapsed.TotalSeconds,1))"
              } else {
                [void](Invoke-BoxInstall $expArgs $expTarget)
              }
              $ea = Run-Assertions 'E'
              $exp.E1 = $(if ($ea.A1) { 'PASS' } else { 'FAIL' }); $exp.E1symptom = $ea.A1symptom
              $exp.E2 = $(if ($ea.A2) { 'PASS' } else { 'FAIL' }); $exp.E2symptom = $ea.A2symptom
              $exp.E3 = $(if ($ea.A3) { 'PASS' } else { 'FAIL' }); $exp.E3symptom = $ea.A3symptom
              $afterUninst = @(Get-UninstallMatches)
              $expNew = @($afterUninst | Where-Object { $baseUninst -notcontains $_ })
              $exp.hostUninstallAfter = $(if ($expNew.Count -eq 0) { 'clean' } else { "NEW host entries: $($expNew -join '; ')" })
              Get-ChildItem $BoxRoot -Recurse -ErrorAction SilentlyContinue | Select-Object -First 300 | ForEach-Object { $_.FullName } | Set-Content (Join-Path $ResDir 'box-listing-exploratory.txt') -Encoding UTF8
            }
            $R.exploratory = $exp
          }
          # ================= verdict =================
          if ($R.A1 -eq 'PASS' -and $R.A2 -eq 'PASS' -and $R.A3 -eq 'PASS') {
            $R.verdict = 'PASS'; $R.failClass = ''
            Finish 0
          }
          $R.verdict = 'FAIL'
          if ($R.productClass -eq 'msi-refused') { $R.failClass = 'installer-type-msi' }
          elseif ($R.productClass -eq 'interactive-unsupported') { $R.failClass = 'installer-type-unsupported' }
          elseif ($R.A1 -ne 'PASS') { $R.failClass = 'install-incomplete' }
          elseif ($R.A2 -ne 'PASS') { $R.failClass = 'main-exe-not-found' }
          elseif ($R.A3 -ne 'PASS') { $R.failClass = 'launch-exits' }
          else { $R.failClass = 'other' }
          Finish 1
          '@
          Set-Content -Path .\compat-app.ps1 -Value $script -Encoding UTF8
          Write-Host "compat-app.ps1 written: $((Get-Item .\compat-app.ps1).Length) bytes"

      - name: Run compat leg (${{ matrix.app }})
        id: leg
        continue-on-error: true
        shell: pwsh
        run: |
          .\compat-app.ps1 -AppLabel '${{ matrix.app }}' `
            -FamilySlot '${{ matrix.family }}' `
            -InstallerUrl '${{ matrix.url }}' `
            -InstallerFile '${{ matrix.file }}' `
            -PinBytes ${{ matrix.bytes }} `
            -PinSha256 '${{ matrix.sha256 }}' `
            -ExpectedCsv '${{ matrix.expected }}' `
            -TokensCsv '${{ matrix.tokens }}' `
            -HostHintDir '${{ matrix.hintdir }}' `
            -UninstallRegex '${{ matrix.uninstregex }}' `
            -ExploreArgs '${{ matrix.exploreargs }}'

      - name: Leg summary
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:GITHUB_WORKSPACE 'results\${{ matrix.app }}\result-summary.txt'
          if (Test-Path $f) { Get-Content $f | Out-File $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append }
          else { "compat ${{ matrix.app }}: NO RESULT FILE (script died early)" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append }

      - name: Upload leg evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.app }}
          path: results
          retention-days: 30
          if-no-files-found: warn

  report:
    name: scoreboard
    needs: compat
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download all leg artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: artifacts
          merge-multiple: false

      - name: Build scoreboard and push to compat-results branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUT=compat-report.md
          {
            echo "# Sandboxie compat matrix — run ${{ github.run_id }} (${{ github.run_number }})"
            echo
            echo "| app | slot | detected | class | A1 | A2 | A3 | verdict | failClass | bytes | exploratory |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            for d in artifacts/compat-*/*/; do
              app=$(basename "$d")
              if [ -f "$d/result.json" ]; then
                python3 - "$d/result.json" <<'PYEOF'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8-sig'))
          exp = r.get('exploratory')
          if exp and exp.get('attempted'):
              es = f"{exp.get('E1','')}/{exp.get('E2','')}/{exp.get('E3','')} ({exp.get('method','')})"
          else:
              es = '-'
          def c(x): return (x or '').replace('|', '/').replace('\n', ' ')
          print(f"| {c(r.get('app',''))} | {c(r.get('familySlot',''))} | {c(r.get('detectedType',''))} | {c(r.get('productClass',''))} | {c(r.get('A1',''))} | {c(r.get('A2',''))} | {c(r.get('A3',''))} | {c(r.get('verdict',''))} | {c(r.get('failClass',''))} | {r.get('measuredBytes','')} | {c(es)} |")
          PYEOF
              else
                echo "| $app | ? | ? | ? | ? | ? | ? | NO-RESULT | harness | | - |"
              fi
            done
            echo
            echo "## Per-leg detail"
            for d in artifacts/compat-*/*/; do
              if [ -f "$d/result.json" ]; then
                echo
                echo "### $(basename "$d")"
                echo '```json'
                cat "$d/result.json"
                echo '```'
              fi
            done
          } > "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "mj-compat-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin compat-results 2>/dev/null || true
          git checkout -B compat-results
          mkdir -p compat-reports
          cp "$OUT" "compat-reports/run-${{ github.run_id }}.md"
          cp "$OUT" "compat-reports/latest.md"
          git add compat-reports
          git commit -m "compat matrix results run ${{ github.run_id }}"
          git push origin compat-results --force
