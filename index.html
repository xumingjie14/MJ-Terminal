<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>铭杰工作站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --glass:rgba(30,30,36,.58);
  --glass-brd:rgba(255,255,255,.22);
  --field:rgba(255,255,255,.09);
  --field-brd:rgba(255,255,255,.16);
  --txt:#f5f5f7;
  --accent:#0a84ff;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:background .5s ease}
/* ---------- menu bar ---------- */
#menubar{position:fixed;top:0;left:0;right:0;height:38px;z-index:1000;display:flex;align-items:center;gap:18px;padding:0 16px;background:rgba(22,22,28,.34);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.14);font-size:13.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#menubar .logo{font-weight:700;font-size:15px;cursor:pointer}
#menubar .mi{opacity:.92;cursor:default}
#menubar .mi b{font-weight:600}
#menubar .sp{flex:1}
#menubar .right{display:flex;align-items:center;gap:16px}
#mb-node{cursor:pointer;display:flex;align-items:center;gap:6px}
#mb-dot{width:9px;height:9px;border-radius:50%;background:#8e8e93;box-shadow:0 0 6px rgba(0,0,0,.3)}
#mb-dot.on{background:#30d158;box-shadow:0 0 8px #30d158}
#mb-clock{font-variant-numeric:tabular-nums}
/* ---------- desktop icons ---------- */
#icons{position:fixed;inset:0;z-index:5;pointer-events:none}
.icon{position:absolute;width:92px;padding:8px 2px 6px;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;color:#fff;text-align:center;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.icon.dragging{opacity:.88;z-index:60;cursor:grabbing;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.icon img,.fp-item img{-webkit-user-drag:none;user-drag:none}
.icon.dropok{background:rgba(120,200,255,.35);border-color:rgba(255,255,255,.6)}
.appico.folderico{background:rgba(255,255,255,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:8px;box-sizing:border-box}
.fmini{position:relative;width:100%;aspect-ratio:1;border-radius:6px;background:#f5f5f7;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;font-weight:700;color:#333}
.fmini img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;box-sizing:border-box}
.fempty{grid-column:1/3;font-size:26px;align-self:center}
/* ---------- desktop context menu & folder popup ---------- */
#ctxmenu{position:fixed;z-index:3000;min-width:184px;padding:6px;border-radius:12px;background:rgba(32,32,40,.78);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 44px rgba(0,0,0,.5);color:#fff}
#ctxmenu.hidden{display:none}
.ctxitem{padding:8px 12px;border-radius:8px;font-size:13.5px;cursor:pointer}
.ctxitem:hover{background:rgba(120,160,255,.35)}
#folderpop{position:fixed;z-index:2500;width:308px;padding:14px;border-radius:16px;background:rgba(30,30,38,.8);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.22);box-shadow:0 20px 55px rgba(0,0,0,.55);color:#fff}
#folderpop.hidden{display:none}
.fp-head{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.fp-head b{font-size:15px}
.fp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fp-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;cursor:pointer;background:transparent;border:0;color:#fff;font-size:11px;touch-action:none}
.fp-item:hover{background:rgba(255,255,255,.12)}
.fp-item span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.icon:hover{background:rgba(255,255,255,.10)}
.icon.sel{background:rgba(120,160,255,.30);border-color:rgba(255,255,255,.35)}
.appico{width:54px;height:54px;margin:0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);position:relative}
.icon .n{font-size:12px;margin-top:5px;line-height:1.25;text-shadow:0 1px 5px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-home{background:linear-gradient(180deg,#5ec2ff,#0a62d6)}
.g-term{background:linear-gradient(180deg,#4a4a52,#101014);font-family:ui-monospace,Consolas,monospace;font-size:21px;color:#7dff8a}
.g-files{background:linear-gradient(180deg,#ffe9a8,#f5b301)}
.g-core{background:linear-gradient(180deg,#bf5af2,#7d2ae8)}
.appico.webapp{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.appico.webapp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;box-sizing:border-box;background:#f5f5f7;border-radius:inherit}
.appico.webapp.mini{width:26px;height:26px;font-size:14px;border-radius:7px;margin:0;flex:none}
.appico.webapp.mini img{padding:3px}
.g-firefox{background:linear-gradient(160deg,#ff7139 0%,#e22865 55%,#9059ff 100%)}
.g-ssh{background:linear-gradient(180deg,#3ddc84,#0d5136)}
.g-console{background:linear-gradient(180deg,#48484f,#131316);color:#ffb340;font-family:ui-monospace,Consolas,monospace}
/* ---------- debug console (v0.22) ---------- */
.cschip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.10);font-size:12px}
.csdot{width:8px;height:8px;border-radius:50%;background:#636366;flex:none}
.csdot.on{background:#30d158}.csdot.off{background:#ff453a}
.csin{background:#1c1c22;border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;outline:none;font:inherit}
.cl{display:flex;gap:8px;white-space:pre-wrap;word-break:break-all}
.cl .ct{color:#8e8e93;flex:none}
.cl .cm{color:#64d2ff;flex:none}
.cl.warn .cmsg{color:#ffd60a}
.cl.error .cmsg{color:#ff6961}
.g-store{background:linear-gradient(160deg,#64d2ff,#0a5cff)}
.g-openclaw{background:linear-gradient(160deg,#ff9a3c 0%,#e23c2e 58%,#8f1d1d 100%)}
.g-sys{background:linear-gradient(180deg,#d1d1d6,#636366)}
.g-browser{background:#fff}
.chrome-dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at center,#4f9cf9 0 34%,transparent 35%),conic-gradient(#ea4335 0 32%,#fbbc05 32% 64%,#34a853 64% 100%)}
/* ---------- windows ---------- */
.win{position:fixed;width:700px;max-width:95vw;height:490px;max-height:calc(100vh - 130px);background:var(--glass);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);display:flex;flex-direction:column;overflow:hidden;color:var(--txt)}
.win.hidden{display:none}
.win.staged{transform-origin:top left;cursor:pointer;transition:transform .18s ease}
.win.staged::after{content:'';position:absolute;inset:0;z-index:60;border-radius:inherit}
#mb-stage{cursor:pointer;opacity:.55}
#mb-stage.on{opacity:1;color:#30d158}
.title{position:relative;height:46px;flex:none;display:flex;align-items:center;padding:0 14px;cursor:move;user-select:none;background:rgba(255,255,255,.05)}
.lights{display:flex;gap:8px}
.lights button{width:13px;height:13px;border-radius:50%;border:0;cursor:pointer;font-size:9px;line-height:1;color:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:0}
.l-close{background:#ff5f57}.l-min{background:#febc2e}.l-max{background:#28c840}
.lights button span{opacity:0}.title:hover .lights button span{opacity:.8}
.title b{position:absolute;left:0;right:0;text-align:center;font-size:13.5px;font-weight:600;pointer-events:none;color:rgba(255,255,255,.92)}
.body{flex:1;overflow:auto;padding:16px;font-size:14px}
.body::-webkit-scrollbar{width:9px}.body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:9px}
.body h2,.body h3{font-weight:650}
.mut{opacity:.72;font-size:13px;line-height:1.7}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);border:0;color:#fff;border-radius:9px;padding:8px 15px;cursor:pointer;font-size:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn:active{filter:brightness(.85)}
.btn.gray{background:rgba(255,255,255,.16)}.btn.red{background:#ff453a}.btn:disabled{opacity:.5}
.txt,.pathin,textarea{flex:1;min-width:120px;background:var(--field);border:1px solid var(--field-brd);color:#fff;border-radius:9px;padding:9px 11px;outline:none;font:inherit}
.txt:focus,.pathin:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.35)}
pre.term{background:rgba(5,7,10,.78);color:#b7ffb0;border-radius:12px;padding:12px;min-height:280px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.55;overflow:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.09);text-align:left}
tr.file{cursor:pointer}tr.file:hover{background:rgba(255,255,255,.08)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px}
a{color:#64d2ff}
/* wallpaper picker */
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.wp{height:64px;border-radius:12px;border:2px solid transparent;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.wp.sel{border-color:var(--accent)}
.wp span{position:absolute;left:7px;bottom:5px;font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}
/* ---------- app store (v0.24) ---------- */
.stcat{text-align:left;padding:7px 11px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.stcat:hover{background:rgba(255,255,255,.10)}
.stcat.on{background:rgba(10,132,255,.28);border-color:rgba(120,190,255,.45)}
.stcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:7px}
.stcard .sthead{display:flex;gap:10px;align-items:center}
.stcard .sthead .appico{width:42px;height:42px;border-radius:10px;font-size:20px;margin:0;flex:none}
.stcard .sthead .appico img{padding:5px}
.stbadge{display:inline-block;padding:2px 8px;border-radius:99px;background:rgba(48,209,88,.20);border:1px solid rgba(48,209,88,.4);font-size:11px;color:#a9efbe}
.stbar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.stbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* ---------- dock ---------- */
#dockwrap{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:center;z-index:900;pointer-events:none}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:7px;padding:8px 10px;background:rgba(30,30,38,.42);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.24);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.ditem{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.dockbtn{border:0;background:transparent;cursor:pointer;padding:0;transition:transform .12s ease-out;transform-origin:bottom center}
.dockbtn .appico{width:52px;height:52px;border-radius:12px;transition:width .12s,height .12s}
.dlabel{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:rgba(40,40,46,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12px;padding:3px 10px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.ditem:hover .dlabel{opacity:1}
.ddot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0}
.ddot.on{opacity:1}
/* ---------- external app windows in the stage strip (v0.18 窗口统一·乙) ---------- */
#extstrip{position:fixed;left:10px;bottom:104px;z-index:25;width:148px;display:flex;flex-direction:column;gap:8px}
#extstrip.hidden{display:none}
#extstrip .extlab{font-size:11px;color:rgba(255,255,255,.88);text-shadow:0 1px 4px rgba(0,0,0,.85);padding:0 2px}
.extcard{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 10px 26px rgba(0,0,0,.42);cursor:pointer;color:#fff;text-align:left;font:inherit}
.extcard:hover{background:rgba(74,74,88,.62)}
.extcard .et{min-width:0;flex:1}
.extcard .et b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extcard .et span{display:block;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="wall"></div>

<div id="menubar">
  <span class="logo" id="mb-logo"> 铭杰</span>
  <span class="mi"><b id="mb-appname">访达</b></span>
  <span class="mi">文件</span><span class="mi">编辑</span><span class="mi">显示</span><span class="mi">窗口</span><span class="mi">帮助</span>
  <span class="sp"></span>
  <span class="right">
    <span id="mb-node" title="节点状态"><span id="mb-dot"></span><span id="mb-nodetxt">节点</span></span>
    <span id="mb-stage" title="台前调度：只显示当前应用">▦</span>
    <span>📶</span><span>🔋</span>
    <span id="mb-clock">--</span>
  </span>
</div>

<div id="icons"></div>
<div id="wins"></div>
<div id="extstrip" class="hidden"></div>
<div id="ctxmenu" class="hidden"></div>
<div id="folderpop" class="hidden"></div>

<div id="dockwrap"><div id="dock"></div></div>

<script>
const APPS=[
 {id:'home',e:'',g:'g-home',glyph:'⌂',n:'工作站'},
 {id:'term',e:'>_',g:'g-term',glyph:'>_',n:'终端'},
 {id:'files',e:'🗂️',g:'g-files',glyph:'🗂️',n:'文件'},
 {id:'browser',e:'',g:'g-browser',glyph:'',n:'谷歌浏览器'},
 {id:'firefox',e:'🦊',g:'g-firefox',glyph:'🦊',n:'Firefox'},
 {id:'ssh',e:'🖥️',g:'g-ssh',glyph:'🖥️',n:'SSH'},
 {id:'console',e:'≡',g:'g-console',glyph:'≡',n:'控制台'},
 {id:'appstore',e:'🛍️',g:'g-store',glyph:'🛍️',n:'应用商店'},
 {id:'openclaw',e:'🦞',g:'g-openclaw',glyph:'🦞',n:'小龙虾'},
 {id:'core',e:'🚀',g:'g-core',glyph:'🚀',n:'节点'},
 {id:'sys',e:'⚙️',g:'g-sys',glyph:'⚙️',n:'设置'},
];
const WALLPAPERS={
 tahoe:{n:'大湖',css:'radial-gradient(1100px 600px at 78% -10%,#ffb35c 0%,transparent 55%),radial-gradient(900px 700px at 12% 110%,#3b1d8f 0%,transparent 60%),linear-gradient(160deg,#1c6dd9 0%,#5b2ee5 52%,#b01e9e 100%)'},
 sonoma:{n:'索诺玛',css:'radial-gradient(900px 550px at 85% 0%,#ffd29d 0%,transparent 55%),radial-gradient(800px 600px at 0% 100%,#7a1e5e 0%,transparent 60%),linear-gradient(150deg,#f2709c 0%,#ff9472 55%,#b24592 100%)'},
 sequoia:{n:'红杉',css:'radial-gradient(900px 650px at 80% 110%,#0f5132 0%,transparent 60%),radial-gradient(700px 500px at 10% -10%,#9be15d22 0%,transparent 50%),linear-gradient(165deg,#06131f 0%,#0b2e2a 60%,#083344 100%)'},
 ventura:{n:'文图拉',css:'radial-gradient(900px 600px at 15% -10%,#f0f 0%,transparent 45%),radial-gradient(900px 700px at 90% 110%,#302b63 0%,transparent 60%),linear-gradient(140deg,#6441a5 0%,#2a0845 90%)'},
 aurora:{n:'极光',css:'radial-gradient(1000px 500px at 60% -20%,#43e97b55 0%,transparent 55%),radial-gradient(800px 600px at 20% 120%,#38f9d755 0%,transparent 55%),linear-gradient(170deg,#050a1f 0%,#0b2740 55%,#12082e 100%)'},
 graphite:{n:'石墨',css:'radial-gradient(900px 600px at 80% 0%,#ffffff14 0%,transparent 50%),linear-gradient(160deg,#232329 0%,#101014 70%,#050507 100%)'},
};
const winsEl=document.getElementById('wins'), iconsEl=document.getElementById('icons'), dockEl=document.getElementById('dock'), wallEl=document.getElementById('wall');
let z=10, sysInfo=null, customWall=false;

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(p,opt){const r=await fetch(p,opt);let t=await r.text();try{return JSON.parse(t)}catch(e){return{raw:t}}}

/* ----- wallpaper ----- */
function applyWallpaper(){
 if(customWall){wallEl.style.background=`center/cover no-repeat url(/api/wallpaper?v=${Date.now()})`;return}
 const key=localStorage.getItem('mj-wall')||'tahoe';
 wallEl.style.background=(WALLPAPERS[key]||WALLPAPERS.tahoe).css;
}
async function detectCustomWall(){
 try{const r=await fetch('/api/wallpaper',{method:'GET'});customWall=r.ok}catch(e){customWall=false}
 applyWallpaper();
}
detectCustomWall();

/* ----- menu bar clock ----- */
function tick(){
 const d=new Date();
 const s=d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
 document.getElementById('mb-clock').textContent=s;
}
tick();setInterval(tick,5000);

/* ----- node status in menu bar ----- */
async function pollNode(){
 try{
  const r=await api('/api/core',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status'})});
  document.getElementById('mb-dot').className=r.running?'on':'';
  document.getElementById('mb-dot').id='mb-dot';
  document.getElementById('mb-nodetxt').textContent=r.running?'节点已连':'节点';
 }catch(e){}
}
pollNode();setInterval(pollNode,20000);
document.getElementById('mb-node').onclick=()=>openApp('core');
document.getElementById('mb-logo').onclick=()=>openApp('home');
document.getElementById('mb-stage').onclick=()=>toggleStage(!stageOn());
updateStageUI();

/* ----- windows ----- */
function appIcon(a,size){
 if(a.id==='browser')return `<div class="appico g-browser"><div class="chrome-dot"></div></div>`;
 return `<div class="appico ${a.g}">${esc(a.glyph)}</div>`;
}
function makeWin(app,i){
 const w=document.createElement('section');w.className='win hidden';w.id='win-'+app.id;
 w.style.left=(90+i*40)+'px';w.style.top=(86+i*30)+'px';
 w.innerHTML=`<div class="title"><div class="lights"><button class="l-close" data-a="close"><span>✕</span></button><button class="l-min" data-a="min"><span>–</span></button><button class="l-max"><span>＋</span></button></div><b>${app.n}</b></div><div class="body" id="body-${app.id}"></div>`;
 const title=w.querySelector('.title');
 title.addEventListener('pointerdown',ev=>{
   if(ev.target.closest('button'))return;bring(w);
   const sx=ev.clientX-w.offsetLeft, sy=ev.clientY-w.offsetTop;
   function mv(e){w.style.left=Math.max(0,e.clientX-sx)+'px';w.style.top=Math.max(44,e.clientY-sy)+'px'}
   function up(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up)}
   addEventListener('pointermove',mv);addEventListener('pointerup',up);
 });
 title.addEventListener('dblclick',()=>{w.style.width=w.style.width==='96vw'?'':'96vw';w.style.left=w.style.width?'2vw':'90px'});
 w.querySelector('[data-a="close"]').onclick=()=>{w.classList.add('hidden');onWinClosed(app.id);syncDots()};
 w.addEventListener('pointerdown',()=>{ if(w.classList.contains('staged')) openApp(app.id); });
 w.querySelector('[data-a="min"]').onclick=()=>{w.classList.add('hidden');onWinClosed(app.id);syncDots()};
 winsEl.appendChild(w);return w;
}
function bring(w){w.style.zIndex=++z}
function openApp(id){
 let w=document.getElementById('win-'+id);
 if(!w){w=makeWin(APPS.find(a=>a.id===id),APPS.findIndex(a=>a.id===id));render(id)}
 lastApp=id;
 if(stageOn()){ openSet.add(id); setFront(id); }
 else { w.classList.remove('hidden'); bring(w); }
 document.getElementById('mb-appname').textContent=APPS.find(a=>a.id===id).n;

/* ----- stage manager (v0.15): one app front, others as live thumbnails ----- */
let openSet=new Set(), frontApp=null, lastApp='home';
function stageOn(){return localStorage.getItem('mj-stage')==='1'}
function applyStage(w,idx){
 if(!w.classList.contains('staged')){
  w.dataset.sg=JSON.stringify({l:w.style.left,t:w.style.top,wd:w.style.width});
  w.classList.add('staged');
 }
 w.style.left='10px';
 w.style.top=(64+idx*116)+'px';
 w.style.zIndex=20+idx;
 const gw=w.offsetWidth||700;
 w.style.transform=`scale(${(148/gw).toFixed(4)})`;
}
function restoreStage(w){
 if(!w.classList.contains('staged')) return;
 w.classList.remove('staged');
 w.style.transform='';
 try{const g=JSON.parse(w.dataset.sg||'{}'); if(g.l)w.style.left=g.l; if(g.t)w.style.top=g.t; if(g.wd)w.style.width=g.wd;}catch(e){}
}
function layoutStrip(){
 let idx=0;
 APPS.forEach(a=>{
  if(a.id===frontApp||!openSet.has(a.id)) return;
  const w=document.getElementById('win-'+a.id); if(!w) return;
  applyStage(w,idx++);
 });
}
function setFront(id){
 frontApp=id;
 const w=document.getElementById('win-'+id);
 if(w){ restoreStage(w); w.classList.remove('hidden'); bring(w); }
 layoutStrip();
 syncDots();
}
function onWinClosed(id){
 if(!stageOn()||!openSet.has(id)) return;
 openSet.delete(id);
 const w=document.getElementById('win-'+id);
 if(w) restoreStage(w);
 if(frontApp===id){
  const rest=APPS.map(a=>a.id).filter(x=>openSet.has(x));
  if(rest.length) setFront(rest[rest.length-1]); else frontApp=null;
 } else layoutStrip();
}
function toggleStage(on){
 localStorage.setItem('mj-stage',on?'1':'0');
 updateStageUI();
 if(on){
  openSet=new Set(APPS.map(a=>a.id).filter(x=>{const w=document.getElementById('win-'+x);return w&&!w.classList.contains('hidden')}));
  if(!openSet.size) openSet.add('home');
  const f=openSet.has(lastApp)?lastApp:[...openSet][0];
  const w=document.getElementById('win-'+f);
  if(w) w.classList.remove('hidden');
  setFront(f);
 } else {
  openSet.forEach(x=>{const w=document.getElementById('win-'+x); if(w){ restoreStage(w); w.classList.remove('hidden'); }});
  frontApp=null;
 }
 syncDots();
}

   clicking one asks the daemon to bring that real window to front. */
async function refreshExtStrip(){
 const box=document.getElementById('extstrip'); if(!box) return;
 if(!stageOn()){ box.classList.add('hidden'); box.innerHTML=''; return; }
 let list=[];
 try{ const r=await api('/api/extwin'); list=(r.windows||[]).filter(x=>!x.shell); }catch(e){}

function deskPos(key,slot){
 const p=LAYOUT.pos[key];
 if(p&&typeof p.x==='number'&&typeof p.y==='number') return {x:Math.max(0,Math.min(p.x,innerWidth-96)),y:Math.max(42,Math.min(p.y,innerHeight-120))};

function mkDeskIcon(key,kind,iconHTML,name,onOpen,fid){

 d.className='icon'; d.dataset.key=key; d.dataset.kind=kind; if(fid) d.dataset.fid=fid;

 iconsEl.innerHTML='';

 APPS.forEach(a=>{ place(mkDeskIcon('app:'+a.id,'app',appIcon(a),a.n,()=>openApp(a.id)),'app:'+a.id); });
 const inFolder=new Set(); LAYOUT.folders.forEach(f=>f.items.forEach(u=>inFolder.add(u)));
 WEBAPPS.filter(a=>!inFolder.has(a.url)).forEach(a=>{ place(mkDeskIcon('web:'+a.url,'web',webIconHTML(a),a.name,()=>openWebApp(a.url)),'web:'+a.url); });
 LAYOUT.folders.forEach(f=>{ const el=mkDeskIcon('folder:'+f.id,'folder',folderIconHTML(f),f.name,()=>openFolderPop(f.id,el),f.id); place(el,'folder:'+f.id); });
 STOREAPPS.forEach(a=>{ place(mkDeskIcon('store:'+a.id,'native',storeIconHTML(a),a.name,()=>launchStoreApp(a.id)),'store:'+a.id); });

/* ----- icon dragging ----- */
let dragState=null;
function attachDrag(el,key,kind){
 el.addEventListener('pointerdown',ev=>{
  if(ev.button!==0) return;
  ev.preventDefault();
  const r=el.getBoundingClientRect();
  dragState={el,key,kind,sx:ev.clientX,sy:ev.clientY,ox:r.left,oy:r.top,moved:false};
  try{el.setPointerCapture(ev.pointerId)}catch(e){}
 });
 el.addEventListener('pointermove',ev=>{
  if(!dragState||dragState.el!==el) return;
  const dx=ev.clientX-dragState.sx, dy=ev.clientY-dragState.sy;
  if(!dragState.moved&&Math.hypot(dx,dy)<5) return;
  dragState.moved=true; el.classList.add('dragging');
  el.style.left=Math.max(0,Math.min(innerWidth-96,dragState.ox+dx))+'px';
  el.style.top=Math.max(42,Math.min(innerHeight-110,dragState.oy+dy))+'px';
  if(kind==='web') highlightFolderAt(ev.clientX,ev.clientY,el);
 });
 const up=ev=>{
  if(!dragState||dragState.el!==el) return;
  const ds=dragState; dragState=null;
  el.classList.remove('dragging'); clearFolderHi();
  if(!ds.moved) return;
  suppressClickUntil=Date.now()+300;
  finishDrop(ds,ev.clientX,ev.clientY,parseFloat(el.style.left)||0,parseFloat(el.style.top)||0);
 };
 el.addEventListener('pointerup',up);
 el.addEventListener('pointercancel',up);
}
function folderTileAt(x,y,exceptEl){
 let hit=null;
 document.querySelectorAll('.icon[data-fid]').forEach(t=>{
  if(t===exceptEl) return;
  const r=t.getBoundingClientRect();
  if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) hit=t;
 });
 return hit;
}
function highlightFolderAt(x,y,el){
 const hit=folderTileAt(x,y,el);
 document.querySelectorAll('.icon[data-fid]').forEach(t=>t.classList.toggle('dropok',t===hit));
}
function clearFolderHi(){document.querySelectorAll('.icon.dropok').forEach(t=>t.classList.remove('dropok'))}
function finishDrop(ds,cx,cy,x,y){
 if(ds.kind==='web'){
  const tile=folderTileAt(cx,cy,ds.el);
  if(tile){
   const f=folderById(tile.dataset.fid);
   const url=ds.key.slice(4);
   if(f&&!f.items.includes(url)) f.items.push(url);
   delete LAYOUT.pos[ds.key];
   saveLayout(); renderDesk();
   return;
  }
 }
 LAYOUT.pos[ds.key]={x:Math.round(x),y:Math.round(y)};
 saveLayout();
}
/* ----- folder popup ----- */
let openFolderEl=null;
function openFolderPop(fid,anchorEl){
 const f=folderById(fid); if(!f) return;
 openFolderEl=anchorEl;
 const pop=document.getElementById('folderpop');
 const items=f.items.map(u=>WEBAPPS.find(a=>a.url===u)).filter(Boolean);
 pop.innerHTML=`<div class="fp-head"><b>${esc(f.name)}</b><span class="mut">${items.length} 个应用 · 点开即用，把图标拖出弹窗即可移回桌面</span></div><div class="fp-grid">${items.map(a=>`<button class="fp-item" data-url="${esc(a.url)}">${webIconHTML(a)}<span>${esc(a.name)}</span></button>`).join('')}</div>${items.length?'':'<p class="mut" style="padding:4px 2px">空的：把桌面上的网站图标拖到这个文件夹上，就能放进来。</p>'}<div class="row" style="margin-top:10px"><button class="btn gray" id="fp-rename">重命名</button><button class="btn gray" id="fp-dissolve">解散文件夹</button><button class="btn" id="fp-close">关闭</button></div>`;
 pop.classList.remove('hidden');
 const r=anchorEl.getBoundingClientRect();
 pop.style.left=Math.max(8,Math.min(innerWidth-324,r.right-308))+'px';
 pop.style.top=Math.max(48,Math.min(innerHeight-360,r.top))+'px';
 pop.querySelectorAll('.fp-item').forEach(it=>{
  it.onclick=()=>{ if(Date.now()<suppressClickUntil) return; closeFolderPop(); openWebApp(it.dataset.url); };
  attachPopupDrag(it,fid);
 });
 document.getElementById('fp-close').onclick=closeFolderPop;
 document.getElementById('fp-rename').onclick=()=>{ const n=prompt('文件夹名字',f.name); if(n&&n.trim()){ f.name=n.trim().slice(0,24); saveLayout(); renderDesk(); closeFolderPop(); } };
 document.getElementById('fp-dissolve').onclick=()=>{ LAYOUT.folders=LAYOUT.folders.filter(x=>x.id!==fid); saveLayout(); closeFolderPop(); renderDesk(); };
}
function closeFolderPop(){ document.getElementById('folderpop').classList.add('hidden'); openFolderEl=null; }
function attachPopupDrag(it,fid){
 let st=null;
 it.addEventListener('pointerdown',ev=>{
  if(ev.button!==0) return;
  ev.preventDefault();
  const r=it.getBoundingClientRect();
  st={sx:ev.clientX,sy:ev.clientY,ox:r.left,oy:r.top,moved:false};
  try{it.setPointerCapture(ev.pointerId)}catch(e){}
 });
 it.addEventListener('pointermove',ev=>{
  if(!st) return;
  const dx=ev.clientX-st.sx, dy=ev.clientY-st.sy;
  if(!st.moved&&Math.hypot(dx,dy)<6) return;
  if(!st.moved){ st.moved=true; it.style.position='fixed'; it.style.zIndex='2600'; it.style.width='72px'; it.style.pointerEvents='none'; }
  it.style.left=(st.ox+dx)+'px'; it.style.top=(st.oy+dy)+'px';
 });
 const up=ev=>{
  if(!st) return;
  const moved=st.moved; st=null;
  if(!moved) return;
  suppressClickUntil=Date.now()+300;
  const url=it.dataset.url;
  const pop=document.getElementById('folderpop').getBoundingClientRect();
  const inside=ev.clientX>=pop.left&&ev.clientX<=pop.right&&ev.clientY>=pop.top&&ev.clientY<=pop.bottom;
  if(inside){ if(openFolderEl) openFolderPop(fid,openFolderEl); return; }
  const f=folderById(fid); if(f) f.items=f.items.filter(u=>u!==url);
  LAYOUT.pos['web:'+url]={x:Math.round(Math.max(0,ev.clientX-46)),y:Math.round(Math.max(42,ev.clientY-30))};
  saveLayout(); closeFolderPop(); renderDesk();
 };
 it.addEventListener('pointerup',up);
 it.addEventListener('pointercancel',up);
}

async function loadSys(){
 sysInfo=await api('/api/system');
 const el=document.getElementById('home-sys'); if(el) el.textContent=`${sysInfo.os}/${sysInfo.arch} · ${sysInfo.hostname} · CPU ${sysInfo.numCPU} 核 · 主目录 ${sysInfo.home}`;
 const kv=document.getElementById('syskv'); if(kv) kv.innerHTML=Object.entries({电脑名:sysInfo.hostname,系统:sysInfo.os,架构:sysInfo.arch,CPU核数:sysInfo.numCPU,主目录:sysInfo.home,程序目录:sysInfo.exeDir,数据目录:sysInfo.dataDir,当前时间:sysInfo.time}).map(([k,v])=>`<span class="mut">${k}</span><span>${esc(v)}</span>`).join('');
 const pr=document.getElementById('prompt'); if(pr) pr.textContent=sysInfo.home||'>';
}

let curPath='';
async function loadFiles(p){
 const r=await api('/api/list?path='+encodeURIComponent(p||''));
 if(r.error){document.getElementById('flist').textContent='打开失败：'+r.error;return}
 curPath=r.path;document.getElementById('fpath').value=curPath;
 document.getElementById('flist').innerHTML=`<table>${r.items.map(it=>`<tr class="file" data-p="${esc(it.path)}" data-d="${it.dir}"><td>${it.dir?'📁':'📄'}</td><td>${esc(it.name)}</td><td>${it.dir?'':(it.size/1024).toFixed(1)+' KB'}</td></tr>`).join('')}</table>`;
 document.querySelectorAll('tr.file').forEach(tr=>tr.ondblclick=async()=>{
   if(tr.dataset.d==='true') loadFiles(tr.dataset.p);
   else await api('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:tr.dataset.p})});
 });
}

let history=[],hi=-1;
async function runCmd(cmd){
 const out=document.getElementById('tout'), pr=document.getElementById('prompt');
 if(!cmd.trim())return; history.unshift(cmd);hi=-1;
 out.textContent+=`\r\n${pr.textContent}> ${cmd}\r\n运行中…`;
 const r=await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});
 out.textContent=out.textContent.replace(/运行中…$/,'');
 out.textContent+=(r.output||'')+(r.error?('\r\n[错误] '+r.error):'')+'\r\n';
 if(r.cwd) pr.textContent=r.cwd;
 out.scrollTop=out.scrollHeight;
}
async function coreAct(action){
 const r=await api('/api/core',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
 const s=document.getElementById('core-status'); if(s) s.textContent='状态：'+(r.message||JSON.stringify(r));
 pollNode();
}

   const stagePaint=()=>{const t=document.getElementById('stage-toggle'),s=document.getElementById('stage-state');if(t)t.textContent='台前调度：'+(stageOn()?'开':'关');if(s)s.textContent=stageOn()?'生效中 · 点左侧缩略图切换应用':'已关闭 · 窗口自由摆放';};

   document.getElementById('quit').onclick=async()=>{await api('/api/shutdown',{method:'POST'});document.body.innerHTML='<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;text-shadow:0 2px 10px #000">已退出，节点和后台都停了</div>'};
   /* ----- OTA update ----- */
   const updStatus=document.getElementById('upd-status'), updDl=document.getElementById('upd-dl'), updApply=document.getElementById('upd-apply');
   const updPaint=r=>{
     document.getElementById('upd-cur').textContent='v'+(r.current||'?');
     let m=r.message||'';
     if(r.phase==='downloading'&&r.size) m=`正在下载… ${((r.progress||0)/1048576).toFixed(1)} / ${(r.size/1048576).toFixed(1)} MB`;
     if(!m) m='点「检查更新」看看有没有新版';
     updStatus.textContent=m||r.phase;
     updDl.style.display=r.phase==='available'?'':'none';
     updApply.style.display=r.phase==='ready'?'':'none';
     const tk=document.getElementById('upd-token');
     if(r.token&&tk&&document.activeElement!==tk) tk.placeholder='令牌已配置（粘贴新令牌可更换，留空保存 = 删除）';
   };
   const updRefresh=async()=>{try{updPaint(await api('/api/update'))}catch(e){}};
   updRefresh(); setInterval(()=>{if(document.getElementById('upd-status'))updRefresh()},3000);
   document.getElementById('upd-token-save').onclick=async()=>{
     const v=document.getElementById('upd-token').value;
     const r=await api('/api/update/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:v})});
     document.getElementById('upd-token').value='';
     updStatus.textContent=r.error?('保存失败：'+r.error):(r.token?'令牌已保存，可以检查更新了':'令牌已删除');
     updRefresh();
   };
   document.getElementById('upd-check').onclick=async()=>{updStatus.textContent='检查中…';updPaint(await api('/api/update/check',{method:'POST'}))};
   updDl.onclick=async()=>{updPaint(await api('/api/update/download',{method:'POST'}));updRefresh()};
   updApply.onclick=async()=>{
     if(!confirm('现在重启并更新到新版本？节点会断开几秒，之后自动重连。'))return;
     const r=await api('/api/update/apply',{method:'POST'});

   };

 if(id==='ssh'){
   let conns=[], keys=[], cur=null, ws=null, term=null, fit=null, curPath='';
   const G=x=>document.getElementById(x);
   const loadAssets=()=>new Promise(res=>{

   });
   const paintConns=()=>{
     G('sshconn').innerHTML=conns.map(c=>`<option value="${c.id}">${esc(c.name||c.host)}（${esc(c.user)}@${esc(c.host)}:${c.port||22}${c.proxy?' · 走节点':''}）</option>`).join('')||'<option value="">（暂无连接，先点新建）</option>';

   G('sshedit').onclick=()=>{ const c=conns.find(x=>x.id===G('sshconn').value); if(!c) return; G('sshform').style.display='block'; G('sf_name').value=c.name||''; G('sf_host').value=c.host||''; G('sf_port').value=c.port||22; G('sf_user').value=c.user||''; G('sf_auth').value=c.auth||'password'; G('sf_key').value=c.keyfile||''; G('sf_proxy').checked=!!c.proxy; G('sshconn').dataset.edit=c.id; G('sfst').textContent='改完点保存'; };
   G('sshdel').onclick=async()=>{ const cid=G('sshconn').value; if(!cid) return; if(!confirm('删掉这个连接？')) return; await api('/api/ssh/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conn:{id:cid},delete:true})}); loadSSH(); };

   const ensureTerm=async()=>{ await loadAssets(); if(term) return; term=new Terminal({fontSize:13,cursorBlink:true,theme:{background:'#0b0e14',foreground:'#d6e2f0'}}); fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.open(G('sshterm')); try{fit.fit()}catch(e){} term.onData(d=>{ if(ws&&ws.readyState===1) ws.send(new TextEncoder().encode(d)); }); term.onResize(({cols,rows})=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({t:'resize',cols,rows})); }); };
   G('sshgo').onclick=async()=>{

     ws.onmessage=e=>{ if(!term) return; if(typeof e.data==='string') term.write(e.data); else term.write(new Uint8Array(e.data)); };
     ws.onclose=()=>{ G('sshst').textContent='已断开'; if(cur===cid) cur=null; };

     }).join('')||'（空目录）';

   };

   G('sfrefresh').onclick=()=>sfList(curPath);
   G('sfmkdir').onclick=async()=>{ const n=prompt('新文件夹名'); if(!n) return; const r=await api('/api/ssh/sftp/mkdir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conn:cur,path:(curPath.endsWith('/')?curPath:curPath+'/')+n})}); if(r.error) alert(r.error); else sfList(curPath); };
   G('sfupload').onclick=()=>G('sffile').click();

 }
 if(id==='console'){
   const G=x=>document.getElementById(x);
   let lastSeq=0, entries=[], stat=null;
   const rank={info:1,warn:2,error:3};
   const vis=()=>{const w=G('win-console');return !!w&&!w.classList.contains('hidden')};
   const filtered=()=>{const lv=G('cs-level').value, md=G('cs-module').value, q=G('cs-q').value.trim().toLowerCase();
     return entries.filter(e=>(!lv||rank[e.level]>=rank[lv])&&(!md||e.module===md)&&(!q||(e.msg+' '+e.module+' '+e.level).toLowerCase().includes(q)))};
   const paint=()=>{const list=filtered();
     G('cs-log').innerHTML=list.length?list.map(e=>`<div class="cl ${e.level}"><span class="ct">${esc((e.time||'').slice(11))}</span><span class="cm">[${esc(e.module)}]</span><span class="cmsg">${esc(e.msg)}</span></div>`).join(''):'<div style="opacity:.55">（暂无符合条件的日志）</div>';
     if(G('cs-auto').checked) G('cs-log').scrollTop=G('cs-log').scrollHeight;};
   const paintStat=s=>{ if(!s||s.error) return; stat=s;
     G('cs-ver').textContent='v'+s.version;
     G('cs-core').textContent=s.coreRunning?'运行中':'已停止'; G('cs-core-dot').className='csdot '+(s.coreRunning?'on':'off');
     G('cs-node').textContent=s.nodeConnected?('已连（'+s.nodeCount+' 个）'):'未连'; G('cs-node-dot').className='csdot '+(s.nodeConnected?'on':'off');
     G('cs-up').textContent=s.uptimeText||''; G('cs-cnt').textContent=(s.logCount??0)+' 条'; };
   const fetchStat=async()=>{ try{ paintStat(await api('/api/diag/status')); }catch(e){} };
   const tick=async()=>{ if(!vis()) return;
     try{ const r=await api('/api/diag/logs?after='+lastSeq); const es=r.entries||[];
       if(es.length){ es.forEach(e=>{ entries.push(e); if(e.seq>lastSeq) lastSeq=e.seq; }); if(entries.length>2000) entries=entries.slice(-2000); paint(); }
       else if(!entries.length) paint();
     }catch(e){} };
   G('cs-level').onchange=paint; G('cs-module').onchange=paint; G('cs-q').oninput=paint;
   G('cs-export').onclick=()=>{ const a=document.createElement('a'); a.href='/api/diag/export'; document.body.appendChild(a); a.click(); a.remove(); };
   G('cs-copy').onclick=async()=>{
     const btn=G('cs-copy');
     await fetchStat();
     const s=stat||{};
     const errs=entries.filter(e=>e.level==='error').slice(-10);
     const txt=['MJ Terminal 诊断摘要','时间：'+new Date().toLocaleString('zh-CN'),
       '版本：v'+(s.version||'?')+' · '+(s.os||'')+'/'+(s.arch||'')+' · 守护进程端口 '+(s.port||'?')+' · 已运行 '+(s.uptimeText||'?'),
       '核心：'+(s.coreRunning?'运行中':'已停止')+' · 节点：'+(s.nodeConnected?'已连':'未连')+'（共 '+(s.nodeCount??0)+' 个） · 外部窗口 '+(s.extWindows??0)+' 个 · SSH 连接 '+(s.sshConnections??0)+' 条（在线 '+(s.sshLive??0)+'）',
       '数据目录：'+(s.dataDir||''),'日志共 '+(s.logCount??entries.length)+' 条',
       '--- 最近报错 ---',
       ...(errs.length?errs.map(e=>'['+e.time+'] ['+e.module+'] '+e.msg):['（没有错误记录）'])].join('\n');
     let ok=false;
     try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){
       const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand('copy'); }catch(e2){} ta.remove(); }
     btn.textContent=ok?'已复制 ✓':'复制失败'; setTimeout(()=>{btn.textContent='复制诊断摘要'},1600);
   };
   fetchStat(); tick();
   setInterval(tick,1000);
   setInterval(()=>{ if(vis()) fetchStat(); },5000);
 }
 if(id==='appstore'){
   const G=x=>document.getElementById(x);
   const CATS=['全部','网络通讯','办公文档','开发运维','影音图像','系统工具'];
   let cat='全部', apps=[], wasInstalled={};
   const vis=()=>{const w=G('win-appstore');return !!w&&!w.classList.contains('hidden')};
   const fmtMB=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
   const paintCats=()=>{ G('st-cats').innerHTML=CATS.map(c=>`<button class="stcat${c===cat?' on':''}" data-cat="${c}">${c}</button>`).join('');
     G('st-cats').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;paintCats();paintGrid();}); };
   const paintGrid=()=>{
     const q=(G('st-q').value||'').trim().toLowerCase();
     const list=apps.filter(a=>(cat==='全部'||a.category===cat)&&(!q||(a.name+' '+a.desc).toLowerCase().includes(q)));
     G('st-count').textContent=apps.length?('共 '+apps.length+' 个应用 · 装好后图标会出现在桌面上'):'目录加载中…';
     G('st-grid').innerHTML=list.length?list.map(a=>{
       let btn='';
       if(a.installing){ const pc=a.size?Math.min(99,Math.floor((a.progress||0)/a.size*100)):0;
         btn=`<div class="stbar"><i style="width:${a.phase==='extracting'?100:pc}%"></i></div><span class="mut">${a.phase==='extracting'?'正在释放…':('下载中 '+pc+'%')}</span>`;
       } else if(a.installed){ btn=`<div class="row"><button class="btn" data-open="${a.id}">打开</button><button class="btn gray" data-un="${a.id}">卸载</button></div>`;
       } else if(a.phase==='error'){ btn=`<div class="row"><button class="btn" data-dl="${a.id}">重试</button></div><span style="color:#ff9d97;font-size:12px">${esc(a.stateMsg||'安装失败')}</span>`;
       } else { btn=`<button class="btn" data-dl="${a.id}">下载</button>`; }
       return `<div class="stcard"><div class="sthead">${storeIconHTML(a)}<div style="min-width:0"><b style="font-size:14.5px">${esc(a.name)}</b> <span class="mut" style="font-size:12px">v${esc(a.version)}</span><div class="mut" style="font-size:12px">${fmtMB(a.size)} · ${esc(a.category)}</div></div></div><div class="mut" style="font-size:12.5px;line-height:1.55;flex:1">${esc(a.desc)}</div><div><span class="stbadge">${esc(a.source)}</span></div><div>${btn}</div></div>`;
     }).join(''):'<p class="mut">这个分类下还没有应用。</p>';
     G('st-grid').querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent='开始…'; const r=await api('/api/apps/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.dl})}); if(r&&r.error) alert(r.error); tick(true); });
     G('st-grid').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>launchStoreApp(b.dataset.open));
     G('st-grid').querySelectorAll('[data-un]').forEach(b=>b.onclick=async()=>{ const a=apps.find(x=>x.id===b.dataset.un); if(!a) return;
       if(!confirm('卸载 '+a.name+'？\n便携应用的程序和数据都在同一个文件夹里，卸载会把 '+a.name+' 的本地数据（如聊天记录、配置）一起全部删掉，不可恢复。')) return;
       const r=await api('/api/apps/uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id})});
       if(r&&r.error) alert(r.error); await loadStoreApps(); renderDesk(); tick(true); });
   };
   const tick=async(force)=>{
     if(!force&&!vis()) return;
     try{ const r=await api('/api/apps/catalog'); apps=r.apps||[];
       const nowIn={}; apps.forEach(a=>nowIn[a.id]=!!a.installed);
       let changed=false; apps.forEach(a=>{ if(wasInstalled[a.id]===undefined) return; if(wasInstalled[a.id]!==nowIn[a.id]) changed=true; });
       wasInstalled=nowIn;
       if(changed){ await loadStoreApps(); renderDesk(); }
       G('st-foot').textContent='目录来源：'+(r.source==='remote'?'在线目录（仓库实时更新，加应用不用升级）':'内置目录（在线目录暂时拉不到时的兜底）')+' · 安装位置：Data/apps · 下载走节点加速（全局加速开着时）';
       paintGrid();
     }catch(e){}
   };
   G('st-q').oninput=paintGrid;
   paintCats(); tick(true);
   setInterval(()=>tick(false),1200);
 }
 if(id==='openclaw'){
   const G=x=>document.getElementById(x);
   let ocTimer=null, ocToken='';
   const vis=()=>{const w=G('win-openclaw');return !!w&&!w.classList.contains('hidden')};
   const maskTok=t=>t?(t.slice(0,4)+'••••••••'+t.slice(-4)):'';
   const paintOC=async()=>{
     let r;
     try{ r=await api('/api/openclaw/status'); }catch(e){ return; }
     const info=G('ocinfo'), prog=G('ocprog'), dl=G('ocdl'), panel=G('ocpanel');
     if(!info){ if(ocTimer){clearInterval(ocTimer);ocTimer=null;} return; }
     if(r.installed){
       info.textContent='已安装小龙虾 '+(r.version||'')+(r.updateAvailable?(' · 有新版 '+(r.available||'')+'（在上面重新下载即可更新）'):'');
     } else {
       info.textContent='未安装组件'+(r.available?(' · 可下载版本 '+(r.available||'')+'（约 '+Math.round((r.availableSize||0)/1048576)+' MB）'):'');
     }
     if(dl){
       dl.style.display=r.installed?'none':'';
       dl.textContent='下载组件'+(r.availableSize?('（约 '+Math.round(r.availableSize/1048576)+' MB，走节点下载）'):'');
       dl.disabled=(r.phase==='downloading'||r.phase==='extracting');
     }
     if(r.phase==='downloading'){ prog.textContent='下载中… '+((r.progress||0)/1048576).toFixed(1)+' / '+((r.size||0)/1048576).toFixed(1)+' MB'; }
     else if(r.phase==='extracting'){ prog.textContent='正在释放组件…'; }
     else { prog.textContent=r.stateMsg||''; }
     if(panel) panel.style.display=r.installed?'':'none';
     if(r.installed){
       const vn=G('ocvianode'); if(vn&&document.activeElement!==vn) vn.checked=r.viaNodePref!==false;
       const st=G('ocstat'); if(st){
         let s='状态：'+(r.runMsg||'未启动');
         if(r.running){ s+=' · 端口 '+(r.port||18789)+(r.uptimeText?(' · 已运行 '+r.uptimeText):'')+' · '+(r.viaNode?'走本地节点':'直连');
           if(r.viaNodePref&&!r.viaNode) s+='（开关是走节点，本次没走成）'; }
         st.textContent=s;
       }
       const bs=G('ocstart'), bp=G('ocstop'), bc=G('occonsole');
       if(bs) bs.disabled=!!(r.running||r.starting);
       if(bp) bp.disabled=!r.running;
       if(bc) bc.disabled=!r.healthy;
       ocToken=r.token||'';
       const tk=G('octoken'); if(tk) tk.textContent=r.hasToken?maskTok(ocToken):'（未设置，打开控制台后在小龙虾里查看）';
       const tc=G('octokencopy'); if(tc) tc.disabled=!r.hasToken;
     }
     if((r.phase==='downloading'||r.phase==='extracting'||r.starting)&&!ocTimer) ocTimer=setInterval(()=>{ if(vis()) paintOC(); },1000);
     if(r.phase!=='downloading'&&r.phase!=='extracting'&&!r.starting&&ocTimer){ clearInterval(ocTimer); ocTimer=null; }
   };
   paintOC();
   setInterval(()=>{ if(vis()) paintOC(); },2500);
   G('ocdl').onclick=async()=>{ const r=await api('/api/openclaw/install',{method:'POST'}); if(r&&r.error) alert(r.error); paintOC(); };
   G('ocstart').onclick=async()=>{ const r=await api('/api/openclaw/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({viaNode:G('ocvianode').checked})}); if(r&&r.error) alert(r.error); paintOC(); };
   G('ocstop').onclick=async()=>{ G('ocstat').textContent='状态：停止中…'; const r=await api('/api/openclaw/stop',{method:'POST'}); if(r&&r.error) alert(r.error); paintOC(); };
   G('occonsole').onclick=async()=>{ const r=await api('/api/openclaw/console',{method:'POST'}); if(r&&r.error) alert(r.error); };
   G('ocuninst').onclick=async()=>{ if(!confirm('卸载小龙虾？\n组件程序、它记住的配置和数据都在 Data/openclaw 里，卸载会一并全部删掉，不可恢复。')) return;
     const r=await api('/api/openclaw/uninstall',{method:'POST'}); if(r&&r.error) alert(r.error); paintOC(); };
   G('octokencopy').onclick=async()=>{ if(!ocToken) return; const btn=G('octokencopy'); let ok=false;
     try{ await navigator.clipboard.writeText(ocToken); ok=true; }catch(e){
       const ta=document.createElement('textarea'); ta.value=ocToken; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand('copy'); }catch(e2){} ta.remove(); }
     btn.textContent=ok?'已复制 ✓':'复制失败'; setTimeout(()=>{btn.textContent='复制令牌'},1600); };
 }
 if(id==='core'){
   const loadNodes=async()=>{
     const r=await api('/api/node');
     const c=document.getElementById('ncount'); if(c) c.textContent=`已保存节点 ${r.count} 个 · 代理 ${r.proxy}`;
     const l=document.getElementById('nlist'); if(l) l.innerHTML=r.nodes&&r.nodes.length?r.nodes.map(n=>`• ${esc(n.name)}（${esc(n.type)} ${esc(n.server)}:${n.port}）`).join('<br>'):'还没有节点，先在上面添加。';
   };
   const nodePost=async(body)=>{
     const s=document.getElementById('core-status'); s.textContent='状态：处理中…';
     const r=await api('/api/node',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
     s.textContent='状态：'+(r.error||r.message||'完成'); loadNodes();
   };
   coreAct('status'); loadNodes();
   const loadAccel=async()=>{
     const r=await api('/api/accel');
     const t=document.getElementById('accel-toggle'); if(t) t.textContent='软件内全局加速：'+(r.enabled?'开':'关');
     const s=document.getElementById('accel-state'); if(s) s.textContent=r.enabled?(r.coreRunning?'生效中 · 节点运行中':'已开启 · 节点启动后生效'):'已关闭 · 软件内直连';
   };
   loadAccel();
   document.getElementById('accel-toggle').onclick=async()=>{
     const cur=await api('/api/accel');
     await api('/api/accel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!cur.enabled})});
     loadAccel(); coreAct('status');
   };
   document.getElementById('nadd').onclick=()=>nodePost({link:document.getElementById('nlink').value});
   document.getElementById('nsubbtn').onclick=()=>nodePost({suburl:document.getElementById('nsub').value});
   document.getElementById('nclear').onclick=()=>nodePost({action:'clear'});
   document.getElementById('core-start').onclick=()=>coreAct('start');
   document.getElementById('core-stop').onclick=()=>{coreAct('stop')};
   document.getElementById('core-refresh').onclick=()=>coreAct('status');
   document.getElementById('ptest').onclick=async()=>{
     const s=document.getElementById('core-status'); s.textContent='状态：自检中（经节点连接 Google，最多约 15 秒）…';
     const r=await api('/api/proxytest',{method:'POST'});
     s.textContent=(r.ok?'✅ ':'❌ ')+(r.message||'');
   };
   document.getElementById('corelogbtn').onclick=async()=>{
     const r=await api('/api/core/log');
     const el=document.getElementById('corelog'); el.style.display='block'; el.textContent=r.log||'(暂无日志)';
   };
 }
}
openApp('home');
(async()=>{ await Promise.all([loadLayout(),loadWebApps(),loadStoreApps()]); renderDesk(); })();
</script>
