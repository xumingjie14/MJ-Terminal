<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>铭杰工作站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --glass:rgba(30,30,36,.58);
  --glass-brd:rgba(255,255,255,.22);
  --field:rgba(255,255,255,.09);
  --field-brd:rgba(255,255,255,.16);
  --txt:#f5f5f7;
  --accent:#0a84ff;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:background .5s ease}
/* ---------- menu bar ---------- */
#menubar{position:fixed;top:0;left:0;right:0;height:38px;z-index:1000;display:flex;align-items:center;gap:18px;padding:0 16px;background:rgba(22,22,28,.34);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.14);font-size:13.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#menubar .logo{font-weight:700;font-size:15px;cursor:pointer}
#menubar .mi{opacity:.92;cursor:default}
#menubar .mi b{font-weight:600}
#menubar .sp{flex:1}
#menubar .right{display:flex;align-items:center;gap:16px}
#mb-node{cursor:pointer;display:flex;align-items:center;gap:6px}
#mb-remote{cursor:pointer;display:none;align-items:center;gap:6px;padding:2px 9px;border-radius:9px;background:rgba(255,214,10,.16);border:1px solid rgba(255,214,10,.35)}
#mb-remote #mb-rdot{width:9px;height:9px;border-radius:50%;background:#ffd60a;box-shadow:0 0 8px #ffd60a}
#mb-remote.active{background:rgba(48,209,88,.22);border-color:rgba(48,209,88,.5)}
#mb-remote.active #mb-rdot{background:#30d158;box-shadow:0 0 8px #30d158}
#mb-dot{width:9px;height:9px;border-radius:50%;background:#8e8e93;box-shadow:0 0 6px rgba(0,0,0,.3)}
#mb-dot.on{background:#30d158;box-shadow:0 0 8px #30d158}
#mb-clock{font-variant-numeric:tabular-nums}
/* ---------- desktop icons ---------- */
#icons{position:fixed;inset:0;z-index:5;pointer-events:none}
.icon{position:absolute;width:92px;padding:8px 2px 6px;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;color:#fff;text-align:center;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;transition:left .25s ease,top .25s ease,transform .18s ease,opacity .18s ease}
.icon.dragging{opacity:.9;z-index:60;cursor:grabbing;transform:scale(1.08);filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));transition:transform .18s ease,opacity .18s ease}
.icon img,.fp-item img{-webkit-user-drag:none;user-drag:none}
.icon.dropok{background:rgba(120,200,255,.35);border-color:rgba(255,255,255,.6)}
/* drag placeholder: the empty slot left where the dragged icon was (v0.31) */
.icon-ph{position:absolute;width:92px;border-radius:12px;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.30);pointer-events:none;z-index:4;transition:left .25s ease,top .25s ease}
/* "bud" feedback (v0.31): dropping onto this tile is armed -- dropping
   into a folder, or stacking onto an app to create one. The target
   blooms a rounded plate and its icon pops; the target's NAME never
   changes (that was the identity confusion in the field video). */
.icon.bud{background:rgba(140,210,255,.20);border-color:rgba(255,255,255,.45)}
.icon.bud .appico{transform:scale(1.22);box-shadow:0 0 0 3px rgba(140,210,255,.55),0 12px 28px rgba(0,0,0,.5)}
.appico{transition:transform .2s ease,box-shadow .2s ease}
.appico.folderico{background:rgba(255,255,255,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:8px;box-sizing:border-box}
.fmini{position:relative;width:100%;aspect-ratio:1;border-radius:6px;background:#f5f5f7;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;font-weight:700;color:#333}
.fmini img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;box-sizing:border-box}
.fempty{grid-column:1/3;font-size:26px;align-self:center}
/* ---------- desktop context menu & folder popup ---------- */
#ctxmenu{position:fixed;z-index:3000;min-width:184px;padding:6px;border-radius:12px;background:rgba(32,32,40,.78);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 44px rgba(0,0,0,.5);color:#fff}
#ctxmenu.hidden{display:none}
.ctxitem{padding:8px 12px;border-radius:8px;font-size:13.5px;cursor:pointer}
.ctxitem:hover{background:rgba(120,160,255,.35)}
/* folder open state (v0.31): macOS Launchpad folder form -- the
   desktop dims and blurs behind a centered panel; the title renames
   in place; no button bar. Click outside the panel to close. */
#folderpop{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:rgba(14,14,20,.34);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);color:#fff}
#folderpop.hidden{display:none}
.fp-panel{width:452px;max-width:92vw;max-height:80vh;overflow:auto;padding:22px 22px 18px;border-radius:24px;background:rgba(34,34,44,.72);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.fp-title{font-size:17px;font-weight:650;text-align:center;color:#fff;cursor:text;padding:5px 10px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-title:hover{background:rgba(255,255,255,.08)}
.fp-title-in{width:100%;text-align:center;font:inherit;font-size:17px;font-weight:650;background:rgba(255,255,255,.12);border:1px solid var(--accent);border-radius:9px;color:#fff;padding:4px 8px;outline:none}
.fp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-top:14px}
.fp-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;cursor:pointer;background:transparent;border:0;color:#fff;font-size:11px;touch-action:none;transition:transform .22s ease,opacity .18s ease}
.fp-item:hover{background:rgba(255,255,255,.12)}
.fp-item span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.fp-item.drag-src{opacity:.22}
.fp-ghost{position:fixed;z-index:2600;pointer-events:none;transform:scale(1.08);filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));transition:none}
.fp-empty{grid-column:1/5;text-align:center;padding:16px 6px}
.icon:hover{background:rgba(255,255,255,.10)}
.icon.sel{background:rgba(120,160,255,.30);border-color:rgba(255,255,255,.35)}
.appico{width:54px;height:54px;margin:0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);position:relative}
.icon .n{font-size:12px;margin-top:5px;line-height:1.25;text-shadow:0 1px 5px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-home{background:linear-gradient(180deg,#5ec2ff,#0a62d6)}
.g-term{background:linear-gradient(180deg,#4a4a52,#101014);font-family:ui-monospace,Consolas,monospace;font-size:21px;color:#7dff8a}
.g-files{background:linear-gradient(180deg,#ffe9a8,#f5b301)}
.g-core{background:linear-gradient(180deg,#bf5af2,#7d2ae8)}
.appico.webapp{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.appico.webapp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;box-sizing:border-box;background:#f5f5f7;border-radius:inherit}
.appico.webapp.mini{width:26px;height:26px;font-size:14px;border-radius:7px;margin:0;flex:none}
.appico.webapp.mini img{padding:3px}
.g-firefox{background:linear-gradient(160deg,#ff7139 0%,#e22865 55%,#9059ff 100%)}
.g-ssh{background:linear-gradient(180deg,#3ddc84,#0d5136)}
.g-console{background:linear-gradient(180deg,#48484f,#131316);color:#ffb340;font-family:ui-monospace,Consolas,monospace}
.g-servermon{background:linear-gradient(180deg,#64d2ff,#0a4d8f)}
/* ---------- debug console (v0.22) ---------- */
.cschip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.10);font-size:12px}
.csdot{width:8px;height:8px;border-radius:50%;background:#636366;flex:none}
.csdot.on{background:#30d158}.csdot.off{background:#ff453a}
.csin{background:#1c1c22;border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;outline:none;font:inherit}
.sm-wrap{display:flex;height:100%;min-height:0}
.sm-side{width:176px;flex:none;border-right:1px solid rgba(255,255,255,.09);padding:10px 8px;overflow:auto;background:rgba(255,255,255,.03)}
.sm-side .sm-hd{font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.55;padding:2px 8px 6px}
.sm-it{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:#e8e8ed;min-width:0}
.sm-it:hover{background:rgba(255,255,255,.06)}
.sm-it.on{background:#0a84ff;color:#fff}
.sm-it .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-it .sub{display:block;font-size:11px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{width:8px;height:8px;border-radius:50%;background:#636366;flex:none}
.sdot.on{background:#30d158}.sdot.off{background:#ff453a}.sdot.idle{background:#ffd60a}
.sm-main{flex:1;overflow:auto;padding:14px 16px;min-width:0}
.sm-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.sm-tile{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.sm-tile .k{font-size:11.5px;opacity:.65}
.sm-tile .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.sm-tile .s{font-size:11.5px;opacity:.65;font-variant-numeric:tabular-nums}
.sm-sec{font-size:13px;font-weight:600;margin:16px 0 8px;opacity:.92;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sm-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.sm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.sm-row:last-child{border-bottom:0}
.sm-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.sm-bar i{display:block;height:100%;border-radius:3px;background:#30d158;transition:width .4s}
.sm-bar i.warn{background:#ffd60a}.sm-bar i.bad{background:#ff453a}
canvas.sm-chart{width:100%;height:118px;display:block;cursor:crosshair}
.sm-seg{display:inline-flex;background:rgba(255,255,255,.09);border-radius:9px;padding:2px;gap:2px}
.sm-seg button{border:0;background:transparent;color:#e8e8ed;font:inherit;font-size:12px;padding:3px 10px;border-radius:7px;cursor:pointer}
.sm-seg button.on{background:rgba(255,255,255,.88);color:#111;font-weight:600}
.sm-sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sm-sw input{opacity:0;width:0;height:0;position:absolute}
.sm-sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.22);transition:.15s;cursor:pointer}
.sm-sw i:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sm-sw input:checked + i{background:#30d158}
.sm-sw input:checked + i:before{transform:translateX(16px)}
.sm-num{background:#1c1c22;border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:7px;padding:4px 7px;font:inherit;font-size:12.5px;width:78px;outline:none;font-variant-numeric:tabular-nums}
.sm-cmdout{background:#0b0e14;border-radius:10px;padding:8px 10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;color:#d6e2f0;white-space:pre-wrap;word-break:break-all;max-height:170px;overflow:auto}
.sm-ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sm-ovc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px;cursor:pointer}
.sm-ovc:hover{background:rgba(255,255,255,.07)}
.sm-tip{position:absolute;pointer-events:none;background:rgba(28,28,32,.95);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 8px;font-size:11.5px;font-variant-numeric:tabular-nums;display:none;z-index:5;white-space:nowrap}

.cl{display:flex;gap:8px;white-space:pre-wrap;word-break:break-all}
.cl .ct{color:#8e8e93;flex:none}
.cl .cm{color:#64d2ff;flex:none}
.cl.warn .cmsg{color:#ffd60a}
.cl.error .cmsg{color:#ff6961}
.g-store{background:linear-gradient(160deg,#64d2ff,#0a5cff)}
.g-openclaw{background:linear-gradient(160deg,#ff9a3c 0%,#e23c2e 58%,#8f1d1d 100%)}
.g-sys{background:linear-gradient(180deg,#d1d1d6,#636366)}
.g-browser{background:#fff}
.chrome-dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at center,#4f9cf9 0 34%,transparent 35%),conic-gradient(#ea4335 0 32%,#fbbc05 32% 64%,#34a853 64% 100%)}
/* ---------- windows ---------- */
.win{position:fixed;width:700px;max-width:95vw;height:490px;max-height:calc(100vh - 130px);background:var(--glass);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);display:flex;flex-direction:column;overflow:hidden;color:var(--txt)}
.win.hidden{display:none}
.win.staged{transform-origin:top left;cursor:pointer;transition:transform .18s ease}
.win.staged::after{content:'';position:absolute;inset:0;z-index:60;border-radius:inherit}
#mb-stage{cursor:pointer;opacity:.55}
#mb-stage.on{opacity:1;color:#30d158}
.title{position:relative;height:46px;flex:none;display:flex;align-items:center;padding:0 14px;cursor:move;user-select:none;background:rgba(255,255,255,.05)}
.lights{display:flex;gap:8px}
.lights button{width:13px;height:13px;border-radius:50%;border:0;cursor:pointer;font-size:9px;line-height:1;color:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:0}
.l-close{background:#ff5f57}.l-min{background:#febc2e}.l-max{background:#28c840}
.lights button span{opacity:0}.title:hover .lights button span{opacity:.8}
.title b{position:absolute;left:0;right:0;text-align:center;font-size:13.5px;font-weight:600;pointer-events:none;color:rgba(255,255,255,.92)}
.body{flex:1;overflow:auto;padding:16px;font-size:14px}
.body::-webkit-scrollbar{width:9px}.body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:9px}
.body h2,.body h3{font-weight:650}
.mut{opacity:.72;font-size:13px;line-height:1.7}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);border:0;color:#fff;border-radius:9px;padding:8px 15px;cursor:pointer;font-size:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn:active{filter:brightness(.85)}
.btn.gray{background:rgba(255,255,255,.16)}.btn.red{background:#ff453a}.btn:disabled{opacity:.5}
.txt,.pathin,textarea{flex:1;min-width:120px;background:var(--field);border:1px solid var(--field-brd);color:#fff;border-radius:9px;padding:9px 11px;outline:none;font:inherit}
.txt:focus,.pathin:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.35)}
pre.term{background:rgba(5,7,10,.78);color:#b7ffb0;border-radius:12px;padding:12px;min-height:280px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.55;overflow:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.09);text-align:left}
tr.file{cursor:pointer}tr.file:hover{background:rgba(255,255,255,.08)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px}
a{color:#64d2ff}
/* wallpaper picker */
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.wp{height:64px;border-radius:12px;border:2px solid transparent;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.wp.sel{border-color:var(--accent)}
.wp span{position:absolute;left:7px;bottom:5px;font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}
/* ---------- settings app (v0.30, macOS System Settings grammar) ---------- */
#win-sys{width:920px;height:640px}
.set-wrap{display:flex;height:100%;min-height:0}
.set-side{width:216px;flex:none;border-right:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);display:flex;flex-direction:column;padding:12px 10px;overflow:auto}
.set-search{background:#1c1c22;border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;outline:none;width:100%}
.set-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.3)}
.set-mecard{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;cursor:pointer;margin-top:10px}
.set-mecard:hover{background:rgba(255,255,255,.07)}
.set-mecard.on{background:rgba(10,132,255,.28)}
.set-meico{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.set-nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.set-it{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#ececf1;user-select:none}
.set-it:hover{background:rgba(255,255,255,.06)}
.set-it.on{background:#0a84ff;color:#fff}
.set-ico{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.set-main{flex:1;overflow:auto;padding:22px 26px;min-width:0}
.set-page{max-width:600px}
.set-sec{font-size:15.5px;font-weight:650;margin:22px 0 3px;color:#fff}
.set-sec:first-child{margin-top:0}
.set-desc{font-size:12.5px;opacity:.62;line-height:1.65;margin-bottom:9px}
.set-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.10);margin:8px 0 6px}
.set-stack i{display:block;height:100%;min-width:0}
.set-legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12px;opacity:.85;margin-bottom:4px}
.set-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.set-num{background:#1c1c22;border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:7px;padding:4px 7px;font:inherit;font-size:12.5px;width:82px;outline:none;font-variant-numeric:tabular-nums}
.set-num:focus{border-color:var(--accent)}
.set-val{font-variant-numeric:tabular-nums;opacity:.92}
.set-note{font-size:12px;opacity:.6;line-height:1.6;margin-top:8px}
/* ---------- imported files on the desktop (v0.32) ---------- */
.appico.fileico{position:relative;overflow:hidden}
.appico.fileico .ext{font-size:12.5px;font-weight:800;letter-spacing:.03em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);padding:0 3px;text-align:center;line-height:1.15;word-break:break-all}
.appico.fileico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g-f-pdf{background:linear-gradient(180deg,#ff6b5e,#d92c1f)}
.g-f-img{background:linear-gradient(180deg,#64d2ff,#0a62d6)}
.g-f-txt{background:linear-gradient(180deg,#f2f2f5,#9a9aa0)}
.g-f-txt .ext{color:#3a3a3c;text-shadow:none}
.g-f-csv{background:linear-gradient(180deg,#4cd964,#1d8a3c)}
.g-f-doc{background:linear-gradient(180deg,#5ec2ff,#0a4dcc)}
.g-f-xls{background:linear-gradient(180deg,#5ad08a,#146c2e)}
.g-f-ppt{background:linear-gradient(180deg,#ffab5e,#d95d1f)}
.g-f-zip{background:linear-gradient(180deg,#c9a06a,#8a6134)}
.g-f-exe{background:linear-gradient(180deg,#48484f,#131316)}
.g-f-other{background:linear-gradient(180deg,#aeaeb2,#636366)}
.g-f-dir{background:rgba(255,255,255,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:26px}
#dropveil{position:fixed;inset:10px;z-index:2900;border:2.5px dashed rgba(140,210,255,.9);border-radius:22px;background:rgba(20,40,70,.35);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:650;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
#dropveil.hidden{display:none}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:3200;background:rgba(28,28,34,.9);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;border-radius:12px;padding:10px 18px;font-size:13.5px;box-shadow:0 14px 34px rgba(0,0,0,.45);max-width:80vw;text-align:center}
#toast.hidden{display:none}
.imgstage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:rgba(0,0,0,.25);border-radius:12px;overflow:auto}
.imgstage img{max-width:100%;max-height:100%;object-fit:contain}
.imgstage img.full{max-width:none;max-height:none}
pre.textview{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.65;color:#e8e8ed}
table.gridtab th{background:rgba(255,255,255,.10);font-weight:650}
table.gridtab td,table.gridtab th{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
/* ---------- app store (v0.24) ---------- */
.stcat{text-align:left;padding:7px 11px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.stcat:hover{background:rgba(255,255,255,.10)}
.stcat.on{background:rgba(10,132,255,.28);border-color:rgba(120,190,255,.45)}
.stcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:7px}
.stcard .sthead{display:flex;gap:10px;align-items:center}
.stcard .sthead .appico{width:42px;height:42px;border-radius:10px;font-size:20px;margin:0;flex:none}
.stcard .sthead .appico img{padding:5px}
.stbadge{display:inline-block;padding:2px 8px;border-radius:99px;background:rgba(48,209,88,.20);border:1px solid rgba(48,209,88,.4);font-size:11px;color:#a9efbe}
.stbar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.stbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* ---------- dock ---------- */
#dockwrap{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:center;z-index:900;pointer-events:none}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:7px;padding:8px 10px;background:rgba(30,30,38,.42);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.24);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.ditem{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.dockbtn{border:0;background:transparent;cursor:pointer;padding:0;transition:transform .12s ease-out;transform-origin:bottom center}
.dockbtn .appico{width:52px;height:52px;border-radius:12px;transition:width .12s,height .12s}
.dlabel{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:rgba(40,40,46,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12px;padding:3px 10px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.ditem:hover .dlabel{opacity:1}
.ddot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0}
.ddot.on{opacity:1}
/* ---------- external app windows in the stage strip (v0.18 窗口统一·乙) ---------- */
#extstrip{position:fixed;left:10px;bottom:104px;z-index:25;width:148px;display:flex;flex-direction:column;gap:8px}
#extstrip.hidden{display:none}
#extstrip .extlab{font-size:11px;color:rgba(255,255,255,.88);text-shadow:0 1px 4px rgba(0,0,0,.85);padding:0 2px}
.extcard{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 10px 26px rgba(0,0,0,.42);cursor:pointer;color:#fff;text-align:left;font:inherit;opacity:.8;transition:opacity .25s,border-color .25s,box-shadow .25s}
.extcard:hover{background:rgba(74,74,88,.62);opacity:1}
.extcard .et{min-width:0;flex:1}
.extcard .et b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
/* v0.38: the window the user is actually in gets the accent ring,
   a lit dot and a full-bright title; the rest dim, minimized more. */
.extcard.mini{opacity:.55}
.extcard.active{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px rgba(10,132,255,.55),0 10px 26px rgba(0,0,0,.42)}
.extcard.active .et b{opacity:1}
.extcard .actdot{display:none;width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 6px rgba(10,132,255,.9)}
.extcard.active .actdot{display:block}
/* v0.38: the desktop view's own red traffic light (menubar, far
   left). Unlike the Edge frame's X it HIDES the view instead of
   destroying it, so the return from the tray is the same window. */
#mb-hide{width:13px;height:13px;border-radius:50%;border:0;background:#ff5f57;cursor:pointer;padding:0;flex:none;box-shadow:inset 0 0 2px rgba(0,0,0,.3);color:transparent;font-size:9px;line-height:13px;text-align:center}
#mb-hide:hover{color:rgba(0,0,0,.55);filter:brightness(1.08)}
.extcard .et span{display:block;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="wall"></div>

<div id="menubar">
  <button id="mb-hide" title="关闭桌面（藏到托盘，后台和节点继续跑；点托盘图标原样回来）">✕</button>
  <span class="logo" id="mb-logo"> 铭杰</span>
  <span class="mi"><b id="mb-appname">访达</b></span>
  <span class="mi">文件</span><span class="mi">编辑</span><span class="mi">显示</span><span class="mi">窗口</span><span class="mi">帮助</span>
  <span class="sp"></span>
  <span class="right">
    <span id="mb-remote" title="远程协助状态（点开设置查看）"><span id="mb-rdot"></span><span id="mb-rtxt">远程协助中</span></span>
    <span id="mb-node" title="节点状态"><span id="mb-dot"></span><span id="mb-nodetxt">节点</span></span>
    <span id="mb-stage" title="台前调度：只显示当前应用">▦</span>
    <span>📶</span><span>🔋</span>
    <span id="mb-clock">--</span>
  </span>
</div>

<div id="icons"></div>
<div id="wins"></div>
<div id="extstrip" class="hidden"></div>
<div id="ctxmenu" class="hidden"></div>
<div id="folderpop" class="hidden"></div>
<div id="dropveil" class="hidden">松开，把文件导入到终端桌面</div>
<div id="toast" class="hidden"></div>
<input type="file" id="deskimp" multiple style="display:none">

<div id="dockwrap"><div id="dock"></div></div>

<script>
const APPS=[
 {id:'home',e:'',g:'g-home',glyph:'⌂',n:'工作站'},
 {id:'term',e:'>_',g:'g-term',glyph:'>_',n:'终端'},
 {id:'files',e:'🗂️',g:'g-files',glyph:'🗂️',n:'文件'},
 {id:'browser',e:'',g:'g-browser',glyph:'',n:'谷歌浏览器'},
 {id:'firefox',e:'🦊',g:'g-firefox',glyph:'🦊',n:'Firefox'},
 {id:'ssh',e:'🖥️',g:'g-ssh',glyph:'🖥️',n:'SSH'},
 {id:'servermon',e:'🗄️',g:'g-servermon',glyph:'🗄️',n:'服务器'},
 {id:'console',e:'≡',g:'g-console',glyph:'≡',n:'控制台'},
 {id:'appstore',e:'🛍️',g:'g-store',glyph:'🛍️',n:'应用商店'},
 {id:'openclaw',e:'🦞',g:'g-openclaw',glyph:'🦞',n:'小龙虾'},
 {id:'core',e:'🚀',g:'g-core',glyph:'🚀',n:'节点'},
 {id:'sys',e:'⚙️',g:'g-sys',glyph:'⚙️',n:'设置'},
 /* file viewers (v0.32): real windows in the same openApp system
    (so they join the Stage Manager like everything else), but they
    are viewers, not resident apps -- nodesk keeps them off the
    desktop icon grid and the Dock; file icons wake them. */
 {id:'imgview',e:'🖼️',g:'g-files',glyph:'🖼️',n:'图片',nodesk:true},
 {id:'textview',e:'📄',g:'g-sys',glyph:'≡',n:'文本',nodesk:true},
 {id:'gridview',e:'▦',g:'g-ssh',glyph:'▦',n:'表格',nodesk:true},
 {id:'ziplist',e:'🗂️',g:'g-files',glyph:'🗂️',n:'文件夹',nodesk:true},
 {id:'filepanel',e:'📄',g:'g-sys',glyph:'?',n:'打开文件',nodesk:true},
];
const WALLPAPERS={
 tahoe:{n:'大湖',css:'radial-gradient(1100px 600px at 78% -10%,#ffb35c 0%,transparent 55%),radial-gradient(900px 700px at 12% 110%,#3b1d8f 0%,transparent 60%),linear-gradient(160deg,#1c6dd9 0%,#5b2ee5 52%,#b01e9e 100%)'},
 sonoma:{n:'索诺玛',css:'radial-gradient(900px 550px at 85% 0%,#ffd29d 0%,transparent 55%),radial-gradient(800px 600px at 0% 100%,#7a1e5e 0%,transparent 60%),linear-gradient(150deg,#f2709c 0%,#ff9472 55%,#b24592 100%)'},
 sequoia:{n:'红杉',css:'radial-gradient(900px 650px at 80% 110%,#0f5132 0%,transparent 60%),radial-gradient(700px 500px at 10% -10%,#9be15d22 0%,transparent 50%),linear-gradient(165deg,#06131f 0%,#0b2e2a 60%,#083344 100%)'},
 ventura:{n:'文图拉',css:'radial-gradient(900px 600px at 15% -10%,#f0f 0%,transparent 45%),radial-gradient(900px 700px at 90% 110%,#302b63 0%,transparent 60%),linear-gradient(140deg,#6441a5 0%,#2a0845 90%)'},
 aurora:{n:'极光',css:'radial-gradient(1000px 500px at 60% -20%,#43e97b55 0%,transparent 55%),radial-gradient(800px 600px at 20% 120%,#38f9d755 0%,transparent 55%),linear-gradient(170deg,#050a1f 0%,#0b2740 55%,#12082e 100%)'},
 graphite:{n:'石墨',css:'radial-gradient(900px 600px at 80% 0%,#ffffff14 0%,transparent 50%),linear-gradient(160deg,#232329 0%,#101014 70%,#050507 100%)'},
};
const winsEl=document.getElementById('wins'), iconsEl=document.getElementById('icons'), dockEl=document.getElementById('dock'), wallEl=document.getElementById('wall');
let z=10, sysInfo=null, customWall=false;

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(p,opt){const r=await fetch(p,opt);let t=await r.text();try{return JSON.parse(t)}catch(e){return{raw:t}}}

/* ----- unified settings (v0.30): Data/settings.json via /api/settings -----
   Wallpaper choice and the Stage Manager switch used to live in this
   view's localStorage -- which stays on the HOST PC, the opposite of
   portable. They are daemon settings now and travel with the folder.
   Until the first fetch lands, reads fall back to the old
   localStorage values so the first paint is right; when the daemon
   reports "fresh" (no settings file yet), the old local values are
   migrated up once and the local copies dropped. */
let SETTINGS=null;
const SETDEF={wallpaper:'tahoe',stageManager:false,idleExitMinutes:30,phoneMode:true,phoneTriggerWidth:1200,phoneWidth:400,chromeCacheMB:200,stageAutoClaimBrowser:true,filesOnDesktop:true,remoteEnabled:false,winPlaceOnClaim:true,winHideOnMinimize:true,winCloseToTray:true,immersiveMode:false,desktopFullscreen:false};
function wallKey(){ if(SETTINGS) return SETTINGS.wallpaper||'tahoe'; return localStorage.getItem('mj-wall')||'tahoe' }
function saveSetting(patch){
 if(SETTINGS) Object.assign(SETTINGS,patch);
 return api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)})
  .then(r=>{ if(r&&!r.error) SETTINGS={...SETDEF,...r}; return r });
}
async function loadSettings(){
 try{
  const s=await api('/api/settings');
  SETTINGS={...SETDEF,...s};
  if(s.fresh){
   const patch={};
   const lw=localStorage.getItem('mj-wall'); if(lw&&WALLPAPERS[lw]&&lw!==SETTINGS.wallpaper) patch.wallpaper=lw;
   const ls=localStorage.getItem('mj-stage'); if(ls!==null&&!!SETTINGS.stageManager!==(ls==='1')) patch.stageManager=(ls==='1');
   if(Object.keys(patch).length){ const r=await saveSetting(patch); if(r&&!r.error) SETTINGS={...SETDEF,...r}; }
   localStorage.removeItem('mj-wall'); localStorage.removeItem('mj-stage');
  }
 }catch(e){ if(!SETTINGS) SETTINGS={...SETDEF} }
 applyWallpaper(); updateStageUI();
}
const settingsReady=loadSettings();

/* ----- wallpaper ----- */
function applyWallpaper(){
 if(customWall){wallEl.style.background=`center/cover no-repeat url(/api/wallpaper?v=${Date.now()})`;return}
 const key=wallKey();
 wallEl.style.background=(WALLPAPERS[key]||WALLPAPERS.tahoe).css;
}
async function detectCustomWall(){
 try{const r=await fetch('/api/wallpaper',{method:'GET'});customWall=r.ok}catch(e){customWall=false}
 applyWallpaper();
}
detectCustomWall();

/* ----- menu bar clock ----- */
function tick(){
 const d=new Date();
 const s=d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
 document.getElementById('mb-clock').textContent=s;
}
tick();setInterval(tick,5000);

/* ----- node status in menu bar ----- */
async function pollNode(){
 try{
  const r=await api('/api/core',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status'})});
  document.getElementById('mb-dot').className=r.running?'on':'';
  document.getElementById('mb-dot').id='mb-dot';
  document.getElementById('mb-nodetxt').textContent=r.running?'节点已连':'节点';
 }catch(e){}
}
pollNode();setInterval(pollNode,20000);
document.getElementById('mb-node').onclick=()=>openApp('core');

/* ----- remote assistance indicator in menu bar (v0.33) -----
   Visible whenever remote assistance is switched on (the Settings
   copy promises a persistent marker). Recent operator activity
   (last 60s, reported by the daemon) strengthens it to green. */
async function pollRemote(){
 const el=document.getElementById('mb-remote'); if(!el) return;
 try{
  const s=await api('/api/remote/state');
  if(!s.enabled||!s.supported||s.netState==='off'||s.netState==='unsupported'){ el.style.display='none'; return; }
  el.style.display='flex';
  el.classList.toggle('active',!!s.recentActivity);
  document.getElementById('mb-rtxt').textContent=s.netState==='online'?'远程协助中':(s.netState==='needslogin'?'远程协助待登录':'远程协助启动中');
 }catch(e){ el.style.display='none'; }
}
pollRemote();setInterval(pollRemote,10000);
document.getElementById('mb-remote').onclick=()=>openApp('sys');
document.getElementById('mb-logo').onclick=()=>openApp('home');
/* v0.38: the red light hides this view instead of letting it be
   destroyed (daemon-side SW_HIDE; the tray brings the SAME window
   back). See shellHideHandler in shellview.go. */
document.getElementById('mb-hide').onclick=async()=>{ const r=await api('/api/shell/hide',{method:'POST'}).catch(()=>null); if(r&&r.error) toast(r.error); };
document.getElementById('mb-stage').onclick=()=>toggleStage(!stageOn());
updateStageUI();

/* ----- windows ----- */
function appIcon(a,size){
 if(a.id==='browser')return `<div class="appico g-browser"><div class="chrome-dot"></div></div>`;
 return `<div class="appico ${a.g}">${esc(a.glyph)}</div>`;
}
function makeWin(app,i){
 const w=document.createElement('section');w.className='win hidden';w.id='win-'+app.id;
 w.style.left=(90+i*40)+'px';w.style.top=(86+i*30)+'px';
 w.innerHTML=`<div class="title"><div class="lights"><button class="l-close" data-a="close"><span>✕</span></button><button class="l-min" data-a="min"><span>–</span></button><button class="l-max"><span>＋</span></button></div><b>${app.n}</b></div><div class="body" id="body-${app.id}"></div>`;
 const title=w.querySelector('.title');
 title.addEventListener('pointerdown',ev=>{
   if(ev.target.closest('button'))return;bring(w);
   const sx=ev.clientX-w.offsetLeft, sy=ev.clientY-w.offsetTop;
   function mv(e){w.style.left=Math.max(0,e.clientX-sx)+'px';w.style.top=Math.max(44,e.clientY-sy)+'px'}
   function up(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);saveSession()}
   addEventListener('pointermove',mv);addEventListener('pointerup',up);
 });
 title.addEventListener('dblclick',()=>{w.style.width=w.style.width==='96vw'?'':'96vw';w.style.left=w.style.width?'2vw':'90px';saveSession()});
 w.querySelector('[data-a="close"]').onclick=()=>{w.classList.add('hidden');onWinClosed(app.id);syncDots()};
 w.addEventListener('pointerdown',()=>{ if(w.classList.contains('staged')) openApp(app.id); });
 w.querySelector('[data-a="min"]').onclick=()=>{w.classList.add('hidden');onWinClosed(app.id);syncDots()};
 winsEl.appendChild(w);return w;
}
function bring(w){w.style.zIndex=++z;saveSession()}
function openApp(id){
 let w=document.getElementById('win-'+id);
 if(!w){w=makeWin(APPS.find(a=>a.id===id),APPS.findIndex(a=>a.id===id));render(id)}
 lastApp=id;
 if(stageOn()){ openSet.add(id); setFront(id); }
 else { w.classList.remove('hidden'); bring(w); }
 document.getElementById('mb-appname').textContent=APPS.find(a=>a.id===id).n;
 document.querySelectorAll('.icon').forEach(x=>x.classList.toggle('sel',x.dataset.key==='app:'+id));
 syncDots();
 saveSession();
 /* Settings re-fetches its live rows every time it is opened
    (render/bind only run on first creation). */
 if(id==='sys'&&window.sysRefresh) window.sysRefresh();
}
function syncDots(){
 APPS.forEach(a=>{const d=document.getElementById('ddot-'+a.id);if(!d)return;const w=document.getElementById('win-'+a.id);d.classList.toggle('on',!!w&&!w.classList.contains('hidden'))});
}

/* ----- stage manager (v0.15): one app front, others as live thumbnails ----- */
let openSet=new Set(), frontApp=null, lastApp='home';
function stageOn(){ if(SETTINGS) return !!SETTINGS.stageManager; return localStorage.getItem('mj-stage')==='1' }
function applyStage(w,idx){
 if(!w.classList.contains('staged')){
  w.dataset.sg=JSON.stringify({l:w.style.left,t:w.style.top,wd:w.style.width});
  w.classList.add('staged');
 }
 w.style.left='10px';
 w.style.top=(64+idx*116)+'px';
 w.style.zIndex=20+idx;
 const gw=w.offsetWidth||700;
 w.style.transform=`scale(${(148/gw).toFixed(4)})`;
}
function restoreStage(w){
 if(!w.classList.contains('staged')) return;
 w.classList.remove('staged');
 w.style.transform='';
 try{const g=JSON.parse(w.dataset.sg||'{}'); if(g.l)w.style.left=g.l; if(g.t)w.style.top=g.t; if(g.wd)w.style.width=g.wd;}catch(e){}
}
function layoutStrip(){
 let idx=0;
 APPS.forEach(a=>{
  if(a.id===frontApp||!openSet.has(a.id)) return;
  const w=document.getElementById('win-'+a.id); if(!w) return;
  applyStage(w,idx++);
 });
}
function setFront(id){
 frontApp=id;
 const w=document.getElementById('win-'+id);
 if(w){ restoreStage(w); w.classList.remove('hidden'); bring(w); }
 layoutStrip();
 syncDots();
}
function onWinClosed(id){
 saveSession();
 if(!stageOn()||!openSet.has(id)) return;
 openSet.delete(id);
 const w=document.getElementById('win-'+id);
 if(w) restoreStage(w);
 if(frontApp===id){
  const rest=APPS.map(a=>a.id).filter(x=>openSet.has(x));
  if(rest.length) setFront(rest[rest.length-1]); else frontApp=null;
 } else layoutStrip();
}
function toggleStage(on){
 if(SETTINGS){ SETTINGS.stageManager=on; saveSetting({stageManager:on}); }
 else localStorage.setItem('mj-stage',on?'1':'0');
 updateStageUI();
 if(on){
  openSet=new Set(APPS.map(a=>a.id).filter(x=>{const w=document.getElementById('win-'+x);return w&&!w.classList.contains('hidden')}));
  if(!openSet.size) openSet.add('home');
  const f=openSet.has(lastApp)?lastApp:[...openSet][0];
  const w=document.getElementById('win-'+f);
  if(w) w.classList.remove('hidden');
  setFront(f);
 } else {
  openSet.forEach(x=>{const w=document.getElementById('win-'+x); if(w){ restoreStage(w); w.classList.remove('hidden'); }});
  frontApp=null;
 }
 syncDots();
}
function updateStageUI(){
 const b=document.getElementById('mb-stage'); if(b) b.classList.toggle('on',stageOn());
 refreshExtStrip();
}
/* ----- external app windows in the stage strip (v0.18 窗口统一·乙) -----
   The daemon registers the independent Chrome app windows it launches
   (YouTube, X, ...). With Stage Manager on they appear as static icon
   cards in a group at the left, under the in-system thumbnails;
   clicking one asks the daemon to bring that real window to front. */
async function refreshExtStrip(){
 const box=document.getElementById('extstrip'); if(!box) return;
 if(!stageOn()){ box.classList.add('hidden'); box.innerHTML=''; return; }
 let list=[];
 try{ const r=await api('/api/extwin'); list=(r.windows||[]).filter(x=>!x.shell); }catch(e){}
 if(!list.length){ box.classList.add('hidden'); box.innerHTML=''; return; }

     icon (its stored position, else its old default slot), so the
     desktop keeps its arrangement -- minus the overlaps, which the
     old model could encode and this one cannot express. Folder
     membership and the item set are untouched. If anything had to
     move (or two icons were painted on top of each other), flag it:
     the daemon's /api/layout handler also logs stored-position
     collisions to the console hub (module "layout"). */

    store app, a fresh folder) insert where their stored/default
    position reads among the CURRENT cells. */

/* ----- pure drag logic (v0.31): Launchpad reorder math -----

   desktop reduces to a column-major list of fixed slots (columns
   grow left from the right edge, exactly how deskPos lays out the
   default slots); the folder grid reduces to the same "insertion
   index + shifted assignments" shape in row-major form. */
/*PURE-BEGIN*/

   pointer in column-major reading order: smaller column first

   result is an insertion index in centers' coordinate space. */
function dragInsertIndex(centers,px,py,baseCX,pitch){

 for(const c of centers){
  const cc=dragColOf(c.x,baseCX,pitch);
  if(cc<pc||(cc===pc&&c.y<py)) n++;

 return n;
}
/* Final slot index for every item when the item at originIdx moves
   to targetIdx: a Map visualIndex -> slotIndex covering ALL indices
   (the dragged item included); the others keep their relative order
   and slide by one slot. Always a permutation of 0..count-1. */
function dragShiftMap(count,originIdx,targetIdx){

 m.set(originIdx,targetIdx);
 const others=[]; for(let i=0;i<count;i++) if(i!==originIdx) others.push(i);
 others.forEach((v,j)=>{ m.set(v, j>=targetIdx ? j+1 : j); });

/* A copy of arr with the element at `from` moved to `to`. */
function dragMovedArray(arr,from,to){

}
/* The pre-v0.35 position of an entry: its stored free position

   its old default slot -- source-order slots, 8 per column. Kept
   exact: the v0.35 migration derives the desktop order from where
   the old model would have painted each icon. */
function effPosFor(stored,slot,W,H,pitch){

   from the right edge, exactly the old default-slot geometry, but

    rounding the icons' free coordinates onto the 104px lattice,
    which disagreed with the painted layout whenever a position was

 ph.style.left=ds.slots[oi].x+'px'; ph.style.top=ds.slots[oi].y+'px'; ph.style.height=seq[oi].h+'px';

function updateDrag(ds,px,py){
 /* What is the pointer over? The dragged icon and the placeholder
    are skipped; everything else is hit-tested at its CURRENT
    (possibly mid-slide) position -- what the user sees is what
    counts. */
 let hit=null;
 for(let si=ds.seq.length-1;si>=0;si--){
  const s=ds.seq[si];
  if(s.el===ds.el) continue;
  const r=s.el.getBoundingClientRect();
  if(px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom){ hit=s.el; break; }
 }
 let mode='reorder';
 if(hit&&ds.kind==='web'&&hit.dataset.fid) mode='folder';
 else if(hit&&ds.kind==='web'&&hit.dataset.kind==='web') mode='stack';
 /* Stack-to-create arming: only a steady ~600ms dwell on the SAME
    icon arms it. Moving off (or onto anything else) disarms. */
 if(mode==='stack'){
  if(ds.armEl!==hit){
   disarmDrag(ds);
   ds.armEl=hit;
   ds.armTimer=setTimeout(()=>{
    if(dragState!==ds||ds.armEl!==hit) return;
    ds.armed=true; hit.classList.add('bud');
   },600);
  }
 } else if(ds.armEl) disarmDrag(ds);
 /* Folder tiles bloom at once; an armed stack target keeps its
    bloom. Every other tile stays plain -- names never change. */
 ds.seq.forEach(s=>{ if(s.el!==hit) s.el.classList.remove('bud'); });
 if(mode==='folder'&&hit) hit.classList.add('bud');
 /* Over a folder the dragged icon shrinks, as if into the folder. */
 ds.el.style.transform=(mode==='folder')?'scale(.55)':'';
 ds.hoverEl=hit; ds.hoverMode=mode;
 if(mode!=='reorder') return; /* folder/stack: freeze the reorder gap */
 let t=dragInsertIndex(ds.centers,px,py,dragBaseCX(),DRAG_PITCH);

function applyDragShift(ds){

       name; its thumbnail re-renders from its contents on the next
       renderDesk. */
 if(ds.hoverMode==='folder'&&ds.hoverEl&&ds.kind==='web'){
  const f=folderById(ds.hoverEl.dataset.fid);
  const url=ds.key.slice(4);
  if(f&&!f.items.includes(url)) f.items.push(url);

    LAYOUT.folders.push({id,name:'文件夹',items:[turl,durl]});

    saveLayout(); renderDesk();

   }

       up), glide the dragged icon from the pointer into its slot,
       then re-render: the repaint lands every icon on its new cell
       and persistDeskPos serializes the order back to LAYOUT.pos.

       repaint will assign. */
 const target=ds.targetIdx;
 DESKORDER=dragMovedArray(DESKORDER,ds.originIdx,target);

 el.style.top=ds.slots[target].y+'px';

function endDragVisual(ds){
 ds.el.classList.remove('dragging');

function cancelDrag(ds){

/* Insert a desktop icon arriving from a folder at the slot the

   insertion index measured over the currently painted cells (the
   same counting the desktop drag uses), and the caller's
   save + re-render paints and persists the result. excludeFid
   names a folder tile that is about to vanish (dissolved), so it
   takes no part in the sequence. */
function desktopInsertAt(key,px,py,excludeFid){
 const seq=iconSeq().filter(s=>!(excludeFid&&s.key==='folder:'+excludeFid));

 let t=dragInsertIndex(centers,px,py,dragBaseCX(),DRAG_PITCH);
 t=Math.max(0,Math.min(seq.length,t));
 const keys=seq.map(s=>s.key).filter(k=>k!==key);
 keys.splice(Math.min(t,keys.length),0,key);

function beginFolderDrag(st){

function folderSlotIndexAt(st,px,py){

function applyFolderShift(st,reset){

/* file icon right-click menu: open / rename / export / delete */
function showFileCtx(x,y,f){
 ctxEl.innerHTML=`<div class="ctxitem" id="fc-open">打开</div><div class="ctxitem" id="fc-rename">重命名…</div><div class="ctxitem" id="fc-export">导出到电脑（下载文件夹）</div><div class="ctxitem" id="fc-del" style="color:#ff9d97">删除</div>`;
 ctxEl.classList.remove('hidden');
 ctxEl.style.left=Math.min(x,innerWidth-220)+'px';
 ctxEl.style.top=Math.min(y,innerHeight-190)+'px';
 document.getElementById('fc-open').onclick=()=>{ hideCtx(); openDeskFile(f.path,f.kind); };
 document.getElementById('fc-export').onclick=()=>{ hideCtx(); exportDeskFile(f); };
 document.getElementById('fc-rename').onclick=async()=>{
  hideCtx();
  const nn=prompt('新名字（不能带路径）',f.name);
  if(!nn||nn.trim()===f.name) return;
  const r=await api('/api/files/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old:f.name,new:nn.trim()})});
  if(r.error){ alert('改名失败：'+r.error); return; }
  if(LAYOUT.pos['file:'+f.name]){ LAYOUT.pos['file:'+r.name]=LAYOUT.pos['file:'+f.name]; delete LAYOUT.pos['file:'+f.name]; }
  saveLayout(); await loadDeskFiles(); renderDesk();
 };
 document.getElementById('fc-del').onclick=async()=>{
  hideCtx();
  if(!confirm('删除终端桌面上的「'+f.name+'」？\n删的是终端里的副本（在 Data/files 里），电脑上的原文件不受影响。')) return;
  const r=await api('/api/files/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name})});
  if(r.error){ alert('删除失败：'+r.error); return; }
  delete LAYOUT.pos['file:'+f.name];
  saveLayout(); await loadDeskFiles(); renderDesk();
 };
}
function exportDeskFile(f){
 const a=document.createElement('a');
 a.href='/api/files/raw?path='+encodeURIComponent(f.path)+'&dl=1';
 document.body.appendChild(a); a.click(); a.remove();
}
function setWinTitle(id,t){ const b=document.querySelector('#win-'+id+' .title b'); if(b) b.textContent=t; }
/* ----- open routing: everything resolves inside the system ----- */
async function openDeskFile(p,kind){
 const name=p.split('/').pop();
 if(kind==='image') return openImageViewer(p);
 if(kind==='text'||kind==='docx') return openTextViewer(p);
 if(kind==='csv') return openGridViewer(p);
 if(kind==='dir') return openZipList(p);
 if(kind==='pdf'){
  const r=await api('/api/files/openpdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})}).catch(()=>null);
  if(r&&r.error) alert(r.error);
  return;
 }
 if(kind==='zip'){
  if(!confirm('解压「'+name+'」？\n会在终端的 Data/files 里生成一个同名文件夹，桌面上多一个文件夹图标。')) return;
  const r=await api('/api/files/unzip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})}).catch(()=>null);
  if(!r||r.error){ alert('解压失败：'+((r&&r.error)||'接口没回应')); return; }
  toast('已解压到文件夹「'+r.dir+'」（'+r.count+' 个文件）');
  await loadDeskFiles(); renderDesk();
  return;
 }
 if(kind==='exe'){
  /* Deliberate friction: an imported program really runs on this
     PC. Nothing happens unless the user confirms here. */
  if(!confirm('运行「'+name+'」？\n这是从电脑导入的可执行文件，确认后会真的在这台电脑上运行它。')) return;
  const r=await api('/api/files/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})}).catch(()=>null);
  if(r&&r.error) alert(r.error);
  return;
 }
 openFilePanel(p,kind); /* xlsx / pptx / unknown */
}
/* image viewer: siblings are the other images in the same place */
let IMGV={cur:'',fit:true};
function imageSiblings(p){
 const pool=p.includes('/')?SUBLIST:DESKFILES;
 return pool.filter(f=>f.kind==='image').map(f=>f.path);
}
function openImageViewer(p){
 openApp('imgview'); setWinTitle('imgview',p.split('/').pop());
 IMGV.cur=p; paintImageViewer();
}
function paintImageViewer(){
 const img=document.getElementById('iv-img'); if(!img) return;
 const sib=imageSiblings(IMGV.cur);
 const i=sib.indexOf(IMGV.cur);
 document.getElementById('iv-name').textContent=IMGV.cur.split('/').pop()+(sib.length>1?(' · '+(i+1)+' / '+sib.length):'');
 img.classList.toggle('full',!IMGV.fit);
 img.src='/api/files/raw?path='+encodeURIComponent(IMGV.cur);
 const pv=document.getElementById('iv-prev'), nx=document.getElementById('iv-next');
 if(pv) pv.disabled=sib.length<2; if(nx) nx.disabled=sib.length<2;
}
function stepImage(d){
 const sib=imageSiblings(IMGV.cur); if(sib.length<2) return;
 let i=sib.indexOf(IMGV.cur); i=(i+d+sib.length)%sib.length;
 IMGV.cur=sib[i]; setWinTitle('imgview',IMGV.cur.split('/').pop()); paintImageViewer();
}
async function openTextViewer(p){
 openApp('textview'); setWinTitle('textview',p.split('/').pop());
 const pre=document.getElementById('tv-pre'); if(pre) pre.textContent='读取中…';
 const r=await api('/api/files/text?path='+encodeURIComponent(p)).catch(()=>null);
 if(!pre) return;
 if(!r||r.error){ pre.textContent='打开失败：'+((r&&r.error)||'接口没回应'); return; }
 document.getElementById('tv-name').textContent=r.name;
 document.getElementById('tv-note').textContent=(r.kind==='docx'?'文档预览（仅文字）':'')+(r.truncated?' · 仅显示前 2 MB':'');
 pre.textContent=r.text||'（空文件）';
}
async function openGridViewer(p){
 openApp('gridview'); setWinTitle('gridview',p.split('/').pop());
 const tab=document.getElementById('gv-tab'); if(tab) tab.innerHTML='';
 const note=document.getElementById('gv-note'); if(note) note.textContent='读取中…';
 const r=await api('/api/files/csv?path='+encodeURIComponent(p)).catch(()=>null);
 if(!tab) return;
 if(!r||r.error){ if(note) note.textContent='打开失败：'+((r&&r.error)||'接口没回应'); return; }
 const rows=r.rows||[];
 tab.innerHTML=rows.map((row,i)=>'<tr>'+row.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')+'</tr>').join('')||'<tr><td>（空表格）</td></tr>';
 if(note) note.textContent=r.name+' · 共显示 '+rows.length+' 行'+(r.truncatedRows?'（文件更长，只显示前 200 行）':'')+(r.truncatedCols?' · 列数已截到前 50 列':'');
}
async function openZipList(p){
 openApp('ziplist'); setWinTitle('ziplist',p.split('/').pop());
 const box=document.getElementById('zl-list'); if(box) box.innerHTML='加载中…';
 const r=await api('/api/files/sub?path='+encodeURIComponent(p)).catch(()=>null);
 if(!box) return;
 if(!r||r.error){ box.textContent='打开失败：'+((r&&r.error)||'接口没回应'); return; }
 SUBLIST=r.files||[];
 box.innerHTML=SUBLIST.length?`<table>${SUBLIST.map(it=>`<tr class="file" data-p="${esc(it.path)}" data-k="${it.kind}" data-d="${it.dir}"><td>${it.dir?'📁':'📄'}</td><td>${esc(it.name)}</td><td>${it.dir?'':(it.size/1024).toFixed(1)+' KB'}</td></tr>`).join('')}</table>`:'（空文件夹）';
 box.querySelectorAll('tr.file').forEach(tr=>tr.ondblclick=()=>{
  if(tr.dataset.d==='true'){ toast('子文件夹先不在这里展开（它在 Data/files 里）'); return; }
  openDeskFile(tr.dataset.p,tr.dataset.k);
 });
}
function openFilePanel(p,kind){
 openApp('filepanel');
 const name=p.split('/').pop();
 setWinTitle('filepanel',name);
 const office=(kind==='xlsx'||kind==='pptx');
 document.getElementById('fp2-name').textContent=name;
 document.getElementById('fp2-desc').textContent=office
  ? '这个格式（'+(kind==='xlsx'?'Excel 表格':'PowerPoint 演示')+'）系统内暂时不能直接编辑。两个诚实的办法：传到网页版办公（腾讯文档）里打开编辑，或者导出到这台电脑、用电脑上的 Office 打开。'
  : '这个格式系统里还没有打开方式。可以先导出到这台电脑，用电脑上的软件打开。';
 document.getElementById('fp2-web').style.display=office?'':'none';
 document.getElementById('fp2-web').onclick=()=>openWebApp('https://docs.qq.com/desktop');
 document.getElementById('fp2-exp').onclick=ev=>{ ev.preventDefault(); exportDeskFile({path:p,name}); };
}

async function openWebApp(url){
 const r=await api('/api/appopen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}).catch(()=>null);
 if(r&&r.ok) return;
 if(r&&r.error) return; /* real error (no browser / bad url / test env): nothing more to do from a desktop icon */
 /* old daemon without /api/appopen answers non-JSON: open as a normal link */
 api('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
}

/* dock magnification, like macOS */
dockEl.addEventListener('pointermove',e=>{
 dockEl.querySelectorAll('.dockbtn .appico').forEach(ic=>{
   const r=ic.getBoundingClientRect(),cx=r.left+r.width/2;
   const dist=Math.min(Math.abs(e.clientX-cx),130);
   const s=52+(1-dist/130)*24;
   ic.style.width=s+'px';ic.style.height=s+'px';
 });
});
dockEl.addEventListener('pointerleave',()=>{dockEl.querySelectorAll('.dockbtn .appico').forEach(ic=>{ic.style.width='52px';ic.style.height='52px'})});

async function loadSys(){
 sysInfo=await api('/api/system');
 const el=document.getElementById('home-sys'); if(el) el.textContent=`${sysInfo.os}/${sysInfo.arch} · ${sysInfo.hostname} · CPU ${sysInfo.numCPU} 核 · 主目录 ${sysInfo.home}`;

 const pr=document.getElementById('prompt'); if(pr) pr.textContent=sysInfo.home||'>';
}

let curPath='';
async function loadFiles(p){
 const r=await api('/api/list?path='+encodeURIComponent(p||''));
 if(r.error){document.getElementById('flist').textContent='打开失败：'+r.error;return}
 curPath=r.path;document.getElementById('fpath').value=curPath;
 document.getElementById('flist').innerHTML=`<table>${r.items.map(it=>`<tr class="file" data-p="${esc(it.path)}" data-d="${it.dir}"><td>${it.dir?'📁':'📄'}</td><td>${esc(it.name)}</td><td>${it.dir?'':(it.size/1024).toFixed(1)+' KB'}</td></tr>`).join('')}</table>`;
 document.querySelectorAll('tr.file').forEach(tr=>tr.ondblclick=async()=>{
   if(tr.dataset.d==='true') loadFiles(tr.dataset.p);
   else await api('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:tr.dataset.p})});
 });
}

let history=[],hi=-1;
async function runCmd(cmd){
 const out=document.getElementById('tout'), pr=document.getElementById('prompt');
 if(!cmd.trim())return; history.unshift(cmd);hi=-1;
 out.textContent+=`\r\n${pr.textContent}> ${cmd}\r\n运行中…`;
 const r=await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});
 out.textContent=out.textContent.replace(/运行中…$/,'');
 out.textContent+=(r.output||'')+(r.error?('\r\n[错误] '+r.error):'')+'\r\n';
 if(r.cwd) pr.textContent=r.cwd;
 out.scrollTop=out.scrollHeight;
}
async function coreAct(action){
 const r=await api('/api/core',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
 const s=document.getElementById('core-status'); if(s) s.textContent='状态：'+(r.message||JSON.stringify(r));
 pollNode();
}

   G('set-main').innerHTML=`<div class="set-page"><div class="set-sec">台前调度</div><div class="set-desc">开启后，桌面只显示当前应用，其他打开的应用缩到左侧成一排实时缩略图，点缩略图就切换过来。菜单栏右侧的 ▦ 也可以随开随关。</div><div class="sm-card"><div class="sm-row"><span>台前调度</span><label class="sm-sw"><input type="checkbox" id="ds-stage" ${stageOn()?'checked':''}><i></i></label></div><div class="sm-row"><span>浏览器新窗口自动纳入台前调度</span><label class="sm-sw"><input type="checkbox" id="ds-autoclaim" ${s.stageAutoClaimBrowser!==false?'checked':''}><i></i></label></div></div><p class="set-note">自动纳入：隔离 Chrome / Firefox 自己新开的窗口（网页弹窗、新窗口、拖出的标签、独立的开发者工具）会自动登记进台前调度，方便切换；登记后是否摆位由下方「开窗礼仪」里的开关决定。已经登记的窗口不受这个开关影响。</p><div class="set-sec">小窗手机宽</div><div class="set-desc">桌面窗口没最大化、或窄于触发宽度时，新打开的网站应用按手机宽度落位，网站多会显示手机版页面。只管打开时摆好，之后随你拖动。</div><div class="sm-card"><div class="sm-row"><span>手机宽模式</span><label class="sm-sw"><input type="checkbox" id="ds-pm" ${s.phoneMode?'checked':''}><i></i></label></div><div class="sm-row"><span>触发宽度（桌面窄于此值，px）</span><input class="set-num" id="ds-ptw" type="number" min="600" max="4000" step="50" value="${s.phoneTriggerWidth}"></div><div class="sm-row"><span>手机宽度（落位宽度，px）</span><input class="set-num" id="ds-pw" type="number" min="280" max="800" step="10" value="${s.phoneWidth}"></div></div><div class="set-sec">开窗礼仪</div><div class="set-desc">从终端机打开、或被台前调度认领的窗口，第一次出现时自动摆进桌面区域（约 62% × 85%，菜单栏和 Dock 不会被盖住），你正在终端里操作时桌面还会垫在新窗口后面，就像在自己的系统里开应用；摆好之后完全归你，拖动、最大化都不再被拉回。你在宿主的其他软件里忙时，新窗口只登记、不抢屏。</div><div class="sm-card"><div class="sm-row"><span>新窗口自动落位（桌面垫背）</span><label class="sm-sw"><input type="checkbox" id="ds-place" ${s.winPlaceOnClaim!==false?'checked':''}><i></i></label></div><div class="sm-row"><span>最小化时联动隐藏</span><label class="sm-sw"><input type="checkbox" id="ds-hidemin" ${s.winHideOnMinimize!==false?'checked':''}><i></i></label></div><div class="sm-row"><span>关闭桌面时隐藏到托盘</span><label class="sm-sw"><input type="checkbox" id="ds-tray" ${s.winCloseToTray!==false?'checked':''}><i></i></label></div></div><p class="set-note">联动隐藏：最小化桌面时已登记的窗口整套跟着藏起，桌面自己留在宿主任务栏里找得到，恢复桌面时整套按原样回来（你自己单独最小化的窗口不会被动）。关闭桌面则藏得更彻底：任务栏不留按钮，宿主右下角系统托盘会出现终端机图标，点它（或照旧双击程序）整套恢复。无论哪种藏法，退出系统前所有被藏的窗口都会先恢复显示。</p><div class="set-sec">沉浸模式</div><div class="set-desc">开启后，终端机打开的一切只留在终端机里：已经登记进台前调度的窗口（包括桌面自己）会从宿主任务栏和 Alt-Tab 里消失，切换入口只剩台前调度与 Dock；宿主右下角的托盘图标是回宿主的锚，点它整套回来。没有被台前调度认领的窗口永远不会被隐藏，一直留在宿主任务栏上找得到。</div><div class="sm-card"><div class="sm-row"><span>沉浸模式</span><label class="sm-sw"><input type="checkbox" id="ds-immersive" ${s.immersiveMode?'checked':''}><i></i></label></div><div class="sm-row"><span>桌面全屏</span><label class="sm-sw"><input type="checkbox" id="ds-fullscreen" ${s.desktopFullscreen?'checked':''}><i></i></label></div></div><p class="set-note">桌面全屏：桌面视图以无边框全屏占据它所在的显示器，关掉这个开关就恢复原来的窗口大小与位置；两个开关都即时生效，不用重启。一句实话：万一终端机异常退出（被强杀或崩溃），个别已沉浸的窗口可能暂时留在隐藏状态——把那个窗口关掉即自愈，重新打开终端机时启动清扫也会把它们还原回任务栏。</p><div class="set-sec">导入的文件</div><div class="set-desc">从电脑导入到终端桌面的文件存在 Data/files 里，和应用图标混排在桌面上。关掉只是不在桌面上显示这些图标，文件本身、导入通道（拖入 / 桌面菜单导入 / 粘贴）都不受影响。</div><div class="sm-card"><div class="sm-row"><span>在桌面显示导入的文件</span><label class="sm-sw"><input type="checkbox" id="ds-files" ${s.filesOnDesktop!==false?'checked':''}><i></i></label></div></div></div>`;
   G('ds-stage').onchange=e=>toggleStage(e.target.checked);
   G('ds-files').onchange=async e=>{ const r=await saveSetting({filesOnDesktop:e.target.checked}); if(r&&r.error){ alert('保存失败：'+r.error); e.target.checked=!e.target.checked; return; } renderDesk(); };
   G('ds-autoclaim').onchange=async e=>{ const r=await saveSetting({stageAutoClaimBrowser:e.target.checked}); if(r&&r.error){ alert('保存失败：'+r.error); e.target.checked=!e.target.checked; } };
   const bindWinTgl=(id,key)=>{ const el=G(id); if(el) el.onchange=async e=>{ const r=await saveSetting({[key]:e.target.checked}); if(r&&r.error){ alert('保存失败：'+r.error); e.target.checked=!e.target.checked; } }; };
   bindWinTgl('ds-place','winPlaceOnClaim'); bindWinTgl('ds-hidemin','winHideOnMinimize'); bindWinTgl('ds-tray','winCloseToTray');
   bindWinTgl('ds-immersive','immersiveMode'); bindWinTgl('ds-fullscreen','desktopFullscreen');
   const savePhone=async()=>{ const r=await saveSetting({phoneMode:G('ds-pm').checked,phoneTriggerWidth:+G('ds-ptw').value||1200,phoneWidth:+G('ds-pw').value||400}); if(r&&r.error) alert('保存失败：'+r.error); };
   G('ds-pm').onchange=savePhone; G('ds-ptw').onchange=savePhone; G('ds-pw').onchange=savePhone;
  };
  const paintNetwork=async()=>{
   G('set-main').innerHTML=`<div class="set-page"><div class="set-sec">软件内全局加速</div><div class="set-desc">开着时：桌面窗口、从软件里点开的链接、终端里跑的命令都走节点；宿主电脑自己的浏览器和程序完全不受影响。</div><div class="sm-card"><div class="sm-row"><span>全局加速</span><label class="sm-sw"><input type="checkbox" id="nw-accel"><i></i></label></div><div class="sm-row"><span>当前状态</span><span class="set-val" id="nw-state">读取中…</span></div><div class="sm-row"><span>守护进程下载（更新、组件）</span><span class="set-val" id="nw-route">…</span></div></div><div class="set-sec">节点</div><div class="set-desc">节点链接、订阅导入和节点启停在「节点」应用里。</div><div class="row"><button class="btn gray" id="nw-open">打开节点页</button></div></div>`;
   const paint=async()=>{ const r=await api('/api/accel'); const sw=G('nw-accel'); if(sw) sw.checked=!!r.enabled; const st=G('nw-state'); if(st) st.textContent=r.active?'生效中（节点运行中）':(r.enabled?'已开启，节点启动后生效':'已关闭'); const rt=G('nw-route'); if(rt) rt.textContent=r.active?'走节点':'直连（节点没在跑或加速已关）'; };
   G('nw-accel').onchange=async e=>{ await api('/api/accel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:e.target.checked})}); paint(); pollNode(); };
   G('nw-open').onclick=()=>openApp('core');
   paint();
  };
  const paintBrowser=async()=>{
   const s=SETTINGS||SETDEF;
   G('set-main').innerHTML=`<div class="set-page"><div class="set-sec">隔离 Chrome</div><div class="set-desc">独立档案存在 Data/ChromeProfile，历史、Cookie、登录都在里面，跟着文件夹走。</div><div class="sm-card"><div class="sm-row"><span>档案大小</span><span class="set-val" id="br-chrome-size">读取中…</span></div><div class="sm-row"><span>磁盘缓存上限（MB，0 = 不限制）</span><input class="set-num" id="br-cache" type="number" min="0" max="2000" step="50" value="${s.chromeCacheMB}"></div></div><p class="set-note">缓存是档案长胖的主因。上限在下次打开隔离 Chrome 时生效（启动参数 --disk-cache-size）；已经开着的窗口不受影响。要立刻瘦身去「存储空间」一键清理。</p><div class="set-sec">Firefox</div><div class="sm-card"><div class="sm-row"><span>组件状态</span><span class="set-val" id="br-ff">读取中…</span></div><div class="sm-row"><span>管理</span><button class="btn gray" id="br-ff-open">打开 Firefox 页</button></div></div><div class="set-sec">谷歌云同步</div><div class="set-desc">Chrome 的登录搬不了家（被那台电脑的 Windows 账户锁着），但开启谷歌同步后，换一台电脑在隔离 Chrome 里登一次谷歌，密码、书签、历史就会同步回来。同步开关在谷歌浏览器页里。</div><div class="row"><button class="btn gray" id="br-sync">去谷歌浏览器页开同步</button></div></div>`;
   G('br-cache').onchange=async()=>{ const r=await saveSetting({chromeCacheMB:+G('br-cache').value||0}); if(r&&r.error){ alert('保存失败：'+r.error); G('br-cache').value=(SETTINGS||SETDEF).chromeCacheMB; } };
   G('br-ff-open').onclick=()=>openApp('firefox');
   G('br-sync').onclick=()=>openApp('browser');
   try{ const ff=await api('/api/firefox'); const el=G('br-ff'); if(el) el.textContent=ff.installed?('已安装 · v'+(ff.version||'?')):'未安装（去 Firefox 页下载组件）'; }catch(e){}
   try{ const u=await storageUsageOnce(); const el=G('br-chrome-size'); if(el){ const g=(u.groups||[]).find(x=>x.key==='chrome'); el.textContent=g?fmtB(g.bytes):'—'; } }catch(e){}
  };
  const paintComponents=async()=>{
   G('set-main').innerHTML=`<div class="set-page"><div class="set-sec">组件</div><div class="set-desc">按需下载的重型组件，装在 EXE 旁，跟着文件夹走。点「管理」去各自的应用页下载、启停或卸载。</div><div class="sm-card"><div class="sm-row"><span>🦊 Firefox</span><span class="row"><span class="set-val" id="cp-ff">读取中…</span><button class="btn gray" data-openapp="firefox">管理</button></span></div><div class="sm-row"><span>🦞 小龙虾 OpenClaw</span><span class="row"><span class="set-val" id="cp-oc">读取中…</span><button class="btn gray" data-openapp="openclaw">管理</button></span></div><div class="sm-row"><span>📦 应用隔离 Sandboxie</span><span class="row"><span class="set-val" id="cp-sbie">读取中…</span><button class="btn gray" id="cp-sbie-go">管理</button></span></div></div><p class="set-note">应用隔离的组件包已内置在程序里（装的时候不用联网），驱动装在当前这台电脑上；细节和诚实说明在「应用隔离」页。</p></div>`;
   G('set-main').querySelectorAll('[data-openapp]').forEach(b=>b.onclick=()=>openApp(b.dataset.openapp));
   G('cp-sbie-go').onclick=()=>goto('isolation');
   try{ const sb=await api('/api/sandbox/status'); const el=G('cp-sbie'); if(el) el.textContent=!sb.supported?'当前平台不支持':(sb.installed?('已安装 · v'+(sb.version||'?')+(sb.serviceState==='RUNNING'?' · 运行中':' · 服务异常')):'未安装'); }catch(e){}
   try{ const ff=await api('/api/firefox'); const el=G('cp-ff'); if(el) el.textContent=ff.installed?('已安装 · v'+(ff.version||'?')):'未安装'; }catch(e){}
   try{ const oc=await api('/api/openclaw/status'); const el=G('cp-oc'); if(el) el.textContent=oc.installed?('已安装 · v'+(oc.version||'?')+(oc.running?' · 运行中':'')+(oc.diskBytes?' · '+fmtB(oc.diskBytes):'')):'未安装'; }catch(e){}
  };
  const paintIsolation=()=>{
   if(sbxIv){ clearInterval(sbxIv); sbxIv=null; }
   G('set-main').innerHTML=`<div class="set-page"><div class="set-sec">应用隔离</div><div class="set-desc">没有便携版的软件（比如微信），可以装进一个<b style="color:#fff">隔离盒子</b>：安装时它往 Program Files、注册表、AppData 写的东西，全被隔离组件（Sandboxie Plus）截进 EXE 旁的 <b style="color:#fff">Data/sandbox</b>。程序和数据跟着文件夹走，删掉盒子就是真卸载，宿主电脑不留东西。</div><div class="sm-card" id="sbx-card"><div class="sm-row"><span>读取中…</span></div></div><div class="set-sec">先说清楚</div><div class="set-desc">① 安装组件要过<b style="color:#fff">一次管理员确认</b>（驱动必须进系统），驱动和服务会常驻在这台电脑上，直到你在这里卸载组件为止——所以这个功能适合<b style="color:#fff">你自己的电脑</b>，不要在公用、共享电脑上装。<br>② 盒内应用<b style="color:#fff">默认直连网络</b>。应用自己支持填代理的（如 Telegram），在应用里把代理指向 127.0.0.1:2080 就能走终端的节点；把不认代理的应用的全部流量强制掰进节点，是 Sandboxie 的付费功能，本产品不提供。<br>③ 要往系统里装服务/驱动的软件、带强 DRM 或反作弊的软件，可能在盒子里装不上或跑不起来，这是这类软件的性质，装的时候会如实报错。<br>④ 换电脑时盒子跟着文件夹走，新电脑上把组件装一次就能接着用；个别软件有机器绑定授权或账号风控，可能要重新激活或扫码登录，那是软件自己的规矩。<br>⑤ 组件安装包（约 24 MB）已经<b style="color:#fff">内置在程序里</b>，没网也能装；只有内置包释放失败时才联网下载，下载后照样验 SHA-256。<br>⑥ 沙盒默认只隔离「写」、不隔离「读」：盒子里没有的文件，应用会<b style="color:#fff">读到宿主机上的真实文件</b>。所以对<b style="color:#fff">数据封堵名单</b>内的应用（当前：微信家族），它们的数据目录被设为「只认盒内」：宿主机那份数据对它们不存在，盒内从一份全新数据开始、之后也只长在盒子里，换电脑跟着文件夹走。名单外的应用写入始终隔离，但读取仍可能看到宿主机上的同名文件，装之前心里有数。</div><div class="set-sec">盒子</div><div class="sm-card" id="sbx-boxcard"><div class="sm-row"><span>读取中…</span></div></div><div class="set-sec">盒内应用</div><div class="set-desc">在「应用商店」里用隔离安装添加；登记后图标直接上桌面，双击打开。在这里也能启动和移除。</div><div class="sm-card" id="sbx-apps"><div class="sm-row"><span>读取中…</span></div></div></div>`;
   const paint=async()=>{
    let st; try{ st=await api('/api/sandbox/status'); }catch(e){ return; }
    const card=G('sbx-card'); if(!card) return;
    const comp=st.component||{};
    let h='';
    if(!st.supported){
     h=`<div class="sm-row"><span>当前平台</span><span class="set-val">不支持（应用隔离需要 Windows）</span></div>`;
    } else if(comp.busy){
     const pc=comp.size?Math.min(99,Math.floor((comp.progress||0)/comp.size*100)):0;
     h=`<div class="sm-row"><span>组件状态</span><span class="set-val">${esc(comp.message||'处理中…')}</span></div>`+(comp.size?`<div class="sm-row"><span>进度</span><span class="set-val">${pc}%</span></div>`:'')+`<p class="set-note">如果屏幕上弹出了系统的管理员确认窗口，点「是」才会继续。</p>`;
    } else if(!st.installed){
     h=`<div class="sm-row"><span>组件状态</span><span class="set-val">未安装</span></div><div class="sm-row"><span>组件</span><span class="set-val">Sandboxie Plus v${esc(st.pinnedVersion||'')}</span></div><div class="sm-row"><span>安装</span><span class="row"><button class="btn" id="sbx-install">安装组件</button></span></div><p class="set-note">点安装后会弹出一次系统管理员确认（UAC），同意后全程自动，不用再点别的。</p>`;
     if(comp.phase==='error') h+=`<p class="set-note" style="color:#ff9d97">${esc(comp.message||'上次安装没成功')}</p>`;
    } else {
     const ready=st.serviceState==='RUNNING'&&st.iniPlaced;
     h=`<div class="sm-row"><span>组件状态</span><span class="set-val">${ready?'已就绪':(st.serviceState!=='RUNNING'?'服务异常':'盒子待落位')}</span></div>`
      +`<div class="sm-row"><span>版本</span><span class="set-val">Sandboxie Plus v${esc(st.version||'?')}</span></div>`
      +`<div class="sm-row"><span>服务 / 驱动</span><span class="set-val">${esc(st.serviceState||'—')} / ${esc(st.driverState||'—')}</span></div>`
      +(st.metaSource?`<div class="sm-row"><span>组件来源</span><span class="set-val">${st.metaSource==='embedded'?'内置组件包':'在线下载'}${st.metaAt?(' · '+esc(st.metaAt)):''}</span></div>`:'')
      +`<div class="sm-row"><span>管理</span><span class="row"><button class="btn gray" id="sbx-repair">修复</button><button class="btn red" id="sbx-uninstall">卸载组件</button></span></div>`
      +(ready?'':`<p class="set-note">修复会重新启动服务、把盒子按当前 Data 位置落位（可能要再过一次管理员确认）。</p>`);
     if(comp.phase==='error') h+=`<p class="set-note" style="color:#ff9d97">${esc(comp.message||'')}</p>`;
     if(comp.phase==='done'&&comp.message) h+=`<p class="set-note">${esc(comp.message)}</p>`;
    }
    card.innerHTML=h;
    const bi=G('sbx-install'); if(bi) bi.onclick=async()=>{ bi.disabled=true; const r=await api('/api/sandbox/component/install',{method:'POST'}); if(r&&r.error) alert(r.error); paint(); };
    const br=G('sbx-repair'); if(br) br.onclick=async()=>{ br.disabled=true; br.textContent='修复中…'; const r=await api('/api/sandbox/component/repair',{method:'POST'}); if(r&&r.error) alert('修复没成功：'+r.error); else alert('修复完成：'+(r.message||'')); paint(); };
    const bu=G('sbx-uninstall'); if(bu) bu.onclick=async()=>{ if(!confirm('卸载隔离组件？\n驱动和服务会从这台电脑移除（要过一次管理员确认）。盒子里已装的应用和数据保留在 Data/sandbox，以后重装组件还能接着用。')) return; const r=await api('/api/sandbox/component/uninstall',{method:'POST'}); if(r&&r.error) alert(r.error); paint(); };
    const bc=G('sbx-boxcard'); if(bc){
     bc.innerHTML=`<div class="sm-row"><span>盒子占用</span><span class="set-val">${fmtB(st.boxBytes||0)}</span></div><div class="sm-row"><span>盒子位置</span><span class="set-val" style="font-size:11.5px">${esc(st.boxRoot||'')}</span></div><div class="sm-row"><span>清空盒子</span><span class="row"><button class="btn red" id="sbx-clear">清空盒子</button></span></div><p class="set-note">清空 = 盒内全部应用和数据一起删掉，等于把它们全部卸载。组件本身不卸载。</p>`;
     const cl=G('sbx-clear'); if(cl) cl.onclick=async()=>{ if(!confirm('真的要清空盒子？盒内全部应用和数据都会删掉，不可恢复。')) return; if(!confirm('再确认一次：盒子里装的软件（比如微信和它的聊天数据）全没了。继续？')) return; const r=await api('/api/sandbox/clear',{method:'POST'}); if(r&&r.error) alert(r.error); await loadBoxApps(); renderDesk(); paint(); };
    }

   const boxRender=(key,html)=>{ if(boxUi===key) return false; boxUi=key; const el=G('st-box'); if(el) el.innerHTML=html; return true; };
   const paintBox=async()=>{
     const boxEl=G('st-box'); if(!boxEl) return;

     if(!st.installed){
       if(boxRender('guide',`<div class="row"><span class="tag">隔离组件还没装，隔离安装用不了</span><button class="btn gray" id="stbox-go">去装组件</button></div>`)){
         G('stbox-go').onclick=()=>{ window.__mjSetPage='isolation'; openApp('sys'); setTimeout(()=>{ if(window.sysGoto) window.sysGoto('isolation'); },80); };
       }
       return;
     }
     if(bi.phase==='choosing'){
       const cands=bi.candidates||[];
       /* v0.43: the render key carries each candidate's liveness,
          so a file that vanishes while this dialog is open is
          struck through on the next tick instead of being
          registered into a ghost. The top ALIVE candidate is
          preselected as a suggestion only — registration still
          takes the explicit button click below. */
       const ckey='choosing:'+cands.map(c=>(c.exists===false?'0':'1')+(c.existing?'E':'')).join('');
       const firstAlive=cands.findIndex(c=>c.exists!==false);

         ? `<label style="display:block;margin-top:5px;font-size:13px;opacity:.55"><input type="radio" disabled> <s>${esc(c.virtual)}</s> <span class="tag">文件已消失，登记不了（多半是别的程序的临时文件）</span></label>`
         : `<label style="display:block;margin-top:5px;font-size:13px"><input type="radio" name="stbox-exe" value="${esc(c.virtual)}" data-sealed="${c.sealed?1:0}" ${i===firstAlive?'checked':''}> ${esc(c.virtual)} <span class="mut">${(c.size/1048576).toFixed(1)} MB</span>${c.existing?' <span class="tag">盒内已有</span>':''}${c.foreign?' <span class="tag">与安装包看起来无关</span>':''}</label>`).join('')}</div>${anyExisting?`<p class="mut" style="margin-top:8px;font-size:12.5px;line-height:1.6">📦 标了「盒内已有」的不是这次新装进来的：本次安装没有新增文件——这个程序应该是已经装在盒子里了（同版本重装时安装器会跳过已存在的文件）。下面是从盒内找到的已有程序，确认是它，登记即可。</p>`:''}${anyForeign?`<p class="mut" style="margin-top:8px;font-size:12.5px;line-height:1.6">⚠️ 标了「与安装包看起来无关」的候选，可能是安装期间盒子里其他程序活动留下的文件，认准你要装的那个再登记。</p>`:''}<p class="mut" id="stbox-sealnote" style="margin-top:8px;font-size:12.5px;line-height:1.6"></p><p class="mut" style="margin-top:4px;font-size:12.5px">这一步已经存盘：关掉页面、重启终端都不会丢，什么时候回来确认都行。</p><div class="row" style="margin-top:10px"><input class="txt" id="stbox-name" placeholder="应用名字（可改）" style="max-width:200px;flex:none"><button class="btn" id="stbox-reg">登记到桌面</button><button class="btn gray" id="stbox-skip">先不登记</button></div>`)){
         const nm=G('stbox-name');
         const topC=firstAlive>=0?cands[firstAlive]:null;
         if(nm&&topC){ const b=(topC.virtual||'').split('\\').pop()||''; nm.value=b.replace(/\.exe$/i,''); }
         const sealNote=()=>{ const sel=boxEl.querySelector('input[name="stbox-exe"]:checked'); const sn=G('stbox-sealnote'); if(sn) sn.textContent=(sel&&sel.dataset.sealed==='1')?'🔒 这个主程序在数据封堵名单里（微信家族）：登记后它在盒内使用一份全新数据，和宿主机上的同名软件互不相通；宿主机那份数据不会被读到、也不会被改动。':''; };
         boxEl.querySelectorAll('input[name="stbox-exe"]').forEach(r=>r.onchange=sealNote); sealNote();
         G('stbox-reg').onclick=async()=>{ const sel=boxEl.querySelector('input[name="stbox-exe"]:checked'); if(!sel){ alert('先选一个主程序'); return; } const r=await api('/api/sandbox/box/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:G('stbox-name').value,exe:sel.value})}); if(r&&r.error){ alert(r.error); return; } boxUi=''; await loadBoxApps(); renderDesk(); paintBox(); };
         G('stbox-skip').onclick=async()=>{ await api('/api/sandbox/box/discard',{method:'POST'}); boxUi=''; paintBox(); };
       }
       return;
     }
     if(bi.busy){
       if(boxRender('busy',`<div class="row"><span class="tag" id="stbox-prog">处理中…</span><button class="btn gray" id="stbox-stop">终止本次安装</button></div><p class="mut" style="margin-top:6px;font-size:12.5px">终止只会结束这次安装的进程，盒子里其他应用不受影响。交互式安装的话，安装窗口已经在盒子里打开了，在那个窗口里点完就行。</p>`)){

         p.textContent=(PL[bi.phase]||'处理中')+el+' · '+(bi.message||'处理中…')+(bi.phase==='downloading'&&bi.size?(' · '+Math.min(99,Math.floor((bi.progress||0)/bi.size*100))+'%'):'');
       }

     }
     const key='form:'+bi.phase+':'+(bi.message||'');
     if(boxRender(key,`${bi.phase==='done'?`<p style="font-size:13px">✅ ${esc(bi.message||'')}</p>`:''}${bi.phase==='error'?`<p style="font-size:13px;color:#ff9d97">⚠️ ${esc(bi.message||'没装成')}</p>`:''}${bi.phase==='idle'&&bi.message?`<p style="font-size:13px">ℹ️ ${esc(bi.message)}</p>`:''}<div class="row"><input class="txt" id="stbox-url" placeholder="安装包下载地址（https://… 以 .exe 结尾）"><input class="txt" id="stbox-sha" placeholder="SHA-256（可选）" style="max-width:200px;flex:none"></div><div class="row" style="margin-top:8px"><button class="btn" id="stbox-dl">下载并隔离安装</button><button class="btn gray" id="stbox-local">导入本地安装包…</button><input type="file" id="stbox-file" accept=".exe,.msi" style="display:none"><span class="tag" id="stbox-fmsg"></span></div><p class="mut" style="margin-top:8px;font-size:12.5px;line-height:1.6">认得出类型的安装器（NSIS / Inno）会自动静默安装；认不出的会在盒子里打开安装界面，你照常点完就行。MSI 安装包的安装服务在盒子外，隔离不住，不接。</p>`)){
       G('stbox-dl').onclick=async()=>{ const u=G('stbox-url').value.trim(); if(!u){ alert('先填安装包地址'); return; } const r=await api('/api/sandbox/box/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,sha256:G('stbox-sha').value.trim()})}); if(r&&r.error){ alert(r.error); return; } boxUi=''; paintBox(); };
       G('stbox-local').onclick=()=>G('stbox-file').click();
       G('stbox-file').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const msg=G('stbox-fmsg'); if(msg) msg.textContent='导入中…'; const fd=new FormData(); fd.append('file',f); let r=null; try{ r=await (await fetch('/api/sandbox/import',{method:'POST',body:fd})).json(); }catch(err){} if(!r||r.error){ if(msg) msg.textContent='导入失败：'+((r&&r.error)||'网络错误'); return; } const rr=await api('/api/sandbox/box/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:r.name})}); if(rr&&rr.error){ alert(rr.error); return; } boxUi=''; paintBox(); };
     }
   };

   };
 }
}
openApp('home');
(async()=>{ await Promise.all([loadLayout(),loadWebApps(),loadStoreApps(),loadBoxApps(),loadDeskFiles(),settingsReady]); renderDesk(); restoreSession(); })();
