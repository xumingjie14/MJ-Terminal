      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.69
          prerelease: false
          name: 铭杰终端机 v0.69（正式版 · 任务管理器 / 添加应用 / 下载与文件保存）
          body: |
            本次更新包含下列新功能与改进。本版本与 v0.69-test4 内容相同，该测试版已通过完整验证，现正式发布；本次仅将发布方式由测试版改为正式版，更新将通过正式通道提供。
            本更新为 64 位版本：解压后运行 MJ-System.exe（需要 64 位 Windows）。可直接替换原 EXE 文件升级，也可在「设置 → 软件更新」中完成更新；数据文件夹无需改动。
            **任务管理器**
            - 菜单栏新增任务管理器入口（可在「设置 → 桌面与 Dock → 菜单栏」中关闭），点击可快速查看各应用的资源占用；同时新增独立的「任务管理器」应用，可从桌面、启动台或聚焦搜索打开。
            - 仅显示终端机自己的进程，并按应用分组：浏览器及其全部子进程合并为一组，Firefox 的两个条目分别显示，另有节点核心、生产力组件、商店应用与沙盒应用。电脑上其他软件的进程不会出现在列表中，也不会被结束。
            - 每个进程与每组均显示 CPU 与内存占用，列表可按列排序、搜索与折叠，打开时每秒刷新，关闭后即停止；无响应的窗口会标记为「无响应」。在终端机内打开的窗口也会列在其中，结束时按正常关闭窗口的方式处理。
            - 普通进程可直接结束；结束节点核心或整个浏览器前会先请您确认。节点核心可在此停止并重新启动。守护进程本身单独显示（版本、运行时长与自身占用），没有结束按钮，如需退出请使用「设置 → 退出系统」。所有操作均会记录在控制台中。
            **添加应用**
            - 通过 Chrome 的「安装应用」添加的网页应用不会出现在终端机桌面上；本次更新新增了终端机自己的添加方式。
            - 在「台前调度」中右键点击某个应用化窗口的卡片，选择「固定为桌面应用」，即可将其添加到桌面。
            - 在桌面右键菜单或启动台中选择「添加应用…」，粘贴网址后，终端机会自动获取网页标题供您确认或修改，并在保存时获取网站图标（无法获取时将使用以名称首字生成的图标）；若该网址已经添加，会提示已存在，不会重复添加。添加的应用会同时出现在桌面、Dock、台前调度与聚焦搜索中，可通过右键菜单重命名或移除。
            **下载与文件保存**
            - 浏览器下载的文件现在会保存到终端机的数据文件夹中（Data 文件夹内的 Downloads 文件夹）。图片、链接与网页的「另存为」，以及通过打印保存的 PDF，保存对话框打开时也会从该文件夹开始；下载时不再逐个询问保存位置，点击下载即直接保存。
            - 在桌面视图内产生的下载（如在控制台导出日志、下载文件、通过 SSH 下载文件或导出数据）同样会保存到该文件夹。
            - 终端机会在每次启动浏览器与打开桌面视图时自动应用上述保存设置，应用情况会记录在控制台中；浏览器完全退出后也会自动重新应用，以确保之后每次打开都使用该保存位置。此前版本中，此项设置写入的位置有误，未能实际生效，本次更新已修正。
            - Firefox 同样适用：下载与另存为使用同一保存位置，且不再按网站分别记住上次使用的位置。
            - 浏览器「安装应用」可能会在 Windows 的开始菜单或桌面上生成指向终端机浏览器的快捷方式。终端机会自动删除这类快捷方式（仅限内容明确指向终端机数据文件夹的那一类；您自己的 Chrome 快捷方式不会被删除），如因此留下空文件夹也会一并移除，每次删除均会记录在控制台中。此项可在「设置 → 浏览器」中关闭，默认为开启。
            - 您仍可自由导出文件：在保存对话框中选择其他位置，或将文件拖出浏览器，均不会被拦截；但保存对话框每次打开时都会从数据文件夹开始。
            - 经核查，商店应用、生产力组件、沙盒应用、网站图标与下载文件均位于数据文件夹内。Firefox 程序本体位于终端机文件夹内的 core 文件夹中（在数据文件夹之外，但随终端机文件夹一同携带）。
            **其他改进**
            - 修复了「设置 → 通知」中网页通知的两个开关（允许网页通知、显示网页通知横幅）拨动后不生效的问题，现拨动即保存生效。
            - 数据文件夹中新增 Downloads 与 webicons 两个文件夹，分别用于存放下载文件与网站图标。
            **已知问题**
            - 在新版 Chrome 中，网页通知暂时不可用，将在后续版本中提供支持。原因是新版 Chrome 不再支持终端机目前使用的加载方式；终端机的控制台会记录相关提示，并注明当前浏览器的文件名。
            - 更新后首次使用时，请完全退出并重新打开浏览器，以使下载设置生效。若浏览器在更新前已经打开，它会继续使用先前的下载位置；完全退出后，终端机会自动应用新的设置。极少数情况下，若在设置正在应用时恰好重新打开浏览器，可能需要再完全退出一次；此过程不会损坏任何文件。
            **兼容性**
            - 与 v0.68 完全兼容：仅替换 EXE 文件即可，现有设置、节点与桌面布局会完整保留。
            - 随版本提供的 MJ-Firefox.zip、MJ-OpenClaw.zip 与五个生产力组件包为按需下载的组件；update.json 与 update.json.sig 为自动更新使用的校验文件，手动使用主程序时无需处理。
          files: |
            MJ-System-64bit.zip
            update.json
            update.json.sig
            MJ-Firefox.zip
            firefox.json
            MJ-OpenClaw.zip
            openclaw.json
            MJ-OnlyOffice.zip
            onlyoffice.json
            MJ-LibreOffice.zip
            libreoffice.json
            MJ-ImageGlass.zip
            imageglass.json
            MJ-Krita.zip
            krita.json
            MJ-VSCodium.zip
            vscodium.json
